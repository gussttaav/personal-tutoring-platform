name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply migrations to test database
        run: supabase db push --db-url "${{ secrets.SUPABASE_DB_URL_TEST }}"

      - name: Lint
        run: pnpm lint

      - name: Lint content
        run: pnpm lint:content

      - name: Unit tests
        run: pnpm test:unit
        env:
          NEXT_PUBLIC_SUPABASE_URL:      ${{ secrets.SUPABASE_URL_TEST }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_TEST }}
          SUPABASE_SERVICE_ROLE_KEY:     ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_TEST }}
          CANCEL_SECRET:                 ${{ secrets.CANCEL_SECRET }}
          REALTIME_CHANNEL_SECRET:       ${{ secrets.REALTIME_CHANNEL_SECRET_TEST }}

      - name: Integration tests
        run: pnpm test:integration
        env:
          NEXT_PUBLIC_SUPABASE_URL:      ${{ secrets.SUPABASE_URL_TEST }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_TEST }}
          SUPABASE_SERVICE_ROLE_KEY:     ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_TEST }}
          CANCEL_SECRET:                 ${{ secrets.CANCEL_SECRET }}
          REALTIME_CHANNEL_SECRET:       ${{ secrets.REALTIME_CHANNEL_SECRET_TEST }}
