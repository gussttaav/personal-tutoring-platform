<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 332" width="760" height="332" role="img"
 aria-label="Chart with a logarithmic scale on both axes. Horizontally, the customers that pass the filter, from 1 to 200,000; vertically, how many times slower or faster the nested loop with an index is than the hash join, from 10 times faster to 100 times slower. Three lines, one per situation, rise from left to right and cross the even line at different points. On the SSD, around 80 customers; at 30,000 the index is 65 times slower. In the OS cache, around 11,000; with few customers the index is about 16 times faster. In Postgres's cache, around 36,000; with all 200,000 customers the index is 2 times slower. A grey vertical line at 673 customers marks where Postgres switches algorithm with random_page_cost equal to 4, the same in all three situations; a pink one at 26,161, where it would switch with 1.1. The horizontal axis has marks for Soria, 339 customers, and Madrid, 28,804.">
<style>
  text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #bbcabf; }
  .bx { fill: none; stroke: #86948a; stroke-width: 1; }
  .bx.m { stroke: #4edea3; fill: rgba(78,222,163,0.12); }
  .bx.w { stroke: #e8a24c; fill: rgba(232,162,76,0.12); }
  .bx.g { stroke: #3b3b3e; }
  .bx.f { stroke: #4edea3; fill: #4edea3; }
  .lb { font-size: 12.5px; font-weight: 600; }
  .sb { font-size: 11px; fill: #86948a; }
  .tx { font-size: 11.5px; }
  .tx.d { fill: #86948a; }
  .mo { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
  .hd { font-size: 10.5px; fill: #86948a; letter-spacing: 0.1em; }
  .m { fill: #4edea3; }
  .w { fill: #e8a24c; }
  .sep { stroke: #2a2a2c; stroke-width: 1; }
  .ar { fill: none; stroke: #86948a; stroke-width: 1.2; marker-end: url(#a); }
  .ar.m { stroke: #4edea3; marker-end: url(#am); }
  .ar.w { stroke: #e8a24c; marker-end: url(#aw); }
  .ar.t { stroke-width: 0.9; }
  .mt { stroke: #3b3b3e; stroke-width: 1; stroke-dasharray: 2 2; }
  .mt.m { stroke: #4edea3; }
  .ax { stroke: #86948a; stroke-width: 1; }
  .gl { stroke: #2a2a2c; stroke-width: 1; }
  .tr { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .vl { stroke-width: 1.2; stroke-dasharray: 4 3; }
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#86948a"/></marker><marker id="am" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#4edea3"/></marker><marker id="aw" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#e8a24c"/></marker></defs>
<text class="hd" x="0.0" y="12.0">THE INDEX (NESTED LOOP) AGAINST THE HASH JOIN</text>
<line class="gl" x1="122" y1="235.9" x2="590" y2="235.9"/>
<text class="sb" x="114.0" y="239.9" style="text-anchor:end">10 times faster</text>
<line class="gl" x1="122" y1="170.3" x2="590" y2="170.3" style="stroke:#3b3b3e"/>
<text class="tx" x="114.0" y="174.3" style="text-anchor:end">even</text>
<line class="gl" x1="122" y1="104.8" x2="590" y2="104.8"/>
<text class="sb" x="114.0" y="108.8" style="text-anchor:end">10 times slower</text>
<line class="gl" x1="122" y1="39.2" x2="590" y2="39.2"/>
<text class="sb" x="114.0" y="43.2" style="text-anchor:end">100 times slower</text>
<line class="ax" x1="122.0" y1="262" x2="122.0" y2="266"/>
<text class="sb" x="122.0" y="279.0" style="text-anchor:middle">1</text>
<line class="ax" x1="210.3" y1="262" x2="210.3" y2="266"/>
<text class="sb" x="210.3" y="279.0" style="text-anchor:middle">10</text>
<line class="ax" x1="298.6" y1="262" x2="298.6" y2="266"/>
<text class="sb" x="298.6" y="279.0" style="text-anchor:middle">100</text>
<line class="ax" x1="386.9" y1="262" x2="386.9" y2="266"/>
<text class="sb" x="386.9" y="279.0" style="text-anchor:middle">1,000</text>
<line class="ax" x1="475.1" y1="262" x2="475.1" y2="266"/>
<text class="sb" x="475.1" y="279.0" style="text-anchor:middle">10,000</text>
<line class="ax" x1="563.4" y1="262" x2="563.4" y2="266"/>
<text class="sb" x="563.4" y="279.0" style="text-anchor:middle">100,000</text>
<line class="ax" x1="122" y1="262" x2="590" y2="262"/>
<text class="sb" x="356.0" y="324.0" style="text-anchor:middle">customers that pass the filter</text>
<path d="M345.4,284 l-4,7 l8,0 z" fill="#bbcabf"/>
<text class="tx" x="345.4" y="304.0" style="text-anchor:middle">Soria</text>
<path d="M515.7,284 l-4,7 l8,0 z" fill="#bbcabf"/>
<text class="tx" x="515.7" y="304.0" style="text-anchor:middle">Madrid</text>
<line class="vl" x1="371.7" y1="30" x2="371.7" y2="262" style="stroke:#86948a"/>
<text class="sb" x="376.7" y="40" style="fill:#86948a">Postgres switches here</text>
<text class="sb" x="376.7" y="53" style="fill:#86948a">random_page_cost = 4</text>
<line class="vl" x1="512.0" y1="30" x2="512.0" y2="262" style="stroke:#e87ab8"/>
<text class="sb" x="517.0" y="254" style="fill:#e87ab8">with 1.1</text>
<polyline class="tr" stroke="#e8a24c" points="122.0,208.9 210.3,205.2 298.6,166.2 340.7,146.6 386.9,133.4 429.0,102.2 475.1,74.8 517.3,51.3"/>
<circle cx="122.0" cy="208.9" r="2.6" fill="#e8a24c"/><circle cx="210.3" cy="205.2" r="2.6" fill="#e8a24c"/><circle cx="298.6" cy="166.2" r="2.6" fill="#e8a24c"/><circle cx="340.7" cy="146.6" r="2.6" fill="#e8a24c"/><circle cx="386.9" cy="133.4" r="2.6" fill="#e8a24c"/><circle cx="429.0" cy="102.2" r="2.6" fill="#e8a24c"/><circle cx="475.1" cy="74.8" r="2.6" fill="#e8a24c"/><circle cx="517.3" cy="51.3" r="2.6" fill="#e8a24c"/>
<circle cx="289.2" cy="170.3" r="4.5" fill="none" stroke="#e8a24c" stroke-width="1.5"/>
<text class="tx" x="525.3" y="55.3" style="fill:#e8a24c">on the SSD</text>
<polyline class="tr" stroke="#6fb1e8" points="122.0,251.8 210.3,252.1 298.6,249.9 340.7,247.4 386.9,237.5 429.0,195.5 475.1,172.5 517.3,152.5 563.4,132.6 590.0,125.8"/>
<circle cx="122.0" cy="251.8" r="2.6" fill="#6fb1e8"/><circle cx="210.3" cy="252.1" r="2.6" fill="#6fb1e8"/><circle cx="298.6" cy="249.9" r="2.6" fill="#6fb1e8"/><circle cx="340.7" cy="247.4" r="2.6" fill="#6fb1e8"/><circle cx="386.9" cy="237.5" r="2.6" fill="#6fb1e8"/><circle cx="429.0" cy="195.5" r="2.6" fill="#6fb1e8"/><circle cx="475.1" cy="172.5" r="2.6" fill="#6fb1e8"/><circle cx="517.3" cy="152.5" r="2.6" fill="#6fb1e8"/><circle cx="563.4" cy="132.6" r="2.6" fill="#6fb1e8"/><circle cx="590.0" cy="125.8" r="2.6" fill="#6fb1e8"/>
<circle cx="479.7" cy="170.3" r="4.5" fill="none" stroke="#6fb1e8" stroke-width="1.5"/>
<text class="tx" x="598.0" y="129.8" style="fill:#6fb1e8">in the OS cache</text>
<polyline class="tr" stroke="#4edea3" points="122.0,238.1 164.1,239.3 210.3,242.0 252.4,240.8 298.6,238.9 340.7,227.4 386.9,224.0 429.0,209.0 475.1,188.8 517.3,173.4 563.4,153.7 590.0,148.4"/>
<circle cx="122.0" cy="238.1" r="2.6" fill="#4edea3"/><circle cx="164.1" cy="239.3" r="2.6" fill="#4edea3"/><circle cx="210.3" cy="242.0" r="2.6" fill="#4edea3"/><circle cx="252.4" cy="240.8" r="2.6" fill="#4edea3"/><circle cx="298.6" cy="238.9" r="2.6" fill="#4edea3"/><circle cx="340.7" cy="227.4" r="2.6" fill="#4edea3"/><circle cx="386.9" cy="224.0" r="2.6" fill="#4edea3"/><circle cx="429.0" cy="209.0" r="2.6" fill="#4edea3"/><circle cx="475.1" cy="188.8" r="2.6" fill="#4edea3"/><circle cx="517.3" cy="173.4" r="2.6" fill="#4edea3"/><circle cx="563.4" cy="153.7" r="2.6" fill="#4edea3"/><circle cx="590.0" cy="148.4" r="2.6" fill="#4edea3"/>
<circle cx="524.4" cy="170.3" r="4.5" fill="none" stroke="#4edea3" stroke-width="1.5"/>
<text class="tx" x="598.0" y="152.4" style="fill:#4edea3">in Postgres's cache</text>
