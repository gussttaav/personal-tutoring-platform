<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 276" width="760" height="276" role="img"
 aria-label="Dos casos del filtro que el hash join de DuckDB pasa al escaneo de la tabla grande. Arriba, las líneas de los pedidos de septiembre: la tabla hash con los 82 116 pedidos de septiembre produce el filtro pedido_id entre 2 917 885 y 3 000 000, más un filtro Bloom. Debajo, los 65 grupos de filas de lineas_pedido, guardada en orden de pedido_id: sólo los 3 últimos se cruzan con el rango y se leen; los otros 62 se descartan por su mínimo y su máximo. Se leen 249 458 de 7 498 570 líneas. Abajo, los pedidos de los clientes de Soria: la tabla hash con 339 clientes produce el filtro cliente_id entre 116 y 197 499. Los pedidos están en orden de fecha y cada uno de sus 32 grupos contiene clientes de 1 a 200 000, así que el rango se cruza con los 32 y se leen todos.">
