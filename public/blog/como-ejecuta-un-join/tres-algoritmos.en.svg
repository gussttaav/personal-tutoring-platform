<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" role="img"
 aria-label="Three diagrams, one per algorithm. Nested loop with an index: a list of customers; for customer 42, an arrow goes down a tree-shaped index and five arrows fan out from it to scattered pages of the orders table. n index lookups and one random read per row; it wins when few rows pass the filter. Hash join: the Madrid customers go into a hash table, and the orders table is scanned from start to finish, probing the hash table for every order. n plus m operations, each table read once and in order; it wins when there is a lot to match. Merge join: two sorted columns, order ids and the order_id of each line, with a pointer on each at the value 3 and lines joining equal values. n plus m if already sorted; it wins when the order is already paid for.">
<style>
  text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #bbcabf; }
  .bx { fill: none; stroke: #86948a; stroke-width: 1; }
  .bx.m { stroke: #4edea3; fill: rgba(78,222,163,0.12); }
  .bx.w { stroke: #e8a24c; fill: rgba(232,162,76,0.12); }
  .bx.g { stroke: #3b3b3e; }
  .bx.f { stroke: #4edea3; fill: #4edea3; }
  .lb { font-size: 12.5px; font-weight: 600; }
  .sb { font-size: 11px; fill: #86948a; }
  .tx { font-size: 11.5px; }
  .tx.d { fill: #86948a; }
  .mo { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
  .hd { font-size: 10.5px; fill: #86948a; letter-spacing: 0.1em; }
  .m { fill: #4edea3; }
  .w { fill: #e8a24c; }
  .sep { stroke: #2a2a2c; stroke-width: 1; }
  .ar { fill: none; stroke: #86948a; stroke-width: 1.2; marker-end: url(#a); }
  .ar.m { stroke: #4edea3; marker-end: url(#am); }
  .ar.w { stroke: #e8a24c; marker-end: url(#aw); }
  .ar.t { stroke-width: 0.9; }
  .mt { stroke: #3b3b3e; stroke-width: 1; stroke-dasharray: 2 2; }
  .mt.m { stroke: #4edea3; }
  .ax { stroke: #86948a; stroke-width: 1; }
  .gl { stroke: #2a2a2c; stroke-width: 1; }
  .tr { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .vl { stroke-width: 1.2; stroke-dasharray: 4 3; }
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#86948a"/></marker><marker id="am" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#4edea3"/></marker><marker id="aw" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#e8a24c"/></marker></defs>
<text class="lb" x="0.0" y="14.0">Nested loop with an index</text>
<text class="sb" x="0.0" y="30.0">for each customer, look up their orders</text>
<text class="tx" x="0.0" y="192.0">n index lookups</text>
<text class="tx d" x="0.0" y="207.0">one random read per row</text>
<text class="tx m" x="0.0" y="232.0">wins when few rows pass the filter</text>
<text class="lb" x="262.0" y="14.0">Hash join</text>
<text class="sb" x="262.0" y="30.0">build from the small one, scan the big one</text>
<text class="tx" x="262.0" y="192.0">n + m operations</text>
<text class="tx d" x="262.0" y="207.0">each table read once, in order</text>
<text class="tx m" x="262.0" y="232.0">wins when there is a lot to match</text>
<text class="lb" x="524.0" y="14.0">Merge join</text>
<text class="sb" x="524.0" y="30.0">two sorted lists, two pointers</text>
<text class="tx" x="524.0" y="192.0">n + m, if already sorted</text>
<text class="tx d" x="524.0" y="207.0">advance the smaller key's pointer</text>
<text class="tx m" x="524.0" y="232.0">wins when the order is already paid for</text>
