<text class="lb" x="0.0" y="14.0">Nested loop con índice</text>
<text class="sb" x="0.0" y="30.0">para cada cliente, buscar sus pedidos</text>
<text class="tx" x="0.0" y="192.0">n búsquedas en el índice</text>
<text class="tx d" x="0.0" y="207.0">una lectura aleatoria por fila</text>
<text class="tx m" x="0.0" y="232.0">gana si salen pocas filas del filtro</text>
<text class="lb" x="262.0" y="14.0">Hash join</text>
<text class="sb" x="262.0" y="30.0">construir con la pequeña, recorrer la grande</text>
<text class="tx" x="262.0" y="192.0">n + m operaciones</text>
<text class="tx d" x="262.0" y="207.0">cada tabla se lee una vez, en orden</text>
<text class="tx m" x="262.0" y="232.0">gana si hay que cruzar mucho</text>
<text class="lb" x="524.0" y="14.0">Merge join</text>
<text class="sb" x="524.0" y="30.0">dos listas ordenadas, dos punteros</text>
<text class="tx" x="524.0" y="192.0">n + m, si ya vienen ordenadas</text>
<text class="tx d" x="524.0" y="207.0">avanza el puntero del valor menor</text>
<text class="tx m" x="524.0" y="232.0">gana si el orden ya está pagado</text>
