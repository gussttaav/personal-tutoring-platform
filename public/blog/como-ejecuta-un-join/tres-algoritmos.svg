<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" role="img"
 aria-label="Tres diagramas, uno por algoritmo. Nested loop con índice: una lista de clientes; para el cliente 42, una flecha baja por un índice en forma de árbol y de él salen cinco flechas a páginas dispersas de la tabla de pedidos. n búsquedas en el índice y una lectura aleatoria por fila; gana si salen pocas filas del filtro. Hash join: los clientes de Madrid se guardan en una tabla hash, y la tabla de pedidos se recorre de principio a fin, consultando la tabla hash por cada pedido. n más m operaciones, cada tabla se lee una vez y en orden; gana si hay que cruzar mucho. Merge join: dos columnas ordenadas, los id de pedidos y los pedido_id de las líneas, con un puntero en cada una apuntando al valor 3 y líneas que unen los valores iguales. n más m si ya vienen ordenadas; gana si el orden ya está pagado.">
<style>
  text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #bbcabf; }
  .bx { fill: none; stroke: #86948a; stroke-width: 1; }
