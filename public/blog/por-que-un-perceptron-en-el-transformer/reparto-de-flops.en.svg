<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img"
 aria-label="Line chart. On the horizontal axis, the position of the token in the text, T, on a logarithmic scale from 256 to 131,072. On the vertical axis, the fraction of one layer's operations done by the position-wise perceptron, from 0 to 100%. Three curves, one per model width: d_model equal to 768, to 4,096 and to 12,288. All three start near two thirds, 67%, and fall as T grows; each crosses 50% exactly at T equal to twice d_model: at 1,536, at 8,192 and at 24,576. With d_model equal to 768 and T equal to 131,072 the perceptron is down to 2%; with 12,288, to 24%.">
