<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 262" width="760" height="262" role="img"
 aria-label="Dos filas con la misma estructura de izquierda a derecha: una entrada, unas claves con las que se compara, unos pesos y una suma de valores. Arriba, una cabeza de atención: la consulta de la fila t se compara con T claves que salen del propio texto, una por posición; el softmax convierte las T puntuaciones en pesos positivos que suman uno, y la salida es la suma de los T valores, también sacados del texto, con esos pesos. Abajo, el perceptrón por posiciones: la fila t se compara con d_ff claves guardadas en los parámetros, las columnas de W1, iguales para cualquier texto; la ReLU deja cada coeficiente en cero o en un número positivo, sin normalizar, y la salida es la suma de d_ff valores guardados en las filas de W2, con esos coeficientes. Muchos coeficientes son cero, y sus valores no entran en la suma.">
<style>
