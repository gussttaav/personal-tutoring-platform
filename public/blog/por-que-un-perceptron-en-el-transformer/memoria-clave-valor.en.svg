<rect class="bx m" x="480.0" y="46.0" width="130.0" height="40.0" rx="4"/>
<text class="lb m" x="545.0" y="63.0">T values</text>
<text class="sb" x="545.0" y="77.0">from the text</text>
<path class="ar" d="M612.0,66.0 L638.0,66.0"/>
<rect class="bx g" x="640.0" y="46.0" width="80.0" height="40.0" rx="4"/>
<text class="lb" x="680.0" y="70.0">output</text>
<rect class="m" x="340.0" y="104.0" width="7" height="4.0"/>
<rect class="m" x="351.0" y="94.0" width="7" height="14.0"/>
<rect class="m" x="362.0" y="102.0" width="7" height="6.0"/>
<rect class="m" x="373.0" y="105.0" width="7" height="3.0"/>
<rect class="m" x="384.0" y="99.0" width="7" height="9.0"/>
