<path class="ln" d="M417.0,232.0 L424.0,232.0"/>
<rect class="w" x="428.0" y="228.0" width="7" height="4.0"/>
<text class="sb" x="380.0" y="248.0" style="text-anchor:middle">what is read is written in the weights</text>
