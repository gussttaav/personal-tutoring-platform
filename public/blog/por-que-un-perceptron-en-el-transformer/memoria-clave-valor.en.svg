<rect class="m" x="428.0" y="107.0" width="7" height="1.0"/>
<text class="sb" x="380.0" y="124.0" style="text-anchor:middle">what is read changes with every text</text>
<text class="hd w" x="40.0" y="156.0">THE POSITION-WISE PERCEPTRON</text>
<rect class="bx g" x="40.0" y="170.0" width="100.0" height="40.0" rx="4"/>
<text class="lb" x="90.0" y="194.0">row t</text>
<path class="ar" d="M142.0,190.0 L168.0,190.0"/>
<rect class="bx w" x="170.0" y="170.0" width="130.0" height="40.0" rx="4"/>
<text class="lb w" x="235.0" y="187.0">d_ff keys</text>
<text class="sb" x="235.0" y="201.0">columns of W1</text>
<path class="ar" d="M302.0,190.0 L328.0,190.0"/>
<rect class="bx w" x="330.0" y="170.0" width="120.0" height="40.0" rx="4"/>
<text class="lb w" x="390.0" y="187.0">ReLU</text>
<text class="sb" x="390.0" y="201.0">≥ 0, many 0</text>
<path class="ar" d="M452.0,190.0 L478.0,190.0"/>
<rect class="bx w" x="480.0" y="170.0" width="130.0" height="40.0" rx="4"/>
<text class="lb w" x="545.0" y="187.0">d_ff values</text>
<text class="sb" x="545.0" y="201.0">rows of W2</text>
<path class="ar" d="M612.0,190.0 L638.0,190.0"/>
<rect class="bx g" x="640.0" y="170.0" width="80.0" height="40.0" rx="4"/>
