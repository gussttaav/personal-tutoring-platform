<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 262" width="760" height="262" role="img"
 aria-label="Two rows with the same structure from left to right: an input, some keys it is compared with, some weights and a sum of values. At the top, one attention head: the query of row t is compared with T keys taken from the text itself, one per position; the softmax turns the T scores into positive weights that add up to one, and the output is the sum of the T values, also taken from the text, with those weights. At the bottom, the position-wise perceptron: row t is compared with d_ff keys stored in the parameters, the columns of W1, the same for any text; the ReLU leaves each coefficient at zero or at a positive number, unnormalised, and the output is the sum of d_ff values stored in the rows of W2, with those coefficients. Many coefficients are zero, and their values do not enter the sum.">
<style>
  text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #bbcabf; }
  .bx { fill: none; stroke: #86948a; stroke-width: 1; }
  .bx.m { stroke: #4edea3; fill: rgba(78,222,163,0.08); }
  .bx.w { stroke: #e8a24c; fill: rgba(232,162,76,0.10); }
  .bx.g { stroke: #3b3b3e; }
  .bx.z { stroke: #3b3b3e; stroke-dasharray: 2 2; }
  .lb { font-size: 12px; font-weight: 600; text-anchor: middle; }
  .sb { font-size: 10.5px; fill: #86948a; text-anchor: middle; }
  .tx { font-size: 11px; }
  .hd { font-size: 10px; fill: #86948a; letter-spacing: 0.1em; }
  .m { fill: #4edea3; }
  .w { fill: #e8a24c; }
  .ln { fill: none; stroke: #86948a; stroke-width: 1.2; }
  .ln.m { stroke: #4edea3; stroke-width: 2; }
  .ln.w { stroke: #e8a24c; stroke-width: 2; }
  .ln.t { stroke: #bbcabf; stroke-width: 2; }
  .ln.g { stroke: #2a2a2c; stroke-width: 1; }
  .ln.d { stroke: #86948a; stroke-dasharray: 4 3; }
  .ar { fill: none; stroke: #86948a; stroke-width: 1.2; marker-end: url(#a); }
  .ar.m { stroke: #4edea3; marker-end: url(#am); }
  .ar.w { stroke: #e8a24c; marker-end: url(#aw); }
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#86948a"/></marker><marker id="am" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#4edea3"/></marker><marker id="aw" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#e8a24c"/></marker></defs>
<text class="hd m" x="40.0" y="32.0">ONE ATTENTION HEAD</text>
<rect class="bx g" x="40.0" y="46.0" width="100.0" height="40.0" rx="4"/>
<text class="lb" x="90.0" y="70.0">query of t</text>
<path class="ar" d="M142.0,66.0 L168.0,66.0"/>
<rect class="bx m" x="170.0" y="46.0" width="130.0" height="40.0" rx="4"/>
<text class="lb m" x="235.0" y="63.0">T keys</text>
<text class="sb" x="235.0" y="77.0">from the text</text>
<path class="ar" d="M302.0,66.0 L328.0,66.0"/>
<rect class="bx m" x="330.0" y="46.0" width="120.0" height="40.0" rx="4"/>
<text class="lb m" x="390.0" y="63.0">softmax</text>
<text class="sb" x="390.0" y="77.0">add up to 1</text>
