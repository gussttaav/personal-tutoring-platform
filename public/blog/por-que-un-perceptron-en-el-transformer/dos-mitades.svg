<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img"
 aria-label="Dos paneles, cada uno con las mismas cinco filas de la matriz de entrada, una por posición del texto, apiladas de arriba abajo. A la izquierda, la atención: flechas que salen de las cinco filas convergen en la fila 3, que recibe una media ponderada de todas; es lo único del bloque que mueve información de una posición a otra. A la derecha, el perceptrón por posiciones: cada fila, sola, se ensancha de d_model a d_ff coordenadas, pasa por la ReLU y vuelve a d_model, sin flechas entre filas y con las mismas dos matrices, W1 y W2, para todas.">
<style>
  text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #bbcabf; }
