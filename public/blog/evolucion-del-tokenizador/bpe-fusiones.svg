<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 411 247" width="411" height="247" role="img"
 aria-label="La palabra «programación» partida en caracteres en la fila de arriba y, debajo, una fila por cada fusión de la lista aprendida que le afecta. La fusión 2 pega p con r, la 5 añade la o, la 9 pega la n final con la marca de fin de palabra, y de la 11 a la 15 el trozo crece hasta «programa». La palabra acaba escrita con cinco piezas: programa, c, i, ó y n con la marca de fin.">
