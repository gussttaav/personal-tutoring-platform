<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 726 300" width="726" height="300" role="img"
 aria-label="Gráfica de ejes logarítmicos. El eje horizontal son las palabras leídas de un corpus español, de mil a un millón; el vertical, cuántas unidades distintas han aparecido. La curva de palabras distintas sube sin doblarse, de 278 con mil palabras leídas a 38 792 con 746 368. La de letras distintas es prácticamente plana: 29 al principio y 40 al final. Duplicar el corpus añade miles de palabras al vocabulario y ninguna letra nueva.">
