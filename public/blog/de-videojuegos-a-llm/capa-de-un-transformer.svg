<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img"
 aria-label="Una capa de Llama 3 405B como una fila de multiplicaciones de matrices, con sus tamaños. Entra el vector de un token, de 16 384 números. Atención: consulta, una matriz de 16 384 × 16 384; clave y valor, dos de 16 384 × 1 024; comparar consultas con claves y mezclar valores, dos multiplicaciones más; salida, 16 384 × 16 384. Red feed-forward: dos matrices de 16 384 × 53 248 y una de 53 248 × 16 384. Sale otro vector de 16 384 números. Debajo: unos 3 200 millones de parámetros por capa, por 126 capas, más el vocabulario de 128 000 tokens, unos 405 000 millones.">
<style>
  text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #bbcabf; }
  .bx { fill: none; stroke: #86948a; stroke-width: 1; }
  .bx.m { stroke: #4edea3; fill: rgba(78,222,163,0.14); }
  .bx.w { stroke: #e8a24c; fill: rgba(232,162,76,0.16); }
  .bx.b { stroke: #6fb1e8; fill: rgba(111,177,232,0.14); }
  .bx.g { stroke: #3b3b3e; }
  .bx.s { stroke: #3b3b3e; fill: rgba(134,148,138,0.10); }
  .bx.f { stroke: #4edea3; fill: rgba(78,222,163,0.45); }
  .lb { font-size: 12.5px; font-weight: 600; }
  .sb { font-size: 11px; fill: #86948a; }
  .tx { font-size: 11.5px; }
  .mo { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
  .m { fill: #4edea3; }
  .w { fill: #e8a24c; }
  .b { fill: #6fb1e8; }
  .ed { stroke: #3b3b3e; stroke-width: 1; }
  .gl { stroke: #2a2a2c; stroke-width: 1; }
  .rf { stroke: #86948a; stroke-width: 1; stroke-dasharray: 4 4; }
  .ar { stroke: #86948a; stroke-width: 1.2; fill: none; marker-end: url(#ah); }
</style>
<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7"
  orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#86948a"/></marker></defs>
<rect class="bx m" x="457.4" y="5.0" width="11.0" height="11.0" rx="2"/>
<text class="sb" x="473.4" y="14.0">multiplicación entre tokens, sin parámetros</text>
<rect class="bx w" x="301.4" y="5.0" width="11.0" height="11.0" rx="2"/>
<text class="sb" x="317.4" y="14.0">matriz de parámetros</text>
<rect class="bx b" x="16.0" y="76.0" width="14.0" height="100.0" rx="2"/>
<text class="sb" x="23.0" y="192.0" style="text-anchor:middle">token</text>
<text class="tx" x="23.0" y="206.0" style="text-anchor:middle">16 384</text>
<rect class="bx g" x="46.0" y="36.0" width="382.0" height="176.0" rx="4"/>
<text class="lb" x="56.0" y="52.0">Atención</text>
<rect class="bx w" x="58.0" y="76.0" width="54.0" height="70.0" rx="2"/>
<text class="tx" x="85.0" y="162.0" style="text-anchor:middle">consulta</text>
<text class="tx" x="85.0" y="176.0" style="text-anchor:middle">16 384</text>
<rect class="bx w" x="134.0" y="76.0" width="14.0" height="70.0" rx="2"/>
<text class="tx" x="141.0" y="162.0" style="text-anchor:middle">clave</text>
<text class="tx" x="141.0" y="176.0" style="text-anchor:middle">1024</text>
<rect class="bx w" x="174.0" y="76.0" width="14.0" height="70.0" rx="2"/>
<text class="tx" x="181.0" y="162.0" style="text-anchor:middle">valor</text>
<text class="tx" x="181.0" y="176.0" style="text-anchor:middle">1024</text>
<rect class="bx m" x="214.0" y="88.0" width="46.0" height="46.0" rx="2"/>
<text class="lb" x="237.0" y="115.0" style="text-anchor:middle">×</text>
<text class="tx" x="237.0" y="162.0" style="text-anchor:middle">comparar</text>
<rect class="bx m" x="276.0" y="88.0" width="46.0" height="46.0" rx="2"/>
<text class="lb" x="299.0" y="115.0" style="text-anchor:middle">×</text>
<text class="tx" x="299.0" y="162.0" style="text-anchor:middle">mezclar</text>
<rect class="bx w" x="338.0" y="76.0" width="54.0" height="70.0" rx="2"/>
<text class="tx" x="365.0" y="162.0" style="text-anchor:middle">salida</text>
<text class="tx" x="365.0" y="176.0" style="text-anchor:middle">16 384</text>
<text class="sb" x="237.0" y="202.0" style="text-anchor:middle">las de parámetros tienen 16 384 filas; debajo, sus columnas</text>
<rect class="bx g" x="442.0" y="36.0" width="252.0" height="176.0" rx="4"/>
<text class="lb" x="452.0" y="52.0">Red feed-forward</text>
<rect class="bx w" x="454.0" y="76.0" width="120.0" height="54.0" rx="2"/>
<text class="tx" x="514.0" y="108.0" style="text-anchor:middle">ensanchar ×2</text>
<text class="tx" x="514.0" y="148.0" style="text-anchor:middle">16 384 × 53 248</text>
<rect class="bx w" x="590.0" y="70.0" width="54.0" height="120.0" rx="2"/>
<text class="tx" x="617.0" y="134.0" style="text-anchor:middle">estrechar</text>
<text class="tx" x="617.0" y="206.0" style="text-anchor:middle">53 248 × 16 384</text>
<text class="sb" x="514.0" y="176.0" style="text-anchor:middle">(SwiGLU)</text>
<rect class="bx b" x="708.0" y="76.0" width="14.0" height="100.0" rx="2"/>
<text class="sb" x="715.0" y="192.0" style="text-anchor:middle">token</text>
<text class="tx" x="715.0" y="206.0" style="text-anchor:middle">16 384</text>
<text class="tx" x="380.0" y="238.0" style="text-anchor:middle">≈ 3 200 millones de parámetros por capa × 126 capas + vocabulario (128 000 tokens) ≈ 405 000 millones</text>
</svg>
