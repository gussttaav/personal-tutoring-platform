<text class="tx" x="299.6" y="68.0" style="text-anchor:middle">CUDA</text>
<text class="sb" x="299.6" y="81.0" style="text-anchor:middle">programming the GPU</text>
<circle cx="356.5" cy="102" r="4.5" fill="#4edea3"/>
