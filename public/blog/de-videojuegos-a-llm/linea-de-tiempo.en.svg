<text class="tx" x="356.5" y="147.0" style="text-anchor:middle">Nets on GPUs</text>
<text class="sb" x="356.5" y="160.0" style="text-anchor:middle">up to 70× faster</text>
<circle cx="413.5" cy="102" r="4.5" fill="#4edea3"/>
<line class="ed" x1="413.5" y1="95.0" x2="413.5" y2="85.0"/>
<text class="lb m" x="413.5" y="54.0" style="text-anchor:middle">2012</text>
<text class="tx" x="413.5" y="68.0" style="text-anchor:middle">AlexNet</text>
<text class="sb" x="413.5" y="81.0" style="text-anchor:middle">two GTX 580s</text>
<circle cx="470.4" cy="102" r="4.5" fill="#e8a24c"/>
<line class="ed" x1="470.4" y1="109.0" x2="470.4" y2="119.0"/>
<text class="lb w" x="470.4" y="133.0" style="text-anchor:middle">2015</text>
<text class="tx" x="470.4" y="147.0" style="text-anchor:middle">TPU</text>
<text class="sb" x="470.4" y="160.0" style="text-anchor:middle">systolic array</text>
<circle cx="527.3" cy="102" r="4.5" fill="#e8a24c"/>
<line class="ed" x1="527.3" y1="95.0" x2="527.3" y2="85.0"/>
<text class="lb w" x="527.3" y="54.0" style="text-anchor:middle">2017</text>
<text class="tx" x="527.3" y="68.0" style="text-anchor:middle">Tensor cores</text>
<text class="sb" x="527.3" y="81.0" style="text-anchor:middle">and the transformer</text>
<circle cx="584.2" cy="102" r="4.5" fill="#e8a24c"/>
<line class="ed" x1="584.2" y1="109.0" x2="584.2" y2="119.0"/>
<text class="lb w" x="584.2" y="133.0" style="text-anchor:middle">2022</text>
