<line class="ed" x1="641.1" y1="95.0" x2="641.1" y2="85.0"/>
<text class="lb w" x="641.1" y="54.0" style="text-anchor:middle">2024</text>
<text class="tx" x="641.1" y="68.0" style="text-anchor:middle">B200</text>
<text class="sb" x="641.1" y="81.0" style="text-anchor:middle">FP4</text>
<circle cx="698.0" cy="102" r="4.5" fill="#e8a24c"/>
<line class="ed" x1="698.0" y1="109.0" x2="698.0" y2="119.0"/>
<text class="lb w" x="698.0" y="133.0" style="text-anchor:middle">2025</text>
<text class="tx" x="698.0" y="147.0" style="text-anchor:middle">Ironwood</text>
<text class="sb" x="698.0" y="160.0" style="text-anchor:middle">an inference TPU</text>
<circle cx="670" cy="12" r="4.5" fill="#e8a24c"/>
<text class="sb" x="680.8" y="16.0">AI chips</text>
<circle cx="504" cy="12" r="4.5" fill="#4edea3"/>
<text class="sb" x="514.4" y="16.0">the GPU for computing</text>
<circle cx="402" cy="12" r="4.5" fill="#6fb1e8"/>
<text class="sb" x="412.0" y="16.0">video games</text>
</svg>
