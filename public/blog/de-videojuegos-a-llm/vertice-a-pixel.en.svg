<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" width="760" height="210" role="img"
 aria-label="Four stages from left to right. One, vertices: three points with x, y, z coordinates. Two, place: each vertex is multiplied by the same 4×4 matrix, 16 multiplications and 12 additions per vertex. Three, rasterise: the triangle, now on the screen, over a grid of pixels, with the ones it covers marked. Four, shade: each covered pixel gets its colour from a dot product between the normal and the direction of the light. Below, a note: the same operation for millions of vertices and pixels, none waits for another.">
<style>
  text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #bbcabf; }
  .bx { fill: none; stroke: #86948a; stroke-width: 1; }
