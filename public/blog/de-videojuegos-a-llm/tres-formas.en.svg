<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img"
 aria-label="Three schematics, side by side, of how a chip multiplies matrices. One, GPU cores: the 32 threads of a warp in a row, each with its own multiply and add per cycle, the same instruction for all. Two, tensor core: two 4×4 matrices, A and B, go in together and D equals A times B plus C comes out, 64 multiply-adds in one step. Three, the TPU's systolic array: a grid of cells; the parameters are loaded into the cells, the inputs come in from the left and the partial sums move down from cell to cell until they leave at the bottom, so each number read is used along a whole row.">
<style>
  text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #bbcabf; }
  .bx { fill: none; stroke: #86948a; stroke-width: 1; }
