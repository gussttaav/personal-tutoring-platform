<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 726 470" width="726" height="470" role="img"
 aria-label="Cuatro mapas de contorno del mismo cañón alargado, uno por método, todos con la trayectoria arrancando arriba a la izquierda y veinte pasos dibujados. Descenso de gradiente, arriba a la izquierda: zigzag entre las dos paredes, 35 pasos. Momentum, arriba a la derecha: los primeros rebotes son más cortos cada vez y la trayectoria avanza más deprisa hacia el centro, 14 pasos. RMSProp, abajo a la izquierda: una curva suave que baja en diagonal y luego sigue el eje, sin rebotar, 31 pasos. Adam, abajo a la derecha: una recta en diagonal a cuarenta y cinco grados hasta el eje y luego a lo largo de él, con todos los pasos de la misma longitud, 36 pasos.">
