<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 726 225" width="726" height="225" role="img"
 aria-label="Two contour maps of the same ravine, the function x² plus twenty y², stretched horizontally: the ellipses are much wider than tall. In both, the gradient-descent trajectory starts at the top left. On the left, with rate 0.02, it drops to the horizontal axis in three steps and then creeps toward the centre in short, shrinking steps; it takes 80 steps to arrive. On the right, with rate 0.045, every step crosses the axis and lands on the opposite wall, a zigzag that narrows as it advances toward the centre; it takes 35 steps.">
