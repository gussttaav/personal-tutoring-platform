<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 350" width="360" height="350" role="img" aria-label="Three stacked plots, all with the same parabola: the loss on the vertical axis and the weight on the horizontal, with the minimum in the centre. In all three the first point sits in the same place, on the right, where the weight equals one. Top, with learning rate 0.10, the six points come down the right arm getting closer to the centre by less each time, and the last one stops halfway. Middle, with 0.40, the second point is already almost at the bottom and the third sits on top of it. Bottom, with 1.05, the points jump from one arm to the other and each lands higher than the last: the fifth reaches almost the top edge of the drawing.">
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    .par { stroke: #86948a; stroke-width: 1.4; fill: none; stroke-linejoin: round; }
    .eje { stroke: #86948a; stroke-width: 1.2; }
    .ini { stroke: #3a3a3d; stroke-width: 1; stroke-dasharray: 3 3; }
    .rot { font-size: 12.5px; fill: #86948a; }
    .var { font-size: 12.5px; fill: #86948a; }
    /* Gris claro el paso que funciona pero no termina, verde el que llega, y el color
       de error del tema para el que diverge — el mismo que el explorable de al lado
       le pone a una trayectoria que se escapa del gráfico. */
    .lento { stroke: #bbcabf; fill: #bbcabf; }
    .bien  { stroke: #4edea3; fill: #4edea3; }
    .sube  { stroke: #ffb4ab; fill: #ffb4ab; }
    .salto { stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
    .ver-lento { font-size: 12.5px; fill: #bbcabf; }
    .ver-bien  { font-size: 12.5px; fill: #4edea3; }
    .ver-sube  { font-size: 12.5px; fill: #ffb4ab; }
  </style>

  <!-- Cada panel: x = 164 + 80w (w de -1,5 a 1,5), y = 78 - 30L (L de 0 a 2,6). -->

  <text class="var" x="22" y="167" text-anchor="middle" transform="rotate(-90 22 167)">loss</text>

  <g transform="translate(0,16)">
    <line class="ini" x1="244" y1="48" x2="244" y2="78" />
    <line class="eje" x1="44" y1="78" x2="284" y2="78" />
    <polyline class="par" points="44.0,10.5 52.0,19.2 60.0,27.3 68.0,34.8 76.0,41.7 84.0,48.0 92.0,53.7 100.0,58.8 108.0,63.3 116.0,67.2 124.0,70.5 132.0,73.2 140.0,75.3 148.0,76.8 156.0,77.7 164.0,78.0 172.0,77.7 180.0,76.8 188.0,75.3 196.0,73.2 204.0,70.5 212.0,67.2 220.0,63.3 228.0,58.8 236.0,53.7 244.0,48.0 252.0,41.7 260.0,34.8 268.0,27.3 276.0,19.2 284.0,10.5" />
    <polyline class="lento salto" points="244.0,48.0 228.0,58.8 215.2,65.7 205.0,70.1 196.8,73.0 190.2,74.8" />
    <circle class="lento" cx="244.0" cy="48.0" r="3.2" />
    <circle class="lento" cx="228.0" cy="58.8" r="3.2" />
    <circle class="lento" cx="215.2" cy="65.7" r="3.2" />
    <circle class="lento" cx="205.0" cy="70.1" r="3.2" />
    <circle class="lento" cx="196.8" cy="73.0" r="3.2" />
    <circle class="lento" cx="190.2" cy="74.8" r="3.2" />
    <text class="rot" x="290" y="40">η = 0.10</text>
    <text class="ver-lento" x="290" y="57">slow</text>
  </g>

  <g transform="translate(0,128)">
    <line class="ini" x1="244" y1="48" x2="244" y2="78" />
    <line class="eje" x1="44" y1="78" x2="284" y2="78" />
    <polyline class="par" points="44.0,10.5 52.0,19.2 60.0,27.3 68.0,34.8 76.0,41.7 84.0,48.0 92.0,53.7 100.0,58.8 108.0,63.3 116.0,67.2 124.0,70.5 132.0,73.2 140.0,75.3 148.0,76.8 156.0,77.7 164.0,78.0 172.0,77.7 180.0,76.8 188.0,75.3 196.0,73.2 204.0,70.5 212.0,67.2 220.0,63.3 228.0,58.8 236.0,53.7 244.0,48.0 252.0,41.7 260.0,34.8 268.0,27.3 276.0,19.2 284.0,10.5" />
    <polyline class="bien salto" points="244.0,48.0 180.0,76.8 167.2,78.0" />
    <circle class="bien" cx="244.0" cy="48.0" r="3.2" />
    <circle class="bien" cx="180.0" cy="76.8" r="3.2" />
    <circle class="bien" cx="167.2" cy="78.0" r="3.2" />
    <text class="rot" x="290" y="40">η = 0.40</text>
    <text class="ver-bien" x="290" y="57">arrives</text>
  </g>

  <g transform="translate(0,240)">
    <line class="ini" x1="244" y1="48" x2="244" y2="78" />
    <line class="eje" x1="44" y1="78" x2="284" y2="78" />
    <polyline class="par" points="44.0,10.5 52.0,19.2 60.0,27.3 68.0,34.8 76.0,41.7 84.0,48.0 92.0,53.7 100.0,58.8 108.0,63.3 116.0,67.2 124.0,70.5 132.0,73.2 140.0,75.3 148.0,76.8 156.0,77.7 164.0,78.0 172.0,77.7 180.0,76.8 188.0,75.3 196.0,73.2 204.0,70.5 212.0,67.2 220.0,63.3 228.0,58.8 236.0,53.7 244.0,48.0 252.0,41.7 260.0,34.8 268.0,27.3 276.0,19.2 284.0,10.5" />
    <polyline class="sube salto" points="244.0,48.0 76.0,41.7 260.8,34.1 57.5,24.9 281.1,13.7" />
    <circle class="sube" cx="244.0" cy="48.0" r="3.2" />
    <circle class="sube" cx="76.0" cy="41.7" r="3.2" />
    <circle class="sube" cx="260.8" cy="34.1" r="3.2" />
    <circle class="sube" cx="57.5" cy="24.9" r="3.2" />
    <circle class="sube" cx="281.1" cy="13.7" r="3.2" />
    <text class="rot" x="290" y="40">η = 1.05</text>
    <text class="ver-sube" x="290" y="57">climbs</text>
    <text class="var" x="164" y="96" text-anchor="middle">weight</text>
  </g>
</svg>
