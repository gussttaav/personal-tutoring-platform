<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 726 225" width="726" height="225" role="img"
 aria-label="Two contour maps with the same Adam trajectory over them, thirty steps in a straight line: a forty-five-degree diagonal from the top left down to the horizontal axis, then toward the centre. On the left the ravine is x² plus twenty y², with stretched ellipses. On the right it is x² plus two thousand y², a hundred times narrower: the contours are nearly horizontal stripes and the floor is a slit. The thirty steps are identical in both drawings. The labels say Adam arrives in 36 and 75 steps at the same rate 0.1, and that gradient descent needs 35 steps at rate 0.045 on the first and 3619 steps at rate 0.00045 on the second.">
