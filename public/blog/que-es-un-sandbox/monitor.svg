<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 206" width="760" height="206" role="img"
 aria-label="Las tres piezas de un sandbox. A la izquierda, dentro de una línea discontinua que marca la frontera, el código no fiable. Cada petición que hace sale de la frontera y pasa por un punto de control, fuera de su alcance, que la compara con la política: qué se permite y cuánto. A la derecha, los recursos y lo que la política decide para cada uno: los ficheros, sólo su directorio; la red, denegada; los demás procesos, denegados; la CPU y la memoria, con límite.">
<style>
  text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #bbcabf; }
  .bx { fill: none; stroke: #86948a; stroke-width: 1; }
  .bx.m { stroke: #4edea3; fill: rgba(78,222,163,0.08); }
  .bx.w { stroke: #e8a24c; fill: rgba(232,162,76,0.10); }
  .bx.x { stroke: #ffb4ab; fill: rgba(255,180,171,0.10); }
  .bx.g { stroke: #3b3b3e; }
  .bx.d { stroke: #86948a; stroke-dasharray: 3 3; }
  .lb { font-size: 12px; font-weight: 600; text-anchor: middle; }
  .sb { font-size: 10.5px; fill: #86948a; text-anchor: middle; }
  .tx { font-size: 11px; }
  .hd { font-size: 10px; fill: #86948a; letter-spacing: 0.1em; }
  .m { fill: #4edea3; }
  .w { fill: #e8a24c; }
  .x { fill: #ffb4ab; }
  .ar { fill: none; stroke: #86948a; stroke-width: 1.2; marker-end: url(#a); }
  .ar.m { stroke: #4edea3; marker-end: url(#am); }
  .ar.w { stroke: #e8a24c; marker-end: url(#aw); }
  .ar.x { stroke: #ffb4ab; marker-end: url(#ax); }
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#86948a"/></marker><marker id="am" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#4edea3"/></marker><marker id="aw" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#e8a24c"/></marker><marker id="ax" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#ffb4ab"/></marker></defs>
<rect class="bx d" x="20.0" y="40.0" width="210.0" height="150.0" rx="10"/>
<text class="hd" x="32.0" y="58.0" style="text-anchor:start">FRONTERA</text>
<rect class="bx x" x="45.0" y="85.0" width="160.0" height="60.0" rx="6"/>
<text class="lb x" x="125.0" y="113.0">Código no fiable</text>
<text class="sb" x="125.0" y="127.0">lo que se quiere aislar</text>
<path class="ar" d="M207.0,115.0 L318.0,115.0"/>
<text class="sb" x="262.0" y="106.0">cada petición</text>
<rect class="bx w" x="322.0" y="80.0" width="170.0" height="70.0" rx="6"/>
<text class="lb w" x="407.0" y="113.0">Punto de control</text>
<text class="sb" x="407.0" y="127.0">compara con la política</text>
<text class="sb" x="407.0" y="168.0">fuera del alcance del código</text>
<text class="hd" x="740.0" y="26.0" style="text-anchor:end">POLÍTICA: QUÉ SE PERMITE Y CUÁNTO</text>
<rect class="bx " x="560.0" y="40.0" width="180.0" height="32.0" rx="6"/>
<text class="lb" x="650.0" y="53.0">Ficheros</text>
<text class="sb m" x="650.0" y="66.0">sólo su directorio</text>
<path class="ar m" d="M494.0,115.0 L520.0,115.0 L520.0,56.0 L556.0,56.0"/>
<rect class="bx " x="560.0" y="80.0" width="180.0" height="32.0" rx="6"/>
<text class="lb" x="650.0" y="93.0">Red</text>
<text class="sb x" x="650.0" y="106.0">denegada</text>
<path class="ar x" d="M494.0,115.0 L520.0,115.0 L520.0,96.0 L556.0,96.0"/>
<rect class="bx " x="560.0" y="120.0" width="180.0" height="32.0" rx="6"/>
<text class="lb" x="650.0" y="133.0">Otros procesos</text>
<text class="sb x" x="650.0" y="146.0">denegados</text>
<path class="ar x" d="M494.0,115.0 L520.0,115.0 L520.0,136.0 L556.0,136.0"/>
<rect class="bx " x="560.0" y="160.0" width="180.0" height="32.0" rx="6"/>
<text class="lb" x="650.0" y="173.0">CPU y memoria</text>
<text class="sb w" x="650.0" y="186.0">con límite</text>
<path class="ar w" d="M494.0,115.0 L520.0,115.0 L520.0,176.0 L556.0,176.0"/>
</svg>
