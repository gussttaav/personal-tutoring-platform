<rect class="bx g" x="380.0" y="146.0" width="86.0" height="34.0" rx="4"/>
<rect class="bx g" x="380.0" y="186.0" width="86.0" height="34.0" rx="4"/>
<line x1="378.0" y1="143.0" x2="468.0" y2="143.0" stroke="#e8a24c" stroke-width="3"/>
<text class="sb w" x="423.0" y="238.0">namespaces,</text>
<text class="sb w" x="423.0" y="251.0">cgroups</text>
<text class="lb" x="515.0" y="38.0">gVisor</text>
<rect class="bx m" x="472.0" y="66.0" width="86.0" height="34.0" rx="4"/>
