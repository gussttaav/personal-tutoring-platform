<text class="tx" x="20.0" y="87.0" style="text-anchor:start">Program</text>
<text class="tx" x="20.0" y="127.0" style="text-anchor:start">Runtime</text>
<text class="tx" x="20.0" y="167.0" style="text-anchor:start">Kernel</text>
<text class="tx" x="20.0" y="207.0" style="text-anchor:start">Hardware</text>
<text class="lb" x="147.0" y="38.0">Isolate</text>
