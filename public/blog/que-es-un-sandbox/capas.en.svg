<rect class="bx g" x="564.0" y="186.0" width="86.0" height="34.0" rx="4"/>
<line x1="562.0" y1="183.0" x2="652.0" y2="183.0" stroke="#e8a24c" stroke-width="3"/>
<text class="sb w" x="607.0" y="238.0">KVM + VMM</text>
