<line class="ed" x1="521.5" y1="112.0" x2="521.5" y2="134.0"/>
<rect class="bx m" x="523.5" y="114.0" width="15.0" height="18.0" rx="2"/>
<text class="mo" x="531.0" y="127.0" style="text-anchor:middle">60</text>
