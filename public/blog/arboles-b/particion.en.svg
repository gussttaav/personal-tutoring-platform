<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 236" width="760" height="236" role="img"
 aria-label="Four states of a B-tree with at most four keys per node. One: a single leaf, which is also the root, holding 10, 20, 30 and 40; it is full. Two: 50 arrives and does not fit, so the leaf splits into [10, 20] and [40, 50] and 30 moves up to a new root; the tree grows at the top. Three: 25, 35 and 60 arrive and fit in their leaves without splitting anything: [10, 20, 25] and [35, 40, 50, 60], which is full again. Four: 70 arrives, the right leaf splits into [35, 40] and [60, 70], and 50 moves up to the root, which becomes [30, 50] with three children.">
<style>
  text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #bbcabf; }
  .bx { fill: none; stroke: #86948a; stroke-width: 1; }
  .bx.m { stroke: #4edea3; fill: rgba(78,222,163,0.12); }
  .bx.w { stroke: #e8a24c; fill: rgba(232,162,76,0.12); }
  .bx.g { stroke: #3b3b3e; }
  .bx.f { stroke: #4edea3; fill: #4edea3; }
  .bx.s { stroke: none; fill: #3b3b3e; }
  .lb { font-size: 12.5px; font-weight: 600; }
  .sb { font-size: 11px; fill: #86948a; }
  .tx { font-size: 11.5px; }
  .tx.d { fill: #86948a; }
  .mo { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
  .mo.k { fill: #131315; font-weight: 700; }
  .m { fill: #4edea3; }
  .w { fill: #e8a24c; }
  .sep { stroke: #2a2a2c; stroke-width: 1; }
  .ar { fill: none; stroke: #86948a; stroke-width: 1; marker-end: url(#a); }
  .ar.m { stroke: #4edea3; stroke-width: 1.6; marker-end: url(#am); }
  .ar.w { stroke: #e8a24c; stroke-width: 1.4; marker-end: url(#aw); }
  .ed { stroke: #3b3b3e; stroke-width: 1; }
  .gl { stroke: #2a2a2c; stroke-width: 1; }
  .pt { fill: none; stroke: #4edea3; stroke-width: 1.5; stroke-linejoin: round; }
  .tri { fill: rgba(232,162,76,0.06); stroke: #e8a24c; stroke-width: 1; }
  .lv { stroke: #3b3b3e; stroke-width: 1; stroke-dasharray: 2 3; }
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#86948a"/></marker><marker id="am" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#4edea3"/></marker><marker id="aw" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#e8a24c"/></marker></defs>
<text class="lb" x="0.0" y="14.0">1 · start: 10, 20, 30, 40</text>
<text class="tx d" x="0.0" y="160.0">The leaf, which is also</text>
<text class="tx d" x="0.0" y="175.0">the root, is full:</text>
<text class="tx d" x="0.0" y="190.0">4 keys, the maximum.</text>
<text class="lb m" x="190.0" y="14.0">2 · 50 arrives</text>
<text class="tx d" x="190.0" y="160.0">It does not fit: the leaf</text>
<text class="tx d" x="190.0" y="175.0">splits in two and 30 moves</text>
<text class="tx d" x="190.0" y="190.0">up to a new root. The tree</text>
<text class="tx d" x="190.0" y="205.0">grows at the top.</text>
<line class="sep" x1="182.0" y1="4.0" x2="182.0" y2="232.0"/>
<text class="lb m" x="380.0" y="14.0">3 · 25, 35 and 60 arrive</text>
<text class="tx d" x="380.0" y="160.0">They fit in their leaves</text>
<text class="tx d" x="380.0" y="175.0">without splitting anything.</text>
<text class="tx d" x="380.0" y="190.0">The right one is full</text>
<text class="tx d" x="380.0" y="205.0">again.</text>
<line class="sep" x1="372.0" y1="4.0" x2="372.0" y2="232.0"/>
<text class="lb m" x="570.0" y="14.0">4 · 70 arrives</text>
<text class="tx d" x="570.0" y="160.0">The right leaf splits and</text>
<text class="tx d" x="570.0" y="175.0">50 moves up to the root,</text>
<text class="tx d" x="570.0" y="190.0">which now has three</text>
<text class="tx d" x="570.0" y="205.0">children.</text>
<line class="sep" x1="562.0" y1="4.0" x2="562.0" y2="232.0"/>
