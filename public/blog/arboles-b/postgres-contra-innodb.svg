  .bx.f { stroke: #4edea3; fill: #4edea3; }
  .bx.s { stroke: none; fill: #3b3b3e; }
  .lb { font-size: 12.5px; font-weight: 600; }
  .sb { font-size: 11px; fill: #86948a; }
  .tx { font-size: 11.5px; }
  .tx.d { fill: #86948a; }
  .mo { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
  .mo.k { fill: #131315; font-weight: 700; }
  .m { fill: #4edea3; }
  .w { fill: #e8a24c; }
  .sep { stroke: #2a2a2c; stroke-width: 1; }
  .ar { fill: none; stroke: #86948a; stroke-width: 1; marker-end: url(#a); }
  .ar.m { stroke: #4edea3; stroke-width: 1.6; marker-end: url(#am); }
  .ar.w { stroke: #e8a24c; stroke-width: 1.4; marker-end: url(#aw); }
  .ed { stroke: #3b3b3e; stroke-width: 1; }
  .gl { stroke: #2a2a2c; stroke-width: 1; }
  .pt { fill: none; stroke: #4edea3; stroke-width: 1.5; stroke-linejoin: round; }
  .tri { fill: rgba(232,162,76,0.06); stroke: #e8a24c; stroke-width: 1; }
  .lv { stroke: #3b3b3e; stroke-width: 1; stroke-dasharray: 2 3; }
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#86948a"/></marker><marker id="am" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#4edea3"/></marker><marker id="aw" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#e8a24c"/></marker></defs>
