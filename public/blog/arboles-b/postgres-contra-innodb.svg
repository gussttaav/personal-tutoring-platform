<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 318" width="760" height="318" role="img"
 aria-label="Dos formas de guardar una tabla con índices. A la izquierda, Postgres: la tabla de pedidos va aparte, 22 059 páginas en el orden en que llegaron las filas, y cada índice es un árbol cuyas hojas guardan direcciones. El índice de id lleva al pedido 1 234 567, en la página 9077: tres páginas del índice y una de la tabla, cuatro. El índice de cliente_id lleva a los diez pedidos del cliente 4242, repartidos por diez páginas distintas de la tabla: tres más diez, trece. A la derecha, InnoDB: la tabla es el árbol de la clave primaria, con las filas enteras en las hojas, y buscar por id son tres páginas con la fila ya dentro. El índice de cliente_id guarda en sus hojas los diez id, y con cada uno hay que volver a bajar por el árbol de la tabla desde la raíz: tres más diez veces tres.">
<style>
  text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #bbcabf; }
  .bx { fill: none; stroke: #86948a; stroke-width: 1; }
