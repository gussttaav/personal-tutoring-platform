<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 150" width="760" height="150" role="img"
 aria-label="Timeline, not to scale, with ten milestones. In green, the B-tree family: 1970, the B-tree of Bayer and McCreight; 1972, the red-black tree, a B-tree written with binary nodes; 1973, IBM's VSAM, with the B+tree; 1979, Comer's survey calling it ubiquitous; 1981, the B-link tree of Lehman and Yao. In orange, the alternatives: 1962, the AVL tree; 1990, Pugh's skip list; 1996, the LSM tree, for writing; 2013, ART and Bw-tree, for memory; 2018, the learned indexes of Kraska et al.">
<style>
  text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #bbcabf; }
  .bx { fill: none; stroke: #86948a; stroke-width: 1; }
  .bx.m { stroke: #4edea3; fill: rgba(78,222,163,0.12); }
  .bx.w { stroke: #e8a24c; fill: rgba(232,162,76,0.12); }
  .bx.g { stroke: #3b3b3e; }
  .bx.f { stroke: #4edea3; fill: #4edea3; }
  .bx.s { stroke: none; fill: #3b3b3e; }
  .lb { font-size: 12.5px; font-weight: 600; }
  .sb { font-size: 11px; fill: #86948a; }
  .tx { font-size: 11.5px; }
  .tx.d { fill: #86948a; }
  .mo { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
  .mo.k { fill: #131315; font-weight: 700; }
  .m { fill: #4edea3; }
  .w { fill: #e8a24c; }
  .sep { stroke: #2a2a2c; stroke-width: 1; }
  .ar { fill: none; stroke: #86948a; stroke-width: 1; marker-end: url(#a); }
  .ar.m { stroke: #4edea3; stroke-width: 1.6; marker-end: url(#am); }
  .ar.w { stroke: #e8a24c; stroke-width: 1.4; marker-end: url(#aw); }
  .ed { stroke: #3b3b3e; stroke-width: 1; }
  .gl { stroke: #2a2a2c; stroke-width: 1; }
  .pt { fill: none; stroke: #4edea3; stroke-width: 1.5; stroke-linejoin: round; }
  .tri { fill: rgba(232,162,76,0.06); stroke: #e8a24c; stroke-width: 1; }
  .lv { stroke: #3b3b3e; stroke-width: 1; stroke-dasharray: 2 3; }
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#86948a"/></marker><marker id="am" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#4edea3"/></marker><marker id="aw" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#e8a24c"/></marker></defs>
<line class="ed" x1="8.0" y1="84.0" x2="752.0" y2="84.0"/>
<circle cx="62.0" cy="84" r="4.5" fill="#e8a24c"/>
<line class="ed" x1="62.0" y1="78.0" x2="62.0" y2="68.0"/>
<text class="lb w" x="62.0" y="38.0" style="text-anchor:middle">1962</text>
<text class="tx" x="62.0" y="52.0" style="text-anchor:middle">AVL tree</text>
<text class="sb" x="62.0" y="65.0" style="text-anchor:middle">balanced binary</text>
<circle cx="132.7" cy="84" r="4.5" fill="#4edea3"/>
<line class="ed" x1="132.7" y1="90.0" x2="132.7" y2="100.0"/>
<text class="lb m" x="132.7" y="114.0" style="text-anchor:middle">1970</text>
<text class="tx" x="132.7" y="128.0" style="text-anchor:middle">B-tree</text>
<text class="sb" x="132.7" y="141.0" style="text-anchor:middle">Bayer and McCreight</text>
<circle cx="203.3" cy="84" r="4.5" fill="#4edea3"/>
<line class="ed" x1="203.3" y1="78.0" x2="203.3" y2="68.0"/>
<text class="lb m" x="203.3" y="38.0" style="text-anchor:middle">1972</text>
<text class="tx" x="203.3" y="52.0" style="text-anchor:middle">red-black</text>
<text class="sb" x="203.3" y="65.0" style="text-anchor:middle">a binary B-tree</text>
<circle cx="274.0" cy="84" r="4.5" fill="#4edea3"/>
<line class="ed" x1="274.0" y1="90.0" x2="274.0" y2="100.0"/>
<text class="lb m" x="274.0" y="114.0" style="text-anchor:middle">1973</text>
<text class="tx" x="274.0" y="128.0" style="text-anchor:middle">IBM's VSAM</text>
<text class="sb" x="274.0" y="141.0" style="text-anchor:middle">B+tree</text>
<circle cx="344.7" cy="84" r="4.5" fill="#4edea3"/>
<line class="ed" x1="344.7" y1="78.0" x2="344.7" y2="68.0"/>
<text class="lb m" x="344.7" y="38.0" style="text-anchor:middle">1979</text>
<text class="tx" x="344.7" y="52.0" style="text-anchor:middle">“ubiquitous”</text>
<text class="sb" x="344.7" y="65.0" style="text-anchor:middle">Comer's survey</text>
<circle cx="415.3" cy="84" r="4.5" fill="#4edea3"/>
<line class="ed" x1="415.3" y1="90.0" x2="415.3" y2="100.0"/>
<text class="lb m" x="415.3" y="114.0" style="text-anchor:middle">1981</text>
<text class="tx" x="415.3" y="128.0" style="text-anchor:middle">B-link tree</text>
<text class="sb" x="415.3" y="141.0" style="text-anchor:middle">Lehman and Yao</text>
<circle cx="486.0" cy="84" r="4.5" fill="#e8a24c"/>
<line class="ed" x1="486.0" y1="78.0" x2="486.0" y2="68.0"/>
<text class="lb w" x="486.0" y="38.0" style="text-anchor:middle">1990</text>
<text class="tx" x="486.0" y="52.0" style="text-anchor:middle">skip list</text>
<text class="sb" x="486.0" y="65.0" style="text-anchor:middle">Pugh</text>
<circle cx="556.7" cy="84" r="4.5" fill="#e8a24c"/>
<line class="ed" x1="556.7" y1="90.0" x2="556.7" y2="100.0"/>
<text class="lb w" x="556.7" y="114.0" style="text-anchor:middle">1996</text>
<text class="tx" x="556.7" y="128.0" style="text-anchor:middle">LSM tree</text>
<text class="sb" x="556.7" y="141.0" style="text-anchor:middle">for writing</text>
<circle cx="627.3" cy="84" r="4.5" fill="#e8a24c"/>
<line class="ed" x1="627.3" y1="78.0" x2="627.3" y2="68.0"/>
<text class="lb w" x="627.3" y="38.0" style="text-anchor:middle">2013</text>
<text class="tx" x="627.3" y="52.0" style="text-anchor:middle">ART, Bw-tree</text>
<text class="sb" x="627.3" y="65.0" style="text-anchor:middle">for memory</text>
<circle cx="698.0" cy="84" r="4.5" fill="#e8a24c"/>
<line class="ed" x1="698.0" y1="90.0" x2="698.0" y2="100.0"/>
<text class="lb w" x="698.0" y="114.0" style="text-anchor:middle">2018</text>
<text class="tx" x="698.0" y="128.0" style="text-anchor:middle">learned indexes</text>
<text class="sb" x="698.0" y="141.0" style="text-anchor:middle">Kraska et al.</text>
<circle cx="510" cy="10" r="4.5" fill="#4edea3"/>
<text class="sb" x="520.0" y="14.0">the B-tree family</text>
<circle cx="660" cy="10" r="4.5" fill="#e8a24c"/>
<text class="sb" x="670.0" y="14.0">alternatives</text>
</svg>
