<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 262" width="760" height="262" role="img"
 aria-label="The same eight keys in a B-tree and in a B+tree, and the scan of the keys between 25 and 55. In the B-tree, the root holds 30 and 60, and the leaves [10, 20], [40, 50] and [70, 85]. Reading the range visits five pages: the root, leaf 1, which has nothing, the root again for 30, leaf 2 for 40 and 50, and the root again, where 60 is already past the end. In the B+tree, the root holds only signposts, 40 and 70, and the leaves [10, 20, 30], [40, 50, 60] and [70, 85], linked left to right. The same range visits three pages: the root, leaf 1 for 30 and, following the link, leaf 2 for 40 and 50, where 60 is already past the end.">
