<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 232" width="760" height="232" role="img"
 aria-label="Un árbol B de tres niveles con 33 claves, como mucho cuatro por nodo. La raíz tiene las claves 30 y 60 y tres hijos: [10, 20], [40, 50] y [70, 85]. Cada uno de ellos tiene tres hojas, nueve en total, todas a la misma profundidad: [3, 5, 8], [12, 15, 18], [22, 25, 28], [33, 36], [42, 45, 48], [52, 55, 58], [62, 66], [73, 77, 81] y [88, 92, 96]. Está marcado el camino para buscar el 45: en la raíz, 45 está entre 30 y 60, así que se baja por el hijo del medio; en [40, 50], está entre 40 y 50, así que se baja otra vez por el del medio; y en la hoja [42, 45, 48] está el 45. Tres páginas, una por nivel. Una nota dice que cada nodo es una página, que aquí caben cuatro claves y en Postgres unas 400.">
<style>
