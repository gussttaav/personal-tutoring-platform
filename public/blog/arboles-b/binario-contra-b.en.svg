<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" width="760" height="372" role="img"
 aria-label="Two trees holding the same 3 million keys, at the same vertical scale: each row is a level. On the left, a binary tree with one node per page, drawn as a tall, narrow triangle of 22 rows, with the path of one search zigzagging all the way down: 22 levels, 22 reads. On the right, the real index on pedidos.id, wide and short: a root with 29 entries, 29 internal pages of about 284 entries and 8,197 leaves of 367 keys. Three levels, three reads, of which only the leaf comes from disk, because the 30 pages of the top two levels take 240 KB and never leave memory.">
