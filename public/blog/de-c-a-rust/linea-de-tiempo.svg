<text class="lb m" x="627.3" y="50.0" style="text-anchor:middle">2024</text>
<text class="tx" x="627.3" y="64.0" style="text-anchor:middle">C23</text>
<text class="sb" x="627.3" y="77.0" style="text-anchor:middle">se publica</text>
<circle cx="698.0" cy="96" r="4.5" fill="#6fb1e8"/>
<line class="ed" x1="698.0" y1="102.0" x2="698.0" y2="112.0"/>
<text class="lb b" x="698.0" y="126.0" style="text-anchor:middle">2025</text>
<text class="tx" x="698.0" y="140.0" style="text-anchor:middle">Rust en Linux</text>
<text class="sb" x="698.0" y="153.0" style="text-anchor:middle">fin del experimento</text>
<circle cx="694" cy="12" r="4.5" fill="#6fb1e8"/>
<text class="sb" x="704.0" y="16.0">Rust</text>
<circle cx="543" cy="12" r="4.5" fill="#e8a24c"/>
<text class="sb" x="553.0" y="16.0">fallos de memoria</text>
<circle cx="427" cy="12" r="4.5" fill="#4edea3"/>
<text class="sb" x="437.0" y="16.0">C y su norma</text>
