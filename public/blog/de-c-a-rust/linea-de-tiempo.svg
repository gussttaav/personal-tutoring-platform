<line class="ed" x1="344.7" y1="90.0" x2="344.7" y2="80.0"/>
<text class="lb w" x="344.7" y="50.0" style="text-anchor:middle">2014</text>
<text class="tx" x="344.7" y="64.0" style="text-anchor:middle">Heartbleed</text>
<text class="sb" x="344.7" y="77.0" style="text-anchor:middle">OpenSSL</text>
<circle cx="415.3" cy="96" r="4.5" fill="#6fb1e8"/>
<line class="ed" x1="415.3" y1="102.0" x2="415.3" y2="112.0"/>
<text class="lb b" x="415.3" y="126.0" style="text-anchor:middle">2015</text>
<text class="tx" x="415.3" y="140.0" style="text-anchor:middle">Rust 1.0</text>
<text class="sb" x="415.3" y="153.0" style="text-anchor:middle">Mozilla</text>
<circle cx="486.0" cy="96" r="4.5" fill="#e8a24c"/>
<line class="ed" x1="486.0" y1="90.0" x2="486.0" y2="80.0"/>
<text class="lb w" x="486.0" y="50.0" style="text-anchor:middle">2019</text>
<text class="tx" x="486.0" y="64.0" style="text-anchor:middle">70 % en Microsoft</text>
<text class="sb" x="486.0" y="77.0" style="text-anchor:middle">fallos de memoria</text>
<circle cx="556.7" cy="96" r="4.5" fill="#6fb1e8"/>
<line class="ed" x1="556.7" y1="102.0" x2="556.7" y2="112.0"/>
<text class="lb b" x="556.7" y="126.0" style="text-anchor:middle">2022</text>
<text class="tx" x="556.7" y="140.0" style="text-anchor:middle">Linux 6.1</text>
<text class="sb" x="556.7" y="153.0" style="text-anchor:middle">admite Rust</text>
