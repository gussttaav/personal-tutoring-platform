<line class="ed" x1="274.0" y1="102.0" x2="274.0" y2="112.0"/>
<text class="lb m" x="274.0" y="126.0" style="text-anchor:middle">2011</text>
<text class="tx" x="274.0" y="140.0" style="text-anchor:middle">C11</text>
<text class="sb" x="274.0" y="153.0" style="text-anchor:middle">hilos y atómicos</text>
