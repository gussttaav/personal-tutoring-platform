<text class="lb" x="579.4" y="179.2" style="text-anchor:middle">24 %</text>
<text class="sb" x="579.4" y="165.2" style="text-anchor:middle">estimado para el año entero</text>
<path d="M650.1,252.0 L650.1,202.0 Q650.1,198.0 654.1,198.0 L692.1,198.0 Q696.1,198.0 696.1,202.0 L696.1,252.0 Z" fill="none" stroke="#e8a24c" stroke-width="1.2" stroke-dasharray="4 3"/>
<text class="lb" x="673.1" y="190.0" style="text-anchor:middle">&lt; 20 %</text>
<text class="tx" x="110.9" y="270.0" style="text-anchor:middle">2019</text>
<text class="sb" x="204.6" y="270.0" style="text-anchor:middle">2020</text>
<text class="sb" x="298.3" y="270.0" style="text-anchor:middle">2021</text>
<text class="tx" x="392.0" y="270.0" style="text-anchor:middle">2022</text>
<text class="sb" x="485.7" y="270.0" style="text-anchor:middle">2023</text>
<text class="tx" x="579.4" y="270.0" style="text-anchor:middle">2024</text>
<text class="tx" x="673.1" y="270.0" style="text-anchor:middle">2025</text>
</svg>
