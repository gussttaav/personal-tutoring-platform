<text class="tx d" x="583.0" y="143.0" style="text-anchor:middle">Ortega Hardware</text>
<rect class="bx m" x="400.0" y="186.0" width="100.0" height="26.0" rx="5"/>
<text class="tx m" x="450.0" y="203.0" style="text-anchor:middle">ticket 5120</text>
<rect class="bx m" x="512.0" y="186.0" width="142.0" height="26.0" rx="5"/>
<text class="tx m" x="583.0" y="203.0" style="text-anchor:middle">Ortega Hardware Ltd.</text>
<rect class="bx " x="672.0" y="156.0" width="76.0" height="26.0" rx="5"/>
<text class="tx" x="710.0" y="173.0" style="text-anchor:middle">Team plan</text>
<rect class="bx m" x="400.0" y="246.0" width="100.0" height="26.0" rx="5"/>
<text class="tx m" x="450.0" y="263.0" style="text-anchor:middle">version 3.2</text>
<rect class="bx g" x="0.0" y="241.0" width="10.0" height="10.0" rx="2"/>
<text class="tx d" x="15.0" y="250.0" style="text-anchor:start">already there</text>
