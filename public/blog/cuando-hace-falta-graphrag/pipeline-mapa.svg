<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 758 234" width="758" height="234" role="img"
 aria-label="Diagrama de GraphRAG en dos carriles. Arriba, indexar, una vez y leyendo todo el corpus: documentos, trocear en fragmentos, extraer entidades y relaciones con el modelo de lenguaje, construir el grafo fusionando duplicados, detectar comunidades con Leiden por niveles y resumir cada comunidad con el modelo. Abajo, preguntar con la búsqueda global: la misma pregunta va a cada lote de resúmenes, sin buscar, leyendo todos los de un nivel; en el paso map el modelo responde y puntúa cada lote; en el paso reduce junta las respuestas mejor puntuadas en la respuesta final. Los pasos que llaman al modelo están marcados: extraer, resumir, map y reduce.">
<style>
