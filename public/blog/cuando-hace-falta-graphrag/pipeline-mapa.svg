  .ar.w { stroke: #e8a24c; marker-end: url(#aw); }
  .ed { stroke: #3b3b3e; stroke-width: 1.2; }
  .ed.m { stroke: #4edea3; stroke-width: 1.4; }
  .ed.x { stroke: #ffb4ab; stroke-dasharray: 3 3; }
</style>
