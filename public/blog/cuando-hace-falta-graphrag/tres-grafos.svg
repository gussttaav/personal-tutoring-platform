<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 256" width="750" height="256" role="img"
 aria-label="Cuatro paneles, uno por sitio donde puede estar la respuesta a una pregunta de Albarán. En un fragmento: ¿qué plazo de reembolso tiene el plan Equipo?; la responde un documento. En una cadena: ¿el cliente de la 4812 tiene derecho a reembolso?; hacen falta dos o tres documentos encadenados. En el conjunto: ¿por qué nos piden reembolsos este trimestre?; hacen falta cientos de documentos a la vez. En las relaciones: ¿cuántos clientes del plan Equipo esperan el arreglo de la 3.2?; la respuesta es un recuento sobre datos: los clientes unidos a la vez al plan y al fallo. Debajo de cada panel, la herramienta que la responde: RAG híbrido, sin grafo; un agente o una memoria asociativa, el grafo como memoria; un mapa de comunidades, el grafo como mapa; una consulta, el grafo que ya tienes.">
