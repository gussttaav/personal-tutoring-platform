<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 190" width="750" height="190" role="img"
 aria-label="Four panels, one for each place the answer to an Albarán question can live. In one chunk: what refund window does the Team plan have?; one document answers it. In a chain: is the customer on 4812 entitled to a refund?; it takes two or three chained documents. In the whole: why are customers asking for refunds this quarter?; it takes hundreds of documents at once. In the relations: how many Team plan customers are waiting for the 3.2 fix?; the answer is a count over data: the customers linked both to the plan and to the bug.">
