<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 758 234" width="758" height="234" role="img"
 aria-label="Diagram of GraphRAG in two lanes. Top, indexing, once and reading the whole corpus: documents, chunk into fragments, extract entities and relations with the language model, build the graph merging duplicates, detect communities with Leiden by level and summarise each community with the model. Bottom, asking with global search: the same question goes to every batch of summaries, with no search, reading all of one level; in the map step the model answers and scores each batch; in the reduce step it joins the best-scored answers into the final answer. The steps that call the model are marked: extract, summarise, map and reduce.">
<style>
  text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #bbcabf; }
  .bx { fill: none; stroke: #86948a; stroke-width: 1; }
  .bx.m { stroke: #4edea3; fill: rgba(78,222,163,0.08); }
  .bx.w { stroke: #e8a24c; fill: rgba(232,162,76,0.08); }
  .bx.x { fill: none; stroke: #ffb4ab; stroke-dasharray: 3 3; }
  .bx.g { stroke: #3b3b3e; }
  .lb { font-size: 12px; font-weight: 600; text-anchor: middle; }
  .sb { font-size: 10.5px; fill: #86948a; text-anchor: middle; }
  .tx { font-size: 11px; }
  .tx.d { fill: #86948a; }
  .mo { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; }
  .hd { font-size: 10px; fill: #86948a; letter-spacing: 0.1em; }
  .in { font-size: 10.5px; font-weight: 600; fill: #0e0e10; text-anchor: middle; }
  .hl { paint-order: stroke; stroke: #131315; stroke-width: 4px; stroke-linejoin: round; }
  .m { fill: #4edea3; }
  .w { fill: #e8a24c; }
  .x { fill: #ffb4ab; }
  .ar { fill: none; stroke: #86948a; stroke-width: 1.2; marker-end: url(#a); }
  .ar.m { stroke: #4edea3; marker-end: url(#am); }
  .ar.w { stroke: #e8a24c; marker-end: url(#aw); }
  .ed { stroke: #3b3b3e; stroke-width: 1.2; }
  .ed.m { stroke: #4edea3; stroke-width: 1.4; }
  .ed.x { stroke: #ffb4ab; stroke-dasharray: 3 3; }
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#86948a"/></marker><marker id="am" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#4edea3"/></marker><marker id="aw" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#e8a24c"/></marker></defs>
<text class="hd" x="0.0" y="14.0">INDEX · ONCE, READING THE WHOLE CORPUS</text>
<text class="hd" x="0.0" y="120.0">ASK · GLOBAL SEARCH</text>
<rect class="bx w" x="598.4" y="4.0" width="12.0" height="12.0" rx="3"/>
<text class="tx d" x="758.0" y="14.0" style="text-anchor:end">calls the language model</text>
<rect class="bx " x="0.0" y="26.0" width="118.0" height="46.0" rx="6"/>
<text class="lb" x="59.0" y="47.0">Documents</text>
<text class="sb" x="59.0" y="61.0">tickets, wiki</text>
<rect class="bx " x="128.0" y="26.0" width="118.0" height="46.0" rx="6"/>
<text class="lb" x="187.0" y="47.0">Chunk</text>
<text class="sb" x="187.0" y="61.0">into fragments</text>
<path class="ar" d="M118.0,49.0 L126.0,49.0"/>
<rect class="bx w" x="256.0" y="26.0" width="118.0" height="46.0" rx="6"/>
<text class="lb w" x="315.0" y="47.0">Extract</text>
<text class="sb" x="315.0" y="61.0">entities, relations</text>
<path class="ar" d="M246.0,49.0 L254.0,49.0"/>
<rect class="bx " x="384.0" y="26.0" width="118.0" height="46.0" rx="6"/>
<text class="lb" x="443.0" y="47.0">Graph</text>
<text class="sb" x="443.0" y="61.0">merges duplicates</text>
<path class="ar" d="M374.0,49.0 L382.0,49.0"/>
<rect class="bx " x="512.0" y="26.0" width="118.0" height="46.0" rx="6"/>
<text class="lb" x="571.0" y="47.0">Communities</text>
<text class="sb" x="571.0" y="61.0">Leiden, by level</text>
<path class="ar" d="M502.0,49.0 L510.0,49.0"/>
<rect class="bx w" x="640.0" y="26.0" width="118.0" height="46.0" rx="6"/>
<text class="lb w" x="699.0" y="47.0">Summarise</text>
<text class="sb" x="699.0" y="61.0">one per community</text>
<path class="ar" d="M630.0,49.0 L638.0,49.0"/>
<rect class="bx " x="0.0" y="150.0" width="118.0" height="46.0" rx="6"/>
<text class="lb" x="59.0" y="171.0">Question</text>
<text class="sb" x="59.0" y="185.0">global</text>
<rect class="bx w" x="512.0" y="150.0" width="118.0" height="46.0" rx="6"/>
<text class="lb w" x="571.0" y="171.0">Map</text>
<text class="sb" x="571.0" y="185.0">answers and scores</text>
<rect class="bx w" x="640.0" y="150.0" width="118.0" height="46.0" rx="6"/>
<text class="lb w" x="699.0" y="171.0">Reduce</text>
<text class="sb" x="699.0" y="185.0">joins the best</text>
<path class="ar" d="M118.0,173.0 L510.0,173.0"/>
<text class="sb" x="315.0" y="167.0">the same question, to every batch of summaries</text>
<text class="sb" x="315.0" y="189.0">no search: reads all of one level</text>
<path class="ar" d="M630.0,173.0 L638.0,173.0"/>
<path class="ar" d="M699.0,72.0 L699.0,115.0 L571.0,115.0 L571.0,148.0"/>
<path class="ar" d="M699.0,196.0 L699.0,214.0"/>
<text class="sb" x="699.0" y="228.0">answer</text>
</svg>
