<text class="in" x="354.2" y="105.0">112</text>
<path d="M448.39,90.00 H719.37 Q719.37,90.00 719.37,90.00 V112.00 Q719.37,112.00 719.37,112.00 H448.39 Z" fill="#5b8ce0"/>
<text class="in" x="583.9" y="105.0">164</text>
<path d="M721.37,90.00 H744.00 Q748.00,90.00 748.00,94.00 V108.00 Q748.00,112.00 744.00,112.00 H721.37 Z" fill="#55565c"/>
<text class="in" x="734.7" y="105.0">16</text>
<text class="lb" x="0.0" y="149.0" style="text-anchor:start">Las 20 que leyó el asistente</text>
<text class="sb" x="0.0" y="164.0" style="text-anchor:start">con lo que respondió</text>
<path d="M232.00,140.00 H255.80 Q255.80,140.00 255.80,140.00 V162.00 Q255.80,162.00 255.80,162.00 H232.00 Z" fill="#22a672"/>
