<line class="gr" x1="64.0" y1="250.0" x2="664.0" y2="250.0"/>
<text class="tk" x="56.0" y="254.0" style="text-anchor:end">0</text>
<line class="gr" x1="64.0" y1="208.2" x2="664.0" y2="208.2"/>
<text class="tk" x="56.0" y="212.2" style="text-anchor:end">±2</text>
<line class="gr" x1="64.0" y1="166.4" x2="664.0" y2="166.4"/>
<text class="tk" x="56.0" y="170.4" style="text-anchor:end">±4</text>
