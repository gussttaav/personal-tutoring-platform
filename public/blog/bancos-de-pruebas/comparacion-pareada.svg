<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 294" width="700" height="294" role="img"
 aria-label="Una curva que sube. En horizontal, en cuántas de las 200 preguntas no coinciden dos versiones del asistente, de 8 a 112. En vertical, el margen de error al 95 % de la diferencia entre ellas, en puntos. La versión 1 acierta el 70 % y la 2, el 74 %. Si no coinciden en 12 preguntas, el margen es de ±3,3 puntos; en 20, de ±4,3. Hasta 16 desacuerdos, el margen queda por debajo de los 4 puntos de ventaja y la diferencia es real. Con 81 desacuerdos, lo esperable si las dos versiones fallaran con independencia, el margen es de ±8,8, el mismo que si respondieran a preguntas distintas.">
<style>
  text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #bbcabf; }
  .bx { fill: none; stroke: #3b3b3e; stroke-width: 1; }
  .bx.m { stroke: #4edea3; fill: rgba(78,222,163,0.08); }
  .bx.w { stroke: #e8a24c; fill: rgba(232,162,76,0.08); }
  .bx.x { stroke: #ffb4ab; fill: rgba(255,180,171,0.08); }
  .lb { font-size: 12px; font-weight: 600; }
  .tx { font-size: 11px; }
  .tx.d { fill: #86948a; }
  .tk { font-size: 10.5px; fill: #86948a; }
  .hd { font-size: 10px; fill: #86948a; letter-spacing: 0.1em; }
  .big { font-size: 13px; font-weight: 600; }
  .gr { stroke: #2a2a2c; stroke-width: 1; }
  .ax { stroke: #86948a; stroke-width: 1; }
  .ch { stroke: #86948a; stroke-width: 1; stroke-dasharray: 4 4; }
  .cv { fill: none; stroke-width: 2; stroke-linejoin: round; }
</style>
