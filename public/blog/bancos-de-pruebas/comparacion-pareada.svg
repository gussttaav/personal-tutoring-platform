<text class="tx" x="461.0" y="56.2" style="text-anchor:end;fill:#e8a24c">81 desacuerdos: ±8,8, como si fueran preguntas distintas</text>
<circle cx="144.0" cy="168.9" r="4" fill="#4edea3"/>
<text class="tx" x="154.0" y="186.9" style="fill:#4edea3">hasta 16 desacuerdos, los 4 puntos son una diferencia real</text>
<text class="tk" x="364.0" y="284.0" style="text-anchor:middle">preguntas en las que las dos versiones no coinciden (de 200)</text>
<text class="tk" transform="translate(14,135.0) rotate(-90)" style="text-anchor:middle">margen de la diferencia al 95 %</text>
</svg>
