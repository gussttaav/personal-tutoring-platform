<line class="gr" x1="512.2" y1="161.0" x2="588.7" y2="161.0" style="stroke:#4edea3;stroke-width:1.4"/>
<circle cx="550.5" cy="161.0" r="4.5" fill="#4edea3"/>
<text class="tk" x="594.7" y="165.0" style="fill:#4edea3">47.2%</text>
