<line class="gr" x1="429.7" y1="241.0" x2="504.2" y2="241.0" style="stroke:#e8a24c;stroke-width:1.4"/>
<circle cx="467.0" cy="241.0" r="4.5" fill="#e8a24c"/>
<text class="tk" x="510.2" y="245.0" style="fill:#e8a24c">38.2%</text>
<line class="gr" x1="404.1" y1="253.0" x2="477.4" y2="253.0" style="stroke:#4edea3;stroke-width:1.4"/>
<circle cx="440.8" cy="253.0" r="4.5" fill="#4edea3"/>
<text class="tk" x="483.4" y="257.0" style="fill:#4edea3">35.4%</text>
<text class="tk" x="460.0" y="304.0" style="text-anchor:middle">accuracy on 570 MMLU questions, with its 95% margin</text>
