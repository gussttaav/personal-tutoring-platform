<text class="tk" x="390.0" y="286.0" style="text-anchor:middle">30%</text>
<line class="gr" x1="436.7" y1="32.0" x2="436.7" y2="270.0"/>
<text class="tk" x="436.7" y="286.0" style="text-anchor:middle">35%</text>
