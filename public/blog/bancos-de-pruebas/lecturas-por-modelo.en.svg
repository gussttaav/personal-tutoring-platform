<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 314" width="740" height="314" role="img"
 aria-label="The accuracy of two small models on the same 570 MMLU questions, reading their answer in five ways, each with its margin of error. A dashed line marks the 25% of chance. SmolLM2-360M: most likely letter, 24.7%; what it writes, 24.7%; the whole option, 24.0%; the whole option per token, 24.9%; without showing the options and per character, 38.2%. Qwen2.5-0.5B: 52.3%, 52.3%, 47.2%, 39.6% and 35.4%.">
<style>
  text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #bbcabf; }
  .bx { fill: none; stroke: #3b3b3e; stroke-width: 1; }
  .bx.m { stroke: #4edea3; fill: rgba(78,222,163,0.08); }
  .bx.w { stroke: #e8a24c; fill: rgba(232,162,76,0.08); }
  .bx.x { stroke: #ffb4ab; fill: rgba(255,180,171,0.08); }
  .lb { font-size: 12px; font-weight: 600; }
  .tx { font-size: 11px; }
  .tx.d { fill: #86948a; }
  .tk { font-size: 10.5px; fill: #86948a; }
  .hd { font-size: 10px; fill: #86948a; letter-spacing: 0.1em; }
  .big { font-size: 13px; font-weight: 600; }
  .gr { stroke: #2a2a2c; stroke-width: 1; }
  .ax { stroke: #86948a; stroke-width: 1; }
  .ch { stroke: #86948a; stroke-width: 1; stroke-dasharray: 4 4; }
  .cv { fill: none; stroke-width: 2; stroke-linejoin: round; }
</style>
