<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 366" width="740" height="366" role="img"
 aria-label="Ocho modelos abiertos y su nota en MMLU con tres programas distintos que corrigen el mismo examen, según Hugging Face en junio de 2023, unidos por líneas. Con el código original, que mira la letra más probable, LLaMA 65B saca un 63,6 % y es el primero; Falcon 40B, un 55,8 %, el tercero. Con HELM, que mira lo que escribe el modelo, casi lo mismo: 63,7 % y 57,1 %. Con el LM Evaluation Harness, que mira la probabilidad de la opción entera, LLaMA 65B baja al 48,8 % y Falcon 40B, con un 52,7 %, pasa a ser el primero. Los modelos más débiles, que con el código original están cerca del 25 % que da el azar, suben hasta el 33 o el 35 % con el Harness.">
