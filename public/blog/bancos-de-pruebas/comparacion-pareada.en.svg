<text class="tk" x="64.0" y="266.0" style="text-anchor:middle">0</text>
<line class="gr" x1="164.0" y1="20.0" x2="164.0" y2="250.0"/>
<text class="tk" x="164.0" y="266.0" style="text-anchor:middle">20</text>
<line class="gr" x1="264.0" y1="20.0" x2="264.0" y2="250.0"/>
<text class="tk" x="264.0" y="266.0" style="text-anchor:middle">40</text>
<line class="gr" x1="364.0" y1="20.0" x2="364.0" y2="250.0"/>
<text class="tk" x="364.0" y="266.0" style="text-anchor:middle">60</text>
<line class="gr" x1="464.0" y1="20.0" x2="464.0" y2="250.0"/>
<text class="tk" x="464.0" y="266.0" style="text-anchor:middle">80</text>
<line class="gr" x1="564.0" y1="20.0" x2="564.0" y2="250.0"/>
<text class="tk" x="564.0" y="266.0" style="text-anchor:middle">100</text>
<line class="gr" x1="664.0" y1="20.0" x2="664.0" y2="250.0"/>
<text class="tk" x="664.0" y="266.0" style="text-anchor:middle">120</text>
<line class="gr" x1="64.0" y1="250.0" x2="664.0" y2="250.0"/>
<text class="tk" x="56.0" y="254.0" style="text-anchor:end">0</text>
<line class="gr" x1="64.0" y1="208.2" x2="664.0" y2="208.2"/>
<text class="tk" x="56.0" y="212.2" style="text-anchor:end">±2</text>
<line class="gr" x1="64.0" y1="166.4" x2="664.0" y2="166.4"/>
<text class="tk" x="56.0" y="170.4" style="text-anchor:end">±4</text>
<line class="gr" x1="64.0" y1="124.5" x2="664.0" y2="124.5"/>
<text class="tk" x="56.0" y="128.5" style="text-anchor:end">±6</text>
<line class="gr" x1="64.0" y1="82.7" x2="664.0" y2="82.7"/>
<text class="tk" x="56.0" y="86.7" style="text-anchor:end">±8</text>
<line class="gr" x1="64.0" y1="40.9" x2="664.0" y2="40.9"/>
<text class="tk" x="56.0" y="44.9" style="text-anchor:end">±10</text>
<line class="ch" x1="64.0" y1="166.4" x2="664.0" y2="166.4"/>
<text class="tx" x="660.0" y="160.4" style="text-anchor:end;fill:#86948a">version 2's lead: 4 points</text>
<polyline class="cv" stroke="#4edea3" points="104.0,193.2 114.0,186.2 124.0,180.0 134.0,174.2 144.0,168.9 154.0,163.8 164.0,159.1 174.0,154.6 184.0,150.3 194.0,146.2 204.0,142.2 214.0,138.4 224.0,134.7 234.0,131.1 244.0,127.6 254.0,124.2 264.0,120.9 274.0,117.7 284.0,114.6 294.0,111.5 304.0,108.5 314.0,105.6 324.0,102.7 334.0,99.9 344.0,97.1 354.0,94.4 364.0,91.7 374.0,89.1 384.0,86.5 394.0,83.9 404.0,81.4 414.0,79.0 424.0,76.5 434.0,74.1 444.0,71.7 454.0,69.4 464.0,67.1 474.0,64.8 484.0,62.6 494.0,60.3 504.0,58.1 514.0,56.0 524.0,53.8 534.0,51.7 544.0,49.6 554.0,47.5 564.0,45.4 574.0,43.4 584.0,41.4 594.0,39.4 604.0,37.4 614.0,35.4 624.0,33.5"/>
<circle cx="469.0" cy="66.2" r="4" fill="#e8a24c"/>
<text class="tx" x="461.0" y="56.2" style="text-anchor:end;fill:#e8a24c">81 disagreements: ±8.8, as if the questions were different</text>
<circle cx="144.0" cy="168.9" r="4" fill="#4edea3"/>
<text class="tx" x="154.0" y="186.9" style="fill:#4edea3">up to 16 disagreements, the 4 points are a real difference</text>
<text class="tk" x="364.0" y="284.0" style="text-anchor:middle">questions on which the two versions disagree (out of 200)</text>
<text class="tk" transform="translate(14,135.0) rotate(-90)" style="text-anchor:middle">95% margin of the difference</text>
</svg>
