<text class="tk" x="585.0" y="33.0" style="text-anchor:middle">discontinua: las opciones en su orden, 52,3 %</text>
<text class="tk" x="370.0" y="288.0" style="text-anchor:middle">letra en la que está la respuesta correcta</text>
