<rect x="438.1" y="137.1" width="46.2" height="114.9" fill="#4edea3" opacity="0.85" rx="2"/>
<text class="tx" x="461.2" y="153.1" style="text-anchor:middle;fill:#131315;font-weight:600">46,0 %</text>
<text class="lb" x="461.2" y="268.0" style="text-anchor:middle">A</text>
<rect x="520.6" y="126.6" width="46.2" height="125.4" fill="#4edea3" opacity="0.85" rx="2"/>
<text class="tx" x="543.8" y="142.6" style="text-anchor:middle;fill:#131315;font-weight:600">50,2 %</text>
<text class="lb" x="543.8" y="268.0" style="text-anchor:middle">B</text>
<rect x="603.1" y="115.6" width="46.2" height="136.4" fill="#4edea3" opacity="0.85" rx="2"/>
