<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 298" width="770" height="298" role="img"
 aria-label="Las mismas 570 preguntas, con las opciones rotadas para que la respuesta correcta quede siempre en la misma letra, leyendo la letra más probable. SmolLM2-360M acierta un 44,2 % con la respuesta correcta en la A, un 36,1 % en la B, un 8,4 % en la C y un 13,0 % en la D, y un 24,7 % con las opciones en su orden; Qwen2.5-0.5B acierta un 46,0 % con la respuesta correcta en la A, un 50,2 % en la B, un 54,6 % en la C y un 46,3 % en la D, y un 52,3 % con las opciones en su orden.">
<style>
  text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #bbcabf; }
  .bx { fill: none; stroke: #3b3b3e; stroke-width: 1; }
  .bx.m { stroke: #4edea3; fill: rgba(78,222,163,0.08); }
  .bx.w { stroke: #e8a24c; fill: rgba(232,162,76,0.08); }
  .bx.x { stroke: #ffb4ab; fill: rgba(255,180,171,0.08); }
  .lb { font-size: 12px; font-weight: 600; }
  .tx { font-size: 11px; }
  .tx.d { fill: #86948a; }
  .tk { font-size: 10.5px; fill: #86948a; }
  .hd { font-size: 10px; fill: #86948a; letter-spacing: 0.1em; }
  .big { font-size: 13px; font-weight: 600; }
  .gr { stroke: #2a2a2c; stroke-width: 1; }
  .ax { stroke: #86948a; stroke-width: 1; }
  .ch { stroke: #86948a; stroke-width: 1; stroke-dasharray: 4 4; }
  .cv { fill: none; stroke-width: 2; stroke-linejoin: round; }
</style>
<text class="lb" x="205.0" y="18.0" style="text-anchor:middle;fill:#e8a24c">SmolLM2-360M</text>
<line class="gr" x1="40.0" y1="252.0" x2="370.0" y2="252.0"/>
<text class="tk" x="34.0" y="256.0" style="text-anchor:end">0 %</text>
