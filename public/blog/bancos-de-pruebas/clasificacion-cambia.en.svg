<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 366" width="740" height="366" role="img"
 aria-label="Eight open models and their MMLU score under three different programs that grade the same exam, as reported by Hugging Face in June 2023, joined by lines. With the original code, which looks at the most likely letter, LLaMA 65B scores 63.6% and ranks first; Falcon 40B scores 55.8% and ranks third. With HELM, which looks at what the model writes, almost the same: 63.7% and 57.1%. With the LM Evaluation Harness, which looks at the probability of the whole option, LLaMA 65B drops to 48.8% and Falcon 40B, at 52.7%, takes first place. The weakest models, close to the 25% of chance with the original code, climb to 33 or 35% with the Harness.">
<style>
  text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #bbcabf; }
