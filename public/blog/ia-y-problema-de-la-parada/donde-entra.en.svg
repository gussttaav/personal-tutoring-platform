<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" width="760" height="200" role="img"
 aria-label="Three boxes from left to right, from what always halts to what may not. On the left, one pass of the model: a fixed circuit that always halts; knowing what it will do on a set of inputs is decidable, though NP-complete. In the middle, chain of thought: many passes in a row, with a token cap, so it halts too; the more steps, the more problems it reaches, and with a polynomial number of steps it solves exactly the problems in the class P. Both are a matter of complexity. On the right, the agent: a loop with tools that can write and run code, with no cap, which amounts to a universal machine; this is where computability begins, and questions such as whether it will halt or delete something fall under Rice's theorem.">
<style>
  text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #bbcabf; }
  .bx { fill: none; stroke: #86948a; stroke-width: 1; }
  .bx.m { stroke: #4edea3; fill: rgba(78,222,163,0.08); }
  .bx.w { stroke: #e8a24c; fill: rgba(232,162,76,0.10); }
  .bx.x { stroke: #ffb4ab; fill: rgba(255,180,171,0.10); }
  .bx.g { stroke: #3b3b3e; }
  .bx.d { stroke: #86948a; stroke-dasharray: 3 3; }
  .bx.o { fill: #131315; }
  .lb { font-size: 12px; font-weight: 600; text-anchor: middle; }
  .sb { font-size: 10.5px; fill: #86948a; text-anchor: middle; }
  .tx { font-size: 11px; }
  .hd { font-size: 10px; fill: #86948a; letter-spacing: 0.1em; }
  .m { fill: #4edea3; }
  .w { fill: #e8a24c; }
  .x { fill: #ffb4ab; }
  .ln { fill: none; stroke: #86948a; stroke-width: 1.2; }
  .ln.m { stroke: #4edea3; }
  .ln.w { stroke: #e8a24c; }
  .ln.x { stroke: #ffb4ab; }
  .ar { fill: none; stroke: #86948a; stroke-width: 1.2; marker-end: url(#a); }
  .ar.m { stroke: #4edea3; marker-end: url(#am); }
  .ar.w { stroke: #e8a24c; marker-end: url(#aw); }
  .ar.x { stroke: #ffb4ab; marker-end: url(#ax); }
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#86948a"/></marker><marker id="am" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#4edea3"/></marker><marker id="aw" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#e8a24c"/></marker><marker id="ax" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#ffb4ab"/></marker></defs>
<text class="hd m" x="260.0" y="30.0" style="text-anchor:middle">COMPLEXITY: ALWAYS HALTS</text>
<path class="ln m" d="M40.0,40.0 L480.0,40.0"/>
<text class="hd x" x="630.0" y="30.0" style="text-anchor:middle">COMPUTABILITY</text>
<path class="ln x" d="M520.0,40.0 L740.0,40.0"/>
<rect class="bx m" x="40.0" y="62.0" width="180.0" height="56.0" rx="6"/>
<text class="lb m" x="130.0" y="88.0">One pass</text>
<text class="sb" x="130.0" y="102.0">a fixed circuit</text>
<text class="sb" x="130.0" y="142.0">always halts;</text>
<text class="sb" x="130.0" y="156.0">verifying it is decidable,</text>
<text class="sb" x="130.0" y="170.0">though NP-complete</text>
<path class="ar" d="M222.0,90.0 L288.0,90.0"/>
<rect class="bx m" x="290.0" y="62.0" width="190.0" height="56.0" rx="6"/>
<text class="lb m" x="385.0" y="88.0">Chain of thought</text>
<text class="sb" x="385.0" y="102.0">many passes, capped</text>
<text class="sb" x="385.0" y="142.0">more steps, more problems;</text>
<text class="sb" x="385.0" y="156.0">with polynomial steps,</text>
<text class="sb" x="385.0" y="170.0">exactly P</text>
<path class="ar" d="M482.0,90.0 L538.0,90.0"/>
<rect class="bx x" x="540.0" y="62.0" width="200.0" height="56.0" rx="6"/>
<text class="lb x" x="640.0" y="88.0">Agent</text>
<text class="sb" x="640.0" y="102.0">loop, tools, code</text>
<text class="sb" x="640.0" y="142.0">no cap: a universal machine;</text>
<text class="sb" x="640.0" y="156.0">whether it halts or deletes</text>
<text class="sb" x="640.0" y="170.0">something is undecidable (Rice)</text>
</svg>
