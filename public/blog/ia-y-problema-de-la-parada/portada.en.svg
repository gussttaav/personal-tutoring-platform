<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img"
 aria-label="An agent's loop: the model, which always halts, and code execution, joined by a cycle with the question of whether it will halt at its centre. From the loop a proposal goes to a checker that always halts and gives a certain conclusion or answers I don't know.">
<style>
  text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #bbcabf; }
  .bx { fill: none; stroke: #86948a; stroke-width: 1; }
  .bx.m { stroke: #4edea3; fill: rgba(78,222,163,0.08); }
  .bx.w { stroke: #e8a24c; fill: rgba(232,162,76,0.10); }
  .bx.x { stroke: #ffb4ab; fill: rgba(255,180,171,0.10); }
  .bx.g { stroke: #3b3b3e; }
  .bx.d { stroke: #86948a; stroke-dasharray: 3 3; }
  .bx.o { fill: #131315; }
  .lb { font-size: 12px; font-weight: 600; text-anchor: middle; }
  .sb { font-size: 10.5px; fill: #86948a; text-anchor: middle; }
  .tx { font-size: 11px; }
  .hd { font-size: 10px; fill: #86948a; letter-spacing: 0.1em; }
  .m { fill: #4edea3; }
  .w { fill: #e8a24c; }
  .x { fill: #ffb4ab; }
  .ln { fill: none; stroke: #86948a; stroke-width: 1.2; }
  .ln.m { stroke: #4edea3; }
  .ln.w { stroke: #e8a24c; }
  .ln.x { stroke: #ffb4ab; }
  .ar { fill: none; stroke: #86948a; stroke-width: 1.2; marker-end: url(#a); }
  .ar.m { stroke: #4edea3; marker-end: url(#am); }
  .ar.w { stroke: #e8a24c; marker-end: url(#aw); }
  .ar.x { stroke: #ffb4ab; marker-end: url(#ax); }
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#86948a"/></marker><marker id="am" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#4edea3"/></marker><marker id="aw" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#e8a24c"/></marker><marker id="ax" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#ffb4ab"/></marker></defs>
<path d="M330.4,114.2 A118,118 0 0 1 330.4,265.8" style="fill:none;stroke:#ffb4ab;stroke-width:2.5" marker-end="url(#ax)"/>
<path d="M149.6,265.8 A118,118 0 0 1 149.6,114.2" style="fill:none;stroke:#ffb4ab;stroke-width:2.5" marker-end="url(#ax)"/>
<rect class="bx m" x="150.0" y="46.0" width="180.0" height="60.0" rx="8"/>
<text x="240.0" y="74.0" style="font-size:22px;font-weight:600;fill:#4edea3;text-anchor:middle">model</text>
<text x="240.0" y="96.0" style="font-size:15px;font-weight:400;fill:#86948a;text-anchor:middle">halts</text>
<rect class="bx w" x="140.0" y="276.0" width="200.0" height="52.0" rx="8"/>
<text x="240.0" y="309.0" style="font-size:20px;font-weight:600;fill:#e8a24c;text-anchor:middle">run code</text>
<text x="240.0" y="198.0" style="font-size:30px;font-weight:700;fill:#ffb4ab;text-anchor:middle">will it halt?</text>
<text x="240.0" y="226.0" style="font-size:15px;font-weight:400;fill:#86948a;text-anchor:middle">the agent's loop</text>
<path d="M362,190 L466,190" style="fill:none;stroke:#86948a;stroke-width:2.5" marker-end="url(#a)"/>
<text x="414.0" y="178.0" style="font-size:16px;font-weight:400;fill:#86948a;text-anchor:middle">proposes</text>
<rect class="bx m" x="472.0" y="140.0" width="260.0" height="100.0" rx="10"/>
<text x="602.0" y="186.0" style="font-size:26px;font-weight:700;fill:#4edea3;text-anchor:middle">Checker</text>
<text x="602.0" y="214.0" style="font-size:15px;font-weight:400;fill:#86948a;text-anchor:middle">always halts</text>
<text x="480.0" y="282.0" style="font-size:18px;font-weight:600;fill:#4edea3;text-anchor:start">✓ certain conclusion</text>
<text x="480.0" y="310.0" style="font-size:18px;font-weight:600;fill:#e8a24c;text-anchor:start">✗ “I don't know”</text>
</svg>
