<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img"
 aria-label="Un triángulo con una propiedad en cada vértice: general, que funciona con cualquier programa; total, que siempre contesta; y exacto, que nunca se equivoca. En el centro, en rojo, una inteligencia artificial que verificase cualquier programa, siempre y sin error, que no existe. Cada lado renuncia a una propiedad. Entre general y total, renunciando a la exactitud: un modelo que siempre da un veredicto y una mejora que se acepta porque aprueba un banco de pruebas. Entre general y exacto, renunciando a contestar siempre: el modelo que propone un certificado que comprueba otro programa, el que contesta no lo sé y el límite de pasos de un agente. Entre total y exacto, renunciando a la generalidad: verificar una red concreta, que es finita, y el sandbox, que restringe lo que el agente puede hacer en lugar de predecirlo.">
<style>
  text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #bbcabf; }
  .bx { fill: none; stroke: #86948a; stroke-width: 1; }
  .bx.m { stroke: #4edea3; fill: rgba(78,222,163,0.08); }
  .bx.w { stroke: #e8a24c; fill: rgba(232,162,76,0.10); }
  .bx.x { stroke: #ffb4ab; fill: rgba(255,180,171,0.10); }
  .bx.g { stroke: #3b3b3e; }
  .bx.d { stroke: #86948a; stroke-dasharray: 3 3; }
  .bx.o { fill: #131315; }
  .lb { font-size: 12px; font-weight: 600; text-anchor: middle; }
  .sb { font-size: 10.5px; fill: #86948a; text-anchor: middle; }
  .tx { font-size: 11px; }
  .hd { font-size: 10px; fill: #86948a; letter-spacing: 0.1em; }
  .m { fill: #4edea3; }
  .w { fill: #e8a24c; }
  .x { fill: #ffb4ab; }
  .ln { fill: none; stroke: #86948a; stroke-width: 1.2; }
  .ln.m { stroke: #4edea3; }
  .ln.w { stroke: #e8a24c; }
  .ln.x { stroke: #ffb4ab; }
  .ar { fill: none; stroke: #86948a; stroke-width: 1.2; marker-end: url(#a); }
  .ar.m { stroke: #4edea3; marker-end: url(#am); }
  .ar.w { stroke: #e8a24c; marker-end: url(#aw); }
  .ar.x { stroke: #ffb4ab; marker-end: url(#ax); }
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#86948a"/></marker><marker id="am" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#4edea3"/></marker><marker id="aw" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#e8a24c"/></marker><marker id="ax" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#ffb4ab"/></marker></defs>
<path class="ln w" d="M380.0,62.0 L210.0,300.0"/>
<path class="ln m" d="M380.0,62.0 L550.0,300.0"/>
<path class="ln m" d="M210.0,300.0 L550.0,300.0"/>
<rect class="bx o" x="300.0" y="32.0" width="160.0" height="44.0" rx="6"/>
<text class="lb" x="380.0" y="52.0">General</text>
<text class="sb" x="380.0" y="66.0">cualquier programa</text>
<rect class="bx o" x="110.0" y="296.0" width="170.0" height="44.0" rx="6"/>
<text class="lb" x="195.0" y="316.0">Total</text>
<text class="sb" x="195.0" y="330.0">siempre contesta</text>
<rect class="bx o" x="480.0" y="296.0" width="170.0" height="44.0" rx="6"/>
<text class="lb" x="565.0" y="316.0">Exacto</text>
<text class="sb" x="565.0" y="330.0">nunca se equivoca</text>
<rect class="bx x" x="322.0" y="177.0" width="116.0" height="56.0" rx="8"/>
<text class="lb x" x="380.0" y="196.0">verificarlo</text>
<text class="lb x" x="380.0" y="210.0">todo, siempre</text>
<text class="sb" x="380.0" y="225.0">no existe</text>
<text class="hd w" x="150.0" y="140.0" style="text-anchor:end">SIN EXACTITUD</text>
<text class="tx" x="150.0" y="156.0" style="text-anchor:end">el modelo que siempre</text>
<text class="tx" x="150.0" y="170.0" style="text-anchor:end">da un veredicto;</text>
<text class="tx" x="150.0" y="184.0" style="text-anchor:end">aprobar un banco</text>
<text class="tx" x="150.0" y="198.0" style="text-anchor:end">de pruebas</text>
<text class="hd m" x="610.0" y="140.0" style="text-anchor:start">SIN CONTESTAR SIEMPRE</text>
<text class="tx" x="610.0" y="156.0" style="text-anchor:start">proponer y comprobar,</text>
<text class="tx" x="610.0" y="170.0" style="text-anchor:start">«no lo sé»,</text>
<text class="tx" x="610.0" y="184.0" style="text-anchor:start">límite de pasos</text>
<text class="tx" x="610.0" y="198.0" style="text-anchor:start">del agente</text>
<text class="hd m" x="380.0" y="372.0" style="text-anchor:middle">SIN GENERALIDAD</text>
<text class="tx" x="380.0" y="388.0" style="text-anchor:middle">verificar una red concreta; el sandbox: restringir, no predecir</text>
<path class="ln w" d="M158.0,166.0 L285.0,182.0"/>
<path class="ln m" d="M602.0,166.0 L475.0,182.0"/>
<path class="ln m" d="M380.0,360.0 L380.0,302.0"/>
</svg>
