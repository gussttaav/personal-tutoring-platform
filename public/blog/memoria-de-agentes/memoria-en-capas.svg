<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 236" width="760" height="236" role="img"
 aria-label="La memoria del asistente de Albarán en cuatro capas, de arriba abajo. Primera, las instrucciones y los procedimientos: un archivo de texto que el equipo revisa y que el asistente lee siempre. Segunda, el historial en bruto: todos los mensajes, con fecha y autor, la fuente de verdad, en la que se busca y se reordena. Tercera, un índice derivado: resúmenes y hechos extraídos que sirven para encontrar y apuntan al mensaje original, nunca lo sustituyen. Cuarta, fuera de la memoria: el estado que manda, como los planes, los cobros y los acuerdos comerciales, en sus sistemas, que el asistente consulta con una herramienta. A la derecha, el modelo lee las cuatro.">
<style>
  text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #bbcabf; }
  .bx { fill: none; stroke: #86948a; stroke-width: 1; }
  .bx.m { stroke: #4edea3; fill: rgba(78,222,163,0.08); }
  .bx.w { stroke: #e8a24c; fill: rgba(232,162,76,0.10); }
  .bx.x { stroke: #ffb4ab; fill: rgba(255,180,171,0.10); }
  .bx.g { stroke: #3b3b3e; }
  .bx.d { stroke: #86948a; stroke-dasharray: 3 3; }
  .lb { font-size: 12px; font-weight: 600; text-anchor: middle; }
  .sb { font-size: 10.5px; fill: #86948a; text-anchor: middle; }
  .tx { font-size: 11px; }
  .tx.d { fill: #86948a; }
  .mo { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; }
  .hd { font-size: 10px; fill: #86948a; letter-spacing: 0.1em; }
  .m { fill: #4edea3; }
  .w { fill: #e8a24c; }
  .x { fill: #ffb4ab; }
  .ar { fill: none; stroke: #86948a; stroke-width: 1.2; marker-end: url(#a); }
  .ar.m { stroke: #4edea3; marker-end: url(#am); }
  .ar.w { stroke: #e8a24c; marker-end: url(#aw); }
  .ar.x { stroke: #ffb4ab; marker-end: url(#ax); }
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#86948a"/></marker><marker id="am" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#4edea3"/></marker><marker id="aw" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#e8a24c"/></marker><marker id="ax" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#ffb4ab"/></marker></defs>
<rect class="bx " x="20.0" y="20.0" width="500.0" height="40.0" rx="6"/>
<text class="lb" x="34.0" y="37.0" style="text-anchor:start">Instrucciones y procedimientos</text>
<text class="sb" x="34.0" y="52.0" style="text-anchor:start">un archivo que el equipo revisa; se lee siempre</text>
<path class="ar" d="M522.0,40.0 L618.0,40.0"/>
<text class="sb" x="570.0" y="35.0">en el prompt</text>
<rect class="bx m" x="20.0" y="70.0" width="500.0" height="40.0" rx="6"/>
<text class="lb m" x="34.0" y="87.0" style="text-anchor:start">Historial en bruto</text>
<text class="sb" x="34.0" y="102.0" style="text-anchor:start">cada mensaje, con fecha y autor: la fuente de verdad</text>
<path class="ar" d="M522.0,90.0 L618.0,90.0"/>
<text class="sb" x="570.0" y="85.0">buscar + reordenar</text>
<rect class="bx d" x="20.0" y="120.0" width="500.0" height="40.0" rx="6"/>
<text class="lb" x="34.0" y="137.0" style="text-anchor:start">Índice derivado</text>
<text class="sb" x="34.0" y="152.0" style="text-anchor:start">resúmenes y hechos para encontrar; apuntan al original</text>
<path class="ar m" d="M470.0,120.0 L470.0,112.0"/>
<path class="ar" d="M522.0,140.0 L618.0,140.0"/>
<text class="sb" x="570.0" y="135.0">buscar</text>
<rect class="bx w" x="20.0" y="184.0" width="500.0" height="40.0" rx="6"/>
<text class="lb w" x="34.0" y="201.0" style="text-anchor:start">Estado que manda</text>
<text class="sb" x="34.0" y="216.0" style="text-anchor:start">planes, cobros, acuerdos: en sus sistemas, no en la memoria</text>
<path class="ar w" d="M522.0,204.0 L618.0,204.0"/>
<text class="sb" x="570.0" y="199.0">herramienta</text>
<text class="hd" x="20.0" y="178.0">FUERA DE LA MEMORIA</text>
<rect class="bx " x="622.0" y="20.0" width="118.0" height="194.0" rx="6"/>
<text class="lb" x="681.0" y="115.0">Modelo</text>
<text class="sb" x="681.0" y="129.0">lee las cuatro</text>
</svg>
