<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 304" width="760" height="304" role="img"
 aria-label="Las mismas tres conversaciones de Lucía con el asistente, guardadas de dos formas. A la izquierda, las conversaciones: el 10 de marzo, Talleres Ruiz tiene 60 días para pedir el reembolso de la renovación anual por un acuerdo con comercial; el 18 de junio, el acuerdo de los 60 días se acaba y desde la renovación de julio vuelven a las condiciones normales; el 10 de septiembre, la pregunta de si el reembolso de la renovación cobrada el 15 de julio está en plazo. Arriba, una memoria de hechos: guarda dos frases sueltas y sin fecha, 60 días por el acuerdo comercial y vuelve a las condiciones normales de su plan; la búsqueda devuelve sólo la primera y la respuesta es sí, hasta el 13 de septiembre, que es falsa. Abajo, el historial en bruto: guarda los mensajes con su fecha; la búsqueda devuelve los de marzo y junio, y la respuesta es no, el plazo de 30 días venció el 14 de agosto, que es la correcta.">
<style>
  text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #bbcabf; }
  .bx { fill: none; stroke: #86948a; stroke-width: 1; }
  .bx.m { stroke: #4edea3; fill: rgba(78,222,163,0.08); }
  .bx.w { stroke: #e8a24c; fill: rgba(232,162,76,0.10); }
  .bx.x { stroke: #ffb4ab; fill: rgba(255,180,171,0.10); }
  .bx.g { stroke: #3b3b3e; }
  .bx.d { stroke: #86948a; stroke-dasharray: 3 3; }
  .lb { font-size: 12px; font-weight: 600; text-anchor: middle; }
  .sb { font-size: 10.5px; fill: #86948a; text-anchor: middle; }
  .tx { font-size: 11px; }
  .tx.d { fill: #86948a; }
  .mo { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; }
  .hd { font-size: 10px; fill: #86948a; letter-spacing: 0.1em; }
  .m { fill: #4edea3; }
  .w { fill: #e8a24c; }
  .x { fill: #ffb4ab; }
  .ar { fill: none; stroke: #86948a; stroke-width: 1.2; marker-end: url(#a); }
  .ar.m { stroke: #4edea3; marker-end: url(#am); }
  .ar.w { stroke: #e8a24c; marker-end: url(#aw); }
  .ar.x { stroke: #ffb4ab; marker-end: url(#ax); }
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#86948a"/></marker><marker id="am" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#4edea3"/></marker><marker id="aw" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#e8a24c"/></marker><marker id="ax" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#ffb4ab"/></marker></defs>
<text class="hd" x="20.0" y="20.0">CONVERSACIONES</text>
<rect class="bx " x="20.0" y="32.0" width="182.0" height="78.0" rx="6"/>
<text class="hd" x="30.0" y="48.0">10 mar</text>
<text class="tx" x="30.0" y="64.0">«Talleres Ruiz tiene 60 días</text>
<text class="tx" x="30.0" y="78.0">para pedir el reembolso de</text>
<text class="tx" x="30.0" y="92.0">la renovación anual: acuerdo</text>
<text class="tx" x="30.0" y="106.0">con comercial.»</text>
<rect class="bx " x="20.0" y="114.0" width="182.0" height="64.0" rx="6"/>
<text class="hd" x="30.0" y="130.0">18 jun</text>
<text class="tx" x="30.0" y="146.0">«Lo de los 60 días de Ruiz</text>
<text class="tx" x="30.0" y="160.0">se acaba: desde la renovación</text>
<text class="tx" x="30.0" y="174.0">de julio, condiciones normales.»</text>
<rect class="bx w" x="20.0" y="214.0" width="182.0" height="64.0" rx="6"/>
<text class="hd" x="30.0" y="230.0">10 sep</text>
<text class="tx" x="30.0" y="246.0">«Ruiz pide el reembolso de la</text>
<text class="tx" x="30.0" y="260.0">renovación del 15 de julio.</text>
<text class="tx" x="30.0" y="274.0">¿Está en plazo?»</text>
<text class="hd" x="272.0" y="20.0">MEMORIA DE HECHOS</text>
<rect class="bx " x="272.0" y="32.0" width="230.0" height="44.0" rx="4"/>
<text class="tx" x="282.0" y="50.0">Talleres Ruiz: 60 días de reembolso</text>
<text class="tx d" x="282.0" y="65.0">(acuerdo comercial)</text>
<rect class="bx d" x="272.0" y="84.0" width="230.0" height="44.0" rx="4"/>
<text class="tx d" x="282.0" y="102.0">Talleres Ruiz vuelve a las</text>
<text class="tx d" x="282.0" y="117.0">condiciones normales de su plan</text>
<text class="sb" x="387.0" y="144.0">sin fecha · sin relación entre ellas</text>
<path d="M204,70 H214 V172 H204" fill="none" stroke="#86948a"/>
<path class="ar" d="M214.0,80.0 L268.0,80.0"/>
<text class="sb" x="243.0" y="72.0">extraer</text>
<line x1="272" y1="160" x2="750" y2="160" stroke="#2a2a2c"/>
<text class="hd" x="272.0" y="174.0">HISTORIAL EN BRUTO</text>
<rect class="bx m" x="272.0" y="184.0" width="230.0" height="24.0" rx="4"/>
<text class="mo" x="282.0" y="200.0">10 mar · «…tiene 60 días…»</text>
<rect class="bx m" x="272.0" y="214.0" width="230.0" height="24.0" rx="4"/>
<text class="mo" x="282.0" y="230.0">18 jun · «…60 días… se acaba»</text>
<rect class="bx g" x="272.0" y="244.0" width="230.0" height="24.0" rx="4"/>
<text class="tx d" x="282.0" y="260.0">… y los demás mensajes</text>
<path class="ar" d="M214.0,172.0 L214.0,196.0 L268.0,196.0"/>
<text class="sb" x="218.0" y="212.0" style="text-anchor:start">guardar</text>
<text class="sb" x="218.0" y="224.0" style="text-anchor:start">tal cual</text>
<path class="ar x" d="M504.0,54.0 L586.0,54.0"/>
<text class="sb" x="546.0" y="46.0">busca</text>
<rect class="bx x" x="590.0" y="32.0" width="160.0" height="46.0" rx="6"/>
<text class="tx x" x="600.0" y="51.0">«Sí: 60 días, hasta</text>
<text class="tx x" x="600.0" y="65.0">el 13 de septiembre.»</text>
<path class="ar m" d="M504.0,211.0 L586.0,211.0"/>
<text class="sb" x="546.0" y="203.0">busca</text>
<rect class="bx m" x="590.0" y="184.0" width="160.0" height="58.0" rx="6"/>
<text class="tx m" x="600.0" y="203.0">«No: sin el acuerdo son</text>
<text class="tx m" x="600.0" y="217.0">30 días, y vencieron el</text>
<text class="tx m" x="600.0" y="231.0">14 de agosto.»</text>
<path d="M110,278 V296 H546 V58" fill="none" stroke="#e8a24c" stroke-width="1.2"/>
<circle cx="546" cy="54" r="3" fill="#e8a24c"/>
<circle cx="546" cy="211" r="3" fill="#e8a24c"/>
<text class="sb w" x="552.0" y="290.0" style="text-anchor:start">la pregunta</text>
</svg>
