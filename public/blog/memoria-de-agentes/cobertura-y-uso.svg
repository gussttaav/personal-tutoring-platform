<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 286" width="760" height="286" role="img"
 aria-label="Dos gráficos de puntos, uno por banco de pruebas, con un punto por sistema de memoria. El eje horizontal es la cobertura, el porcentaje de preguntas para las que el sistema recupera evidencia suficiente, y el vertical, el uso, el porcentaje de esas preguntas que el lector acierta. En MemoryAgentBench, la cobertura va del 19,07 % de MemU al 45,29 % de Raw-RAG, y el uso, sólo del 80 % de EverMemOS al 89,71 % de EMem; Raw-RAG queda en 84,43 %. En MEME, la cobertura va del 35,69 % de MemU al 76,35 % de Raw-RAG, y el uso, del 65,51 % de Mem0 al 86,55 % de EMem; Raw-RAG queda en 73,76 %. En los dos, Raw-RAG es el punto más a la derecha sin ser el más alto.">
