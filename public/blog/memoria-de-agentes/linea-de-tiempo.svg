<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" width="760" height="296" role="img"
 aria-label="Línea de tiempo de 2023 a 2026. Encima del eje, los sistemas de memoria: Generative Agents en abril de 2023, MemoryBank en mayo, MemGPT en octubre; Zep en enero de 2025, A-MEM en febrero, Mem0 en abril, MemOS en mayo, Memory-R1 en agosto; ReFind en agosto de 2026 y Raw-RAG en octubre. Debajo, marcos, bancos de pruebas y productos: CoALA en septiembre de 2023; LoCoMo y la memoria de ChatGPT en febrero de 2024, LongMemEval en octubre; MemoryAgentBench en julio de 2025, la búsqueda de chats de Claude en agosto y la herramienta de memoria de la API de Anthropic en septiembre; MEME en mayo de 2026.">
