<text class="tx" x="410.0" y="210.0" style="text-anchor:middle">8,000</text>
<text class="sb" x="410.0" y="188.0">Billing and payments</text>
<rect class="bx m" x="491.0" y="194.0" width="108.0" height="24.0" rx="3"/>
<text class="tx" x="545.0" y="210.0" style="text-anchor:middle">5,500</text>
<text class="sb" x="545.0" y="188.0">Privacy and data</text>
<rect class="bx m" x="601.0" y="194.0" width="38.0" height="24.0" rx="3"/>
<text class="tx" x="620.0" y="210.0" style="text-anchor:middle">2,000</text>
<line x1="620.0" y1="163.0" x2="620.0" y2="192.0" stroke="#3b3b3e"/>
<text class="sb" x="620.0" y="160.0">Service agreements</text>
<rect class="bx w" x="641.0" y="194.0" width="58.0" height="24.0" rx="3"/>
<text class="tx" x="670.0" y="210.0" style="text-anchor:middle">3,000</text>
<line x1="646.0" y1="177.0" x2="646.0" y2="192.0" stroke="#e8a24c"/>
<text class="sb w" x="641.0" y="174.0" style="text-anchor:start">FAQ</text>
<path class="br x" d="M641.0,229.0 V224.0 H699.0 V229.0"/>
<text class="tx x" x="670.0" y="242.0" style="text-anchor:middle">recomputed: 3,000 tokens</text>
<path class="br m" d="M61.0,229.0 V224.0 H639.0 V229.0"/>
