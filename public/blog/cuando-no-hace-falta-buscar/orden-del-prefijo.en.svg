<text class="tx" x="605.0" y="86.0" style="text-anchor:middle">5,500</text>
<text class="sb" x="605.0" y="64.0">Privacy and data</text>
<rect class="bx x" x="661.0" y="70.0" width="38.0" height="24.0" rx="3"/>
<text class="tx" x="680.0" y="86.0" style="text-anchor:middle">2,000</text>
<line x1="680.0" y1="39.0" x2="680.0" y2="68.0" stroke="#3b3b3e"/>
<text class="sb" x="680.0" y="36.0">Service agreements</text>
<path class="br x" d="M61.0,105.0 V100.0 H699.0 V105.0"/>
<text class="tx x" x="380.0" y="118.0" style="text-anchor:middle">recomputed: 32,000 tokens</text>
<text class="hd" x="20.0" y="142.0">IN ORDER OF STABILITY</text>
