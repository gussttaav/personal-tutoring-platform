<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img"
 aria-label="Dos diagramas, cada uno en dos carriles: arriba lo que se hace una vez y abajo lo que se hace en cada pregunta. RAG: una vez, documentos, trocear en fragmentos, embeber cada fragmento e índice; en cada pregunta, la pregunta, buscar los k fragmentos más cercanos, montar el prompt con la pregunta y los fragmentos, y el modelo responde. CAG: una vez, los 40 documentos enteros, prefill y caché KV guardada; en cada pregunta, la caché más la pregunta, el modelo responde, y la caché se recorta hasta el final de las políticas.">
