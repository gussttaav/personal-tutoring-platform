<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img"
 aria-label="Gráfico de líneas del coste acumulado del conocimiento en las primeras 20 preguntas, en tokens de entrada equivalentes. Todo en el contexto sin caché sube 32 000 por pregunta y llega a 640 000. CAG empieza en 40 000 por la escritura de la caché y sube 3 200 por pregunta, hasta 100 800. RAG con cuatro fragmentos sube 2 000 por pregunta, hasta 40 000. CAG queda por debajo de la versión sin caché desde la segunda pregunta, y su pendiente es casi la de RAG.">
<style>
