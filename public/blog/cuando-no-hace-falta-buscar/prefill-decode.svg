<text class="sb" x="210.0" y="214.0">claves y valores de las políticas, en cada capa</text>
<text class="sb" x="451.0" y="214.0">de la pregunta</text>
<text class="sb" x="607.0" y="214.0">uno más por token</text>
<path class="ar m" d="M669.0,78.0 L669.0,146.0 L260.0,146.0 L260.0,158.0"/>
<text class="tx m" x="268.0" y="140.0">cada token nuevo lee todas las claves y valores anteriores</text>
