<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img"
 aria-label="Table with five columns, one per model: own server, IaaS (EC2), PaaS (App Engine, Heroku), FaaS (Lambda) and BaaS (Firebase). Five rows, from top to bottom: application code, scaling, program that serves requests, operating system and hardware. With your own server you manage everything. With IaaS, the provider manages the hardware. With PaaS, also the operating system and the program, and partly the scaling. With FaaS, everything but your code. With BaaS, also the server code: you only configure.">
