<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img"
 aria-label="Tabla de cinco columnas, una por modelo: servidor propio, IaaS (EC2), PaaS (App Engine, Heroku), FaaS (Lambda) y BaaS (Firebase). Cinco filas, de arriba abajo: código de la aplicación, escalado, programa que atiende peticiones, sistema operativo y hardware. Con un servidor propio todo lo gestionas tú. En IaaS, el proveedor gestiona el hardware. En PaaS, también el sistema operativo y el programa, y el escalado a medias. En FaaS, todo salvo tu código. En BaaS, también el código del servidor: sólo configuras.">
