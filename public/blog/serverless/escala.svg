<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 248" width="760" height="248" role="img"
 aria-label="Cinco filas, una por tanda de peticiones, con un cuadro por petición y la letra de la instancia que la atendió. Diez seguidas: las diez las atiende la instancia A, la primera en frío. Diez a la vez: diez instancias nuevas, de la B a la K, todas en frío. Otras diez a la vez: las mismas diez instancias, en caliente. Veinte a la vez: diez atendidas por esas instancias y diez rechazadas con un error 429. Diez seguidas: todas las atiende la instancia E, en caliente.">
