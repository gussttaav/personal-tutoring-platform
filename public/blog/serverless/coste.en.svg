<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img"
 aria-label="Log-scale chart of the monthly cost against the average requests per second, from 0.1 to 1000, for a 100 ms request with 512 MB, without the free tier. Lambda is a straight line that rises with traffic, from $0.27 a month at 0.1 requests per second to about $2,700 at 1000. One c7g.medium is a flat line at $28.32, and two plus a load balancer, another at $80.88. Lambda crosses the first at about 10 requests per second and the second at about 30.">
<style>
  text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #bbcabf; }
  .bx { fill: none; stroke: #86948a; stroke-width: 1; }
  .bx.m { stroke: #4edea3; fill: rgba(78,222,163,0.14); }
  .bx.w { stroke: #e8a24c; fill: rgba(232,162,76,0.16); }
  .bx.b { stroke: #6fb1e8; fill: rgba(111,177,232,0.14); }
  .bx.x { stroke: #ffb4ab; fill: rgba(255,180,171,0.06); stroke-dasharray: 3 3; }
  .bx.g { stroke: #3b3b3e; }
  .bx.s { stroke: #3b3b3e; fill: rgba(134,148,138,0.10); }
  .bx.h { stroke: #86948a; fill: rgba(134,148,138,0.18); stroke-dasharray: 3 3; }
  .lb { font-size: 12.5px; font-weight: 600; }
  .sb { font-size: 11px; fill: #86948a; }
  .sb.n { font-size: 10px; }
  .tx { font-size: 11.5px; }
  .tx.d { fill: #86948a; }
  .mo { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
  .mo.s { font-size: 10px; }
  .m { fill: #4edea3; }
  .w { fill: #e8a24c; }
  .b { fill: #6fb1e8; }
  .x { fill: #ffb4ab; }
  .ed { stroke: #3b3b3e; stroke-width: 1; }
  .gl { stroke: #2a2a2c; stroke-width: 1; }
  .rf { stroke: #86948a; stroke-width: 1; stroke-dasharray: 4 4; }
  .br { fill: none; stroke: #86948a; stroke-width: 1; }
</style>
<text class="sb" x="16.0" y="16.0">dollars per month</text>
<line class="ed" x1="70.0" y1="238.0" x2="736.0" y2="238.0"/>
<text class="sb" x="62.0" y="242.0" style="text-anchor:end">0.1</text>
<line class="gl" x1="70.0" y1="196.4" x2="736.0" y2="196.4"/>
<text class="sb" x="62.0" y="200.4" style="text-anchor:end">1</text>
<line class="gl" x1="70.0" y1="154.8" x2="736.0" y2="154.8"/>
<text class="sb" x="62.0" y="158.8" style="text-anchor:end">10</text>
<line class="gl" x1="70.0" y1="113.2" x2="736.0" y2="113.2"/>
<text class="sb" x="62.0" y="117.2" style="text-anchor:end">100</text>
<line class="gl" x1="70.0" y1="71.6" x2="736.0" y2="71.6"/>
<text class="sb" x="62.0" y="75.6" style="text-anchor:end">1,000</text>
<line class="gl" x1="70.0" y1="30.0" x2="736.0" y2="30.0"/>
<text class="sb" x="62.0" y="34.0" style="text-anchor:end">10,000</text>
<line class="ed" x1="70.0" y1="238.0" x2="70.0" y2="242.0"/>
<text class="tx" x="70.0" y="255.0" style="text-anchor:middle">0.1</text>
<line class="ed" x1="236.5" y1="238.0" x2="236.5" y2="242.0"/>
<text class="tx" x="236.5" y="255.0" style="text-anchor:middle">1</text>
<line class="ed" x1="403.0" y1="238.0" x2="403.0" y2="242.0"/>
<text class="tx" x="403.0" y="255.0" style="text-anchor:middle">10</text>
<line class="ed" x1="569.5" y1="238.0" x2="569.5" y2="242.0"/>
<text class="tx" x="569.5" y="255.0" style="text-anchor:middle">100</text>
<line class="ed" x1="736.0" y1="238.0" x2="736.0" y2="242.0"/>
<text class="tx" x="736.0" y="255.0" style="text-anchor:middle">1,000</text>
<text class="sb" x="403.0" y="276.0" style="text-anchor:middle">requests per second, on average (1 per second = 2.6 million a month)</text>
<line x1="70.0" y1="220.0" x2="736.0" y2="53.6" stroke="#4edea3" stroke-width="2.2"/>
<text class="tx m" x="648.9" y="63.3" style="text-anchor:end">Lambda, 100 ms and 512 MB</text>
<line x1="70.0" y1="136.0" x2="736.0" y2="136.0" stroke="#e8a24c" stroke-width="2"/>
<text class="tx" x="78.0" y="130.0">one c7g.medium: $28.32</text>
<line x1="70.0" y1="117.0" x2="736.0" y2="117.0" stroke="#6fb1e8" stroke-width="2"/>
<text class="tx" x="78.0" y="111.0">two plus a load balancer: $80.88</text>
<circle cx="406.0" cy="136.0" r="4" fill="#bbcabf"/>
<line class="rf" x1="406.0" y1="142.0" x2="406.0" y2="238.0"/>
<text class="sb" x="412.0" y="152.0">10 per second</text>
<circle cx="481.9" cy="117.0" r="4" fill="#bbcabf"/>
<line class="rf" x1="481.9" y1="123.0" x2="481.9" y2="238.0"/>
<text class="sb" x="487.9" y="133.0">30 per second</text>
</svg>
