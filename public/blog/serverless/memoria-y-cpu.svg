<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" role="img"
 aria-label="Dos gráficos de barras lado a lado, uno por cada memoria configurada: 128, 256, 512, 1024, 1769 y 3008 MB. A la izquierda, el tiempo de la llamada: 3,11, 1,53, 0,78, 0,41, 0,23 y 0,23 segundos; baja en proporción a la memoria hasta 1769 MB y no baja más. A la derecha, el coste por millón de llamadas: 6,73, 6,65, 6,86, 7,15, 6,97 y 11,66 dólares; casi plano hasta 1769 MB, y un 70 % más caro con 3008.">
