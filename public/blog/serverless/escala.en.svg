<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 248" width="760" height="248" role="img"
 aria-label="Five rows, one per batch of requests, with a square per request and the letter of the instance that served it. Ten in a row: instance A serves all ten, the first one cold. Ten at once: ten new instances, B to K, all cold. Another ten at once: the same ten instances, warm. Twenty at once: ten served by those instances and ten rejected with a 429 error. Ten in a row: instance E serves them all, warm.">
