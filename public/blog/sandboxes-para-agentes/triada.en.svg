<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 272" width="760" height="272" role="img"
 aria-label="The lethal trifecta, as a triangle. At the corners, the three ingredients: untrusted content (issues, web pages, files in the repository), private data (keys, tokens, private code) and external communication (the network, a pull request, an email). With all three at once, an injection can read something and send it out. Next to each corner, how to cut it: untrusted content can rarely be removed, because reading it is the job; private data is removed by not mounting the home directory and keeping secrets outside; external communication, with the network closed or a proxy with a list of domains.">
<style>
  text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #bbcabf; }
  .bx { fill: none; stroke: #86948a; stroke-width: 1; }
  .bx.m { stroke: #4edea3; fill: rgba(78,222,163,0.08); }
  .bx.w { stroke: #e8a24c; fill: rgba(232,162,76,0.10); }
  .bx.x { stroke: #ffb4ab; fill: rgba(255,180,171,0.10); }
  .bx.g { stroke: #3b3b3e; }
  .bx.d { stroke: #86948a; stroke-dasharray: 3 3; }
  .lb { font-size: 12px; font-weight: 600; text-anchor: middle; }
  .sb { font-size: 10.5px; fill: #86948a; text-anchor: middle; }
  .tx { font-size: 11px; }
  .hd { font-size: 10px; fill: #86948a; letter-spacing: 0.1em; }
  .m { fill: #4edea3; }
  .w { fill: #e8a24c; }
  .x { fill: #ffb4ab; }
  .ln { fill: none; stroke: #3b3b3e; stroke-width: 1.5; }
  .ln.x { stroke: #ffb4ab; stroke-dasharray: 4 3; }
  .ar { fill: none; stroke: #86948a; stroke-width: 1.2; marker-end: url(#a); }
  .ar.m { stroke: #4edea3; marker-end: url(#am); }
  .ar.w { stroke: #e8a24c; marker-end: url(#aw); }
  .ar.x { stroke: #ffb4ab; marker-end: url(#ax); }
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#86948a"/></marker><marker id="am" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#4edea3"/></marker><marker id="aw" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#e8a24c"/></marker><marker id="ax" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#ffb4ab"/></marker></defs>
<rect class="bx w" x="280.0" y="20.0" width="200.0" height="52.0" rx="6"/>
<text class="lb w" x="380.0" y="44.0">Untrusted content</text>
<text class="sb" x="380.0" y="58.0">issues, web pages, repo files</text>
<rect class="bx x" x="60.0" y="176.0" width="200.0" height="52.0" rx="6"/>
<text class="lb x" x="160.0" y="200.0">Private data</text>
<text class="sb" x="160.0" y="214.0">keys, tokens, private code</text>
<rect class="bx x" x="500.0" y="176.0" width="200.0" height="52.0" rx="6"/>
<text class="lb x" x="600.0" y="200.0">External communication</text>
<text class="sb" x="600.0" y="214.0">network, pull request, email</text>
<path class="ln" d="M310.0,72.0 L200.0,176.0"/>
<path class="ln" d="M450.0,72.0 L560.0,176.0"/>
<path class="ln" d="M260.0,202.0 L500.0,202.0"/>
<text class="sb" x="380.0" y="124.0">All three at once:</text>
<text class="sb" x="380.0" y="138.0">an injection reads something</text>
<text class="sb" x="380.0" y="152.0">and sends it out</text>
<text class="hd" x="740.0" y="26.0" style="text-anchor:end">HOW TO CUT IT</text>
<text class="tx" x="496.0" y="44.0" style="text-anchor:start">Can rarely be removed:</text>
<text class="tx" x="496.0" y="58.0" style="text-anchor:start">reading it is the job.</text>
<text class="sb m" x="160.0" y="248.0">Don't mount the home directory;</text>
<text class="sb m" x="160.0" y="262.0">keep secrets outside the sandbox.</text>
<text class="sb m" x="600.0" y="248.0">Closed network, or a proxy</text>
<text class="sb m" x="600.0" y="262.0">with a list of domains.</text>
</svg>
