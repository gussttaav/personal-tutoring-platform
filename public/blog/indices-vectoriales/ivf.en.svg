<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img"
 aria-label="A plane divided into nine cells by the borders of their centres, with points scattered in clusters. A query, marked with a star, falls near a corner where three cells meet. The two cells whose centres are nearest the query are highlighted, and their points are compared; a dashed circle marks the best point the search finds. The true nearest neighbour, in orange, sits just across the border, inside that circle, in a third cell that is never visited, so the search misses it.">
