<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img"
 aria-label="Tabla de dos ejes. Las filas son dónde mirar: todo (fuerza bruta), árboles, hashing, listas invertidas y grafo. Las columnas son cuánto guardar de cada vector de 768 dimensiones: el vector entero, 3 072 bytes; un byte por número, 768; cuantización por producto, 96; un bit por número, 96. En cada celda, los índices de este artículo que hacen esa combinación. Todo: la fuerza bruta, exacta, con el vector entero, y la búsqueda binaria con reordenación. Árboles con el vector entero: el árbol k-d y Annoy. Hashing con el vector entero: LSH. Listas invertidas: IVF-Flat con el vector entero, IVF-PQ y ScaNN con cuantización por producto, e IVF con RaBitQ con un bit por número. Grafo: HNSW, NSG y Vamana con el vector entero, HNSW con un byte por número y DiskANN con cuantización por producto. Las demás celdas están vacías.">
<style>
  text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #bbcabf; }
  .lbl { font-size: 12px; font-weight: 600; }
  .sub { font-size: 11px; fill: #86948a; }
  .tx { font-size: 12px; }
  .sm { font-size: 11px; }
  .tk { font-size: 10.5px; fill: #86948a; }
  .big { font-size: 13px; font-weight: 600; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
  .ax { stroke: #86948a; stroke-width: 1; }
  .gr { stroke: #2a2a2c; stroke-width: 1; }
</style>
<text class="lbl" x="454.0" y="14.0" text-anchor="middle" style="fill:#6fb1e8">Cuánto guardar de cada vector (768 dimensiones)</text>
<text class="lbl" x="14" y="176" text-anchor="middle" transform="rotate(-90 14 176)" style="fill:#4edea3">Dónde mirar</text>
<text class="sm" x="226.0" y="42.0" text-anchor="middle">Vector entero</text>
<text class="tk" x="226.0" y="57.0" text-anchor="middle">3 072 bytes</text>
<text class="sm" x="378.0" y="42.0" text-anchor="middle">1 byte por número</text>
<text class="tk" x="378.0" y="57.0" text-anchor="middle">768 bytes</text>
<text class="sm" x="530.0" y="42.0" text-anchor="middle">Cuantización por producto</text>
<text class="tk" x="530.0" y="57.0" text-anchor="middle">96 bytes</text>
<text class="sm" x="682.0" y="42.0" text-anchor="middle">1 bit por número</text>
<text class="tk" x="682.0" y="57.0" text-anchor="middle">96 bytes</text>
<text class="sm" x="140.0" y="92.0" text-anchor="end" style="fill:#4edea3">Todo (fuerza bruta)</text>
