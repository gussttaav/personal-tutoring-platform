<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img"
 aria-label="Two-axis table. Rows are where to look: everything (brute force), trees, hashing, inverted lists and graph. Columns are how much of each 768-dimensional vector to keep: the full vector, 3,072 bytes; one byte per number, 768; product quantization, 96; one bit per number, 96. Each cell holds this article's indexes that make that combination. Everything: brute force, exact, with the full vector, and binary search with reranking. Trees with the full vector: the k-d tree and Annoy. Hashing with the full vector: LSH. Inverted lists: IVF-Flat with the full vector, IVF-PQ and ScaNN with product quantization, and IVF with RaBitQ at one bit per number. Graph: HNSW, NSG and Vamana with the full vector, HNSW with one byte per number and DiskANN with product quantization. The other cells are empty.">
<style>
  text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #bbcabf; }
