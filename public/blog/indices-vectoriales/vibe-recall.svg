<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img"
 aria-label="Gráfica de líneas con el recall arriba de cien, de 0,5 a 1, en el eje horizontal, y las preguntas por segundo en escala logarítmica, de 10 a 10 000, en el vertical, con una línea discontinua en recall 0,95. Seis curvas en escalones que bajan hacia la derecha, porque más recall cuesta velocidad; la del hashing acaba antes, en 0,99, el recall más alto que alcanza. De más rápida a más lenta con recall 0,95: el grafo comprimido Glass, 4 125 preguntas por segundo; el grafo hnswlib, 2 001; las listas invertidas con cuantización por producto de Faiss, 1 239; las listas invertidas de Faiss, 246; el árbol Annoy, 117; y el hashing PUFFINN, 12.">
