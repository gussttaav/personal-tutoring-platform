<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img"
 aria-label="A circle with two vectors, a and b, thirty degrees apart, and six random lines through the centre. The only line inside the angle between a and b, in orange, separates them and gives them different bits; the others, in grey, leave them on the same side. On the right, the arithmetic: a random line falls inside the angle with probability theta over pi, so two vectors thirty degrees apart get the same bit with probability 0.83, and two perpendicular ones with 0.50. With 10-bit keys and 20 tables, a vector at 30 degrees comes out as a candidate 97% of the time; at 60 degrees, 30%; at 90 degrees, 2%.">
<style>
  text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #bbcabf; }
  .lbl { font-size: 12px; font-weight: 600; }
  .sub { font-size: 11px; fill: #86948a; }
  .tx { font-size: 12px; }
  .sm { font-size: 11px; }
  .tk { font-size: 10.5px; fill: #86948a; }
  .big { font-size: 13px; font-weight: 600; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
  .ax { stroke: #86948a; stroke-width: 1; }
  .gr { stroke: #2a2a2c; stroke-width: 1; }
</style>
<defs><marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4edea3"/></marker><marker id="hw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8a24c"/></marker><marker id="hm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#86948a"/></marker><marker id="hb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6fb1e8"/></marker></defs>
<circle cx="150" cy="150" r="112" fill="none" stroke="#3b3b3e" stroke-width="1"/>
<line stroke="#5c6660" stroke-width="1.2" x1="25.9" y1="171.9" x2="274.1" y2="128.1"/>
<line stroke="#e8a24c" stroke-width="2.0" x1="50.7" y1="227.6" x2="249.3" y2="72.4"/>
<line stroke="#5c6660" stroke-width="1.2" x1="111.1" y1="269.8" x2="188.9" y2="30.2"/>
<line stroke="#5c6660" stroke-width="1.2" x1="180.5" y1="272.3" x2="119.5" y2="27.7"/>
<line stroke="#5c6660" stroke-width="1.2" x1="235.9" y1="242.2" x2="64.1" y2="57.8"/>
<line stroke="#5c6660" stroke-width="1.2" x1="269.1" y1="191.0" x2="30.9" y2="109.0"/>
<path d="M150,150 L255.2,111.7 A112,112 0 0 0 222.0,64.2 Z" fill="#4edea3" fill-opacity="0.12"/>
<line stroke="#4edea3" stroke-width="2.4" x1="150" y1="150" x2="249.6" y2="113.7" marker-end="url(#ha)"/>
<text class="big" x="266.6" y="112.3" text-anchor="start">a</text>
<line stroke="#4edea3" stroke-width="2.4" x1="150" y1="150" x2="218.1" y2="68.8" marker-end="url(#ha)"/>
<text class="big" x="230.4" y="60.5" text-anchor="start">b</text>
<text class="sm" x="190.4" y="129.9" text-anchor="start">θ</text>
<text class="lbl" x="320.0" y="40.0" text-anchor="start">A random plane through the origin gives one bit:</text>
<text class="tx" x="320.0" y="58.0" text-anchor="start">which side each vector falls on.</text>
<text class="tx" x="320.0" y="84.0" text-anchor="start" style="fill:#e8a24c">It separates a and b only if it falls inside θ.</text>
<text class="tx" x="320.0" y="102.0" text-anchor="start">Probability that it does: θ / π.</text>
<line class="gr" x1="320" y1="118" x2="700" y2="118"/>
<text class="lbl" x="320.0" y="140.0" text-anchor="start">Same bit, 1 − θ / 180°:</text>
<text class="tx" x="320.0" y="160.0" text-anchor="start">θ = 30°</text>
<text class="tx" x="460.0" y="160.0" text-anchor="end">0.83</text>
<text class="tx" x="320.0" y="178.0" text-anchor="start">θ = 90°</text>
<text class="tx" x="460.0" y="178.0" text-anchor="end">0.50</text>
<text class="lbl" x="320.0" y="208.0" text-anchor="start">Candidate with 10 bits and 20 tables:</text>
<text class="tx" x="320.0" y="228.0" text-anchor="start">θ = 30°</text>
<text class="tx" x="460.0" y="228.0" text-anchor="end">97%</text>
<text class="tx" x="320.0" y="246.0" text-anchor="start">θ = 60°</text>
<text class="tx" x="460.0" y="246.0" text-anchor="end">30%</text>
<text class="tx" x="320.0" y="264.0" text-anchor="start">θ = 90°</text>
<text class="tx" x="460.0" y="264.0" text-anchor="end">2%</text>
</svg>
