<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img"
 aria-label="Three layers of an HNSW graph, drawn as stacked planes. Layer 2, on top, has three nodes joined by long links; layer 1, 10; layer 0, at the bottom, all 42 points, each joined to its close neighbours. Dashed lines join each node to its copy in the layer below. A green path starts at the entry point in layer 2, makes 1 long hop towards the query, goes down to layer 1, makes 1 shorter hop, goes down to layer 0 and ends with 2 small steps at the query's nearest neighbour, marked with a star.">
