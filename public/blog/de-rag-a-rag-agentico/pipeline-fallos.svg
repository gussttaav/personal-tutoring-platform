<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 758 303" width="758" height="303" role="img"
 aria-label="El mismo diagrama del RAG ingenuo con seis marcas donde falla. 1, en la pregunta: la pregunta no se parece a su respuesta. 2, en buscar: códigos, números y nombres. 3, en trocear: el corte parte la respuesta. 4, también en buscar: el dato que hace falta para buscar está en un resultado. 5, en el modelo: lo encuentra y no lo usa. 6, al principio del carril de la pregunta: busca siempre, y siempre responde.">
