<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 758 246" width="758" height="246" role="img"
 aria-label="Diagram of naive RAG in two lanes. Top, indexing, once and ahead of time: documents, chunk into fragments, embed each fragment into a vector and store vectors and text in an index. Bottom, asking, on every query: the question as it arrives, embed it with the same model, search the index for the k nearest fragments, build a prompt with the question and the fragments, and the model answers and cites. The two embed steps sit in the same column.">
<style>
  text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #bbcabf; }
  .bx { fill: none; stroke: #86948a; stroke-width: 1; }
  .bx.m { stroke: #4edea3; fill: rgba(78,222,163,0.08); }
  .bx.w { stroke: #e8a24c; fill: rgba(232,162,76,0.08); }
  .bx.x { fill: none; stroke: #ffb4ab; stroke-dasharray: 3 3; }
  .bx.g { stroke: #3b3b3e; }
  .lb { font-size: 12px; font-weight: 600; text-anchor: middle; }
  .sb { font-size: 10.5px; fill: #86948a; text-anchor: middle; }
  .tx { font-size: 11px; }
  .tx.d { fill: #86948a; }
  .mo { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; }
  .hd { font-size: 10px; fill: #86948a; letter-spacing: 0.1em; }
  .m { fill: #4edea3; }
  .w { fill: #e8a24c; }
  .x { fill: #ffb4ab; }
  .ar { fill: none; stroke: #86948a; stroke-width: 1.2; marker-end: url(#a); }
  .ar.m { stroke: #4edea3; marker-end: url(#am); }
  .ar.x { stroke: #ffb4ab; stroke-dasharray: 3 3; marker-end: url(#ax); }
  .nb { fill: #1d1d1f; stroke: #ffb4ab; stroke-width: 1.2; }
  .nt { font-size: 10.5px; font-weight: 700; fill: #ffb4ab; text-anchor: middle; }
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#86948a"/></marker><marker id="am" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#4edea3"/></marker><marker id="ax" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#ffb4ab"/></marker></defs>
<text class="hd" x="0.0" y="14.0">INDEX · ONCE, AHEAD OF TIME</text>
<text class="hd" x="0.0" y="120.0">ASK · ON EVERY QUERY</text>
<rect class="bx " x="0.0" y="26.0" width="118.0" height="46.0" rx="6"/>
<text class="lb" x="59.0" y="47.0">Documents</text>
<text class="sb" x="59.0" y="61.0">wiki, PDF, tickets</text>
<rect class="bx " x="128.0" y="26.0" width="118.0" height="46.0" rx="6"/>
<text class="lb" x="187.0" y="47.0">Chunk</text>
<text class="sb" x="187.0" y="61.0">into fragments</text>
<path class="ar" d="M118.0,49.0 L126.0,49.0"/>
<rect class="bx " x="256.0" y="26.0" width="118.0" height="46.0" rx="6"/>
<text class="lb" x="315.0" y="47.0">Embed</text>
<text class="sb" x="315.0" y="61.0">one vector each</text>
<path class="ar" d="M246.0,49.0 L254.0,49.0"/>
<rect class="bx " x="384.0" y="26.0" width="118.0" height="46.0" rx="6"/>
<text class="lb" x="443.0" y="47.0">Index</text>
<text class="sb" x="443.0" y="61.0">vectors + text</text>
<path class="ar" d="M374.0,49.0 L382.0,49.0"/>
<rect class="bx " x="0.0" y="150.0" width="118.0" height="46.0" rx="6"/>
<text class="lb" x="59.0" y="171.0">Question</text>
<text class="sb" x="59.0" y="185.0">as it arrives</text>
<path class="ar" d="M118.0,173.0 L254.0,173.0"/>
<rect class="bx " x="256.0" y="150.0" width="118.0" height="46.0" rx="6"/>
<text class="lb" x="315.0" y="171.0">Embed</text>
<text class="sb" x="315.0" y="185.0">the same model</text>
<rect class="bx " x="384.0" y="150.0" width="118.0" height="46.0" rx="6"/>
<text class="lb" x="443.0" y="171.0">Search</text>
<text class="sb" x="443.0" y="185.0">the k nearest</text>
<rect class="bx " x="512.0" y="150.0" width="118.0" height="46.0" rx="6"/>
<text class="lb" x="571.0" y="171.0">Prompt</text>
<text class="sb" x="571.0" y="185.0">with the chunks</text>
<rect class="bx " x="640.0" y="150.0" width="118.0" height="46.0" rx="6"/>
<text class="lb" x="699.0" y="171.0">Model</text>
<text class="sb" x="699.0" y="185.0">answers and cites</text>
<path class="ar" d="M374.0,173.0 L382.0,173.0"/>
<path class="ar" d="M502.0,173.0 L510.0,173.0"/>
<path class="ar" d="M630.0,173.0 L638.0,173.0"/>
<path class="ar" d="M443.0,72.0 L443.0,148.0"/>
<path class="ar" d="M59.0,196.0 L59.0,218.0 L571.0,218.0 L571.0,198.0" stroke-dasharray="3 3"/>
<text class="sb" x="315.0" y="213.0">the question also goes into the prompt</text>
<path class="ar" d="M699.0,196.0 L699.0,224.0"/>
<text class="sb" x="699.0" y="238.0">answer</text>
</svg>
