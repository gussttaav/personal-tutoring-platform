<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 308" width="750" height="308" role="img"
 aria-label="The question “Is the customer on ticket 4812 entitled to a refund?” searched two ways. Lexical search, BM25, returns ticket 4812, ticket 4182, the refunds FAQ and ticket 4821, in that order. Dense search returns the FAQ, 4821, 4182 and 4812 fourth. Reciprocal rank fusion with c equal to 60 orders them: FAQ, ticket 4812, 4182 and 4821; the top three go to the prompt. Below, the Team plan terms, which give 30 days, appear in neither list because the question never says Team.">
