<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 262" width="750" height="262" role="img"
 aria-label="Diagrama del bucle del RAG agéntico. La pregunta entra en el modelo, que lee todo lo acumulado. Si le falta algo, llama a buscar con una consulta que escribe él y una fuente que elige entre incidencias, con búsqueda léxica, documentación, con búsqueda híbrida, y la web. Los fragmentos vuelven al contexto como observación y el modelo decide otra vez. Cuando lo tiene, responde con citas o dice que no lo sabe. El código sólo fija el presupuesto, seis vueltas.">
<style>
  text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #bbcabf; }
  .bx { fill: none; stroke: #86948a; stroke-width: 1; }
  .bx.m { stroke: #4edea3; fill: rgba(78,222,163,0.08); }
  .bx.w { stroke: #e8a24c; fill: rgba(232,162,76,0.08); }
  .bx.x { fill: none; stroke: #ffb4ab; stroke-dasharray: 3 3; }
  .bx.g { stroke: #3b3b3e; }
  .lb { font-size: 12px; font-weight: 600; text-anchor: middle; }
  .sb { font-size: 10.5px; fill: #86948a; text-anchor: middle; }
  .tx { font-size: 11px; }
  .tx.d { fill: #86948a; }
  .mo { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; }
  .hd { font-size: 10px; fill: #86948a; letter-spacing: 0.1em; }
  .m { fill: #4edea3; }
  .w { fill: #e8a24c; }
  .x { fill: #ffb4ab; }
  .ar { fill: none; stroke: #86948a; stroke-width: 1.2; marker-end: url(#a); }
  .ar.m { stroke: #4edea3; marker-end: url(#am); }
  .ar.x { stroke: #ffb4ab; stroke-dasharray: 3 3; marker-end: url(#ax); }
  .nb { fill: #1d1d1f; stroke: #ffb4ab; stroke-width: 1.2; }
  .nt { font-size: 10.5px; font-weight: 700; fill: #ffb4ab; text-anchor: middle; }
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#86948a"/></marker><marker id="am" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#4edea3"/></marker><marker id="ax" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#ffb4ab"/></marker></defs>
<rect class="bx " x="0.0" y="98.0" width="104.0" height="44.0" rx="6"/>
<text class="lb" x="52.0" y="124.0">Pregunta</text>
<rect class="bx m" x="146.0" y="83.0" width="164.0" height="74.0" rx="6"/>
<text class="lb m" x="228.0" y="118.0">Modelo</text>
<text class="sb" x="228.0" y="132.0">lee todo lo acumulado</text>
<path class="ar" d="M104.0,120.0 L144.0,120.0"/>
<rect class="bx " x="372.0" y="24.0" width="186.0" height="48.0" rx="6"/>
<text class="mo" x="465.0" y="44.0" style="text-anchor:middle">buscar(consulta, fuente)</text>
<text class="sb m" x="465.0" y="61.0">la consulta la escribe él</text>
<rect class="bx g" x="598.0" y="6.0" width="150.0" height="26.0" rx="6"/>
<text class="tx" x="673.0" y="23.0" style="text-anchor:middle">incidencias · léxica</text>
<rect class="bx g" x="598.0" y="38.0" width="150.0" height="26.0" rx="6"/>
<text class="tx" x="673.0" y="55.0" style="text-anchor:middle">documentación · híbrida</text>
<rect class="bx g" x="598.0" y="70.0" width="150.0" height="26.0" rx="6"/>
<text class="tx" x="673.0" y="87.0" style="text-anchor:middle">web</text>
<path class="ar" d="M558.0,48.0 L596.0,48.0"/>
<rect class="bx " x="372.0" y="150.0" width="186.0" height="48.0" rx="6"/>
<text class="lb" x="465.0" y="172.0">Observación</text>
<text class="sb" x="465.0" y="186.0">los fragmentos, al contexto</text>
<path class="ar m" d="M250.0,83.0 L250.0,48.0 L370.0,48.0"/>
<text class="sb m" x="258.0" y="40.0" style="text-anchor:start">le falta algo</text>
<path class="ar" d="M673.0,102.0 L673.0,174.0 L560.0,174.0"/>
<path class="ar" d="M372.0,174.0 L312.0,174.0 L312.0,142.0"/>
<path class="ar m" d="M200.0,157.0 L200.0,214.0"/>
<text class="sb m" x="208.0" y="190.0" style="text-anchor:start">lo tiene</text>
<rect class="bx " x="118.0" y="216.0" width="164.0" height="44.0" rx="6"/>
<text class="lb" x="200.0" y="236.0">Responder</text>
<text class="sb" x="200.0" y="250.0">con citas, o «no lo sé»</text>
<text class="sb" x="748.0" y="238.0" style="text-anchor:end">el código sólo fija el presupuesto: 6 vueltas</text>
</svg>
