<text class="tk" x="732.0" y="26.0" style="text-anchor:end">cualquier respuesta</text>
<text class="lb" x="88.0" y="48.0" style="text-anchor:middle">Una referencia</text>
<rect class="bx " x="0.0" y="60.0" width="176.0" height="50.0" rx="6"/>
<text class="hd" x="10.0" y="75.0">RECIBE</text>
<text class="tx" x="10.0" y="90.0">la respuesta y otra escrita</text>
<text class="tx" x="10.0" y="104.0">de antemano</text>
<path class="ar" d="M88.0,111.0 L88.0,123.0"/>
<rect class="bx " x="0.0" y="124.0" width="176.0" height="36.0" rx="6"/>
<text class="hd" x="10.0" y="139.0">HACE</text>
<text class="tx" x="10.0" y="154.0">cuenta palabras en común</text>
<path class="ar" d="M88.0,161.0 L88.0,173.0"/>
<rect class="bx " x="0.0" y="174.0" width="176.0" height="36.0" rx="6"/>
<text class="hd" x="10.0" y="189.0">DEVUELVE</text>
<text class="tx" x="10.0" y="204.0">un número de 0 a 1</text>
<rect class="bx x" x="0.0" y="224.0" width="176.0" height="56.0" rx="6"/>
<text class="hd" x="10.0" y="239.0">CON A, B, C Y D</text>
<text class="tx" x="10.0" y="254.0" style="fill:#ffb4ab">B 0,81  D 0,52  A 0,36  C 0,30</text>
<text class="tx" x="10.0" y="270.0" style="fill:#ffb4ab">la falsa, primera</text>
<text class="lb" x="276.0" y="48.0" style="text-anchor:middle">Un programa</text>
<rect class="bx " x="188.0" y="60.0" width="176.0" height="36.0" rx="6"/>
<text class="hd" x="198.0" y="75.0">RECIBE</text>
<text class="tx" x="198.0" y="90.0">la respuesta</text>
<path class="ar" d="M276.0,97.0 L276.0,109.0"/>
<rect class="bx " x="188.0" y="110.0" width="176.0" height="50.0" rx="6"/>
<text class="hd" x="198.0" y="125.0">HACE</text>
<text class="tx" x="198.0" y="140.0">extrae el sí o el no y la</text>
<text class="tx" x="198.0" y="154.0">fecha, y los compara</text>
<path class="ar" d="M276.0,161.0 L276.0,173.0"/>
<rect class="bx " x="188.0" y="174.0" width="176.0" height="36.0" rx="6"/>
<text class="hd" x="198.0" y="189.0">DEVUELVE</text>
<text class="tx" x="198.0" y="204.0">pasa o no pasa</text>
<rect class="bx m" x="188.0" y="224.0" width="176.0" height="70.0" rx="6"/>
<text class="hd" x="198.0" y="239.0">CON A, B, C Y D</text>
<text class="tx" x="198.0" y="254.0" style="fill:#4edea3">A ✓  B ✗  C ✓  D ✓</text>
<text class="tx" x="198.0" y="270.0" style="fill:#4edea3">acierta en lo que</text>
<text class="tx" x="198.0" y="284.0" style="fill:#4edea3">comprueba, y sólo en eso</text>
<text class="lb" x="464.0" y="48.0" style="text-anchor:middle">Una persona</text>
<rect class="bx " x="376.0" y="60.0" width="176.0" height="50.0" rx="6"/>
<text class="hd" x="386.0" y="75.0">RECIBE</text>
<text class="tx" x="386.0" y="90.0">dos respuestas, o una y una</text>
<text class="tx" x="386.0" y="104.0">escala</text>
<path class="ar" d="M464.0,111.0 L464.0,123.0"/>
<rect class="bx " x="376.0" y="124.0" width="176.0" height="36.0" rx="6"/>
<text class="hd" x="386.0" y="139.0">HACE</text>
<text class="tx" x="386.0" y="154.0">lee y elige</text>
<path class="ar" d="M464.0,161.0 L464.0,173.0"/>
<rect class="bx " x="376.0" y="174.0" width="176.0" height="36.0" rx="6"/>
<text class="hd" x="386.0" y="189.0">DEVUELVE</text>
<text class="tx" x="386.0" y="204.0">una preferencia</text>
<rect class="bx w" x="376.0" y="224.0" width="176.0" height="68.0" rx="6"/>
<text class="hd" x="386.0" y="239.0">CON A, B, C Y D</text>
<text class="tx" x="386.0" y="254.0" style="fill:#e8a24c">acierta si conoce el plan</text>
<text class="tx" x="386.0" y="268.0" style="fill:#e8a24c">Equipo; si no, B suena tan</text>
<text class="tx" x="386.0" y="282.0" style="fill:#e8a24c">segura como A</text>
<text class="lb" x="652.0" y="48.0" style="text-anchor:middle">Otro modelo</text>
<rect class="bx " x="564.0" y="60.0" width="176.0" height="50.0" rx="6"/>
<text class="hd" x="574.0" y="75.0">RECIBE</text>
<text class="tx" x="574.0" y="90.0">pregunta, respuesta e</text>
<text class="tx" x="574.0" y="104.0">instrucciones</text>
<path class="ar" d="M652.0,111.0 L652.0,123.0"/>
<rect class="bx " x="564.0" y="124.0" width="176.0" height="36.0" rx="6"/>
<text class="hd" x="574.0" y="139.0">HACE</text>
<text class="tx" x="574.0" y="154.0">lee, razona y puntúa</text>
<path class="ar" d="M652.0,161.0 L652.0,173.0"/>
<rect class="bx " x="564.0" y="174.0" width="176.0" height="36.0" rx="6"/>
<text class="hd" x="574.0" y="189.0">DEVUELVE</text>
<text class="tx" x="574.0" y="204.0">un veredicto y su motivo</text>
<rect class="bx w" x="564.0" y="224.0" width="176.0" height="82.0" rx="6"/>
<text class="hd" x="574.0" y="239.0">CON A, B, C Y D</text>
<text class="tx" x="574.0" y="254.0" style="fill:#e8a24c">acierta si le das las</text>
<text class="tx" x="574.0" y="268.0" style="fill:#e8a24c">condiciones del plan;</text>
<text class="tx" x="574.0" y="282.0" style="fill:#e8a24c">tiende a preferir D, la más</text>
<text class="tx" x="574.0" y="296.0" style="fill:#e8a24c">larga</text>
</svg>
