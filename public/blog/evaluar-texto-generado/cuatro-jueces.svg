<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 310" width="740" height="310" role="img"
 aria-label="Cuatro columnas, una por juez, de izquierda a derecha, sobre una flecha que va de juzgar sólo respuestas que se pueden prever a juzgar cualquier respuesta. Una referencia recibe la respuesta y otra escrita de antemano, cuenta palabras en común y devuelve un número de 0 a 1; con las cuatro respuestas, B 0,81, D 0,52, A 0,36, C 0,30: la falsa, primera. Un programa recibe la respuesta, extrae el sí o el no y la fecha y los compara, y devuelve pasa o no pasa; aprueba las respuestas A, C y D y suspende la B: acierta en lo que comprueba, y sólo en eso. Una persona recibe dos respuestas, o una y una escala, lee y elige, y devuelve una preferencia; acierta si conoce el plan Equipo, y si no, B suena tan segura como A. Otro modelo recibe la pregunta, la respuesta e instrucciones, lee, razona y puntúa, y devuelve un veredicto y su motivo; acierta si le das las condiciones del plan, y tiende a preferir D, la más larga.">
<style>
  text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #bbcabf; }
  .bx { fill: none; stroke: #3b3b3e; stroke-width: 1; }
  .bx.m { stroke: #4edea3; fill: rgba(78,222,163,0.08); }
  .bx.w { stroke: #e8a24c; fill: rgba(232,162,76,0.08); }
  .bx.x { stroke: #ffb4ab; fill: rgba(255,180,171,0.08); }
  .lb { font-size: 12px; font-weight: 600; }
  .tx { font-size: 11px; }
  .tx.d { fill: #86948a; }
  .tk { font-size: 10.5px; fill: #86948a; }
  .hd { font-size: 10px; fill: #86948a; letter-spacing: 0.1em; }
  .big { font-size: 13px; font-weight: 600; }
  .m { fill: #4edea3; }
  .w { fill: #e8a24c; }
  .x { fill: #ffb4ab; }
  .gr { stroke: #2a2a2c; stroke-width: 1; }
  .ax { stroke: #86948a; stroke-width: 1; }
  .ar { fill: none; stroke: #86948a; stroke-width: 1.2; marker-end: url(#a); }
  .cv { fill: none; stroke-width: 2; stroke-linejoin: round; }
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#86948a"/></marker></defs>
<path class="ar" d="M330.0,10 L4.0,10"/>
<path class="ar" d="M410.0,10 L736.0,10"/>
