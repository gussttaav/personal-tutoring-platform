<text class="hd" x="574.0" y="189.0">RETURNS</text>
<text class="tx" x="574.0" y="204.0">a verdict and its reason</text>
<rect class="bx w" x="564.0" y="224.0" width="176.0" height="68.0" rx="6"/>
<text class="hd" x="574.0" y="239.0">ON A, B, C AND D</text>
<text class="tx" x="574.0" y="254.0" style="fill:#e8a24c">right if given the plan's</text>
