<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 298" width="740" height="298" role="img"
 aria-label="Four columns, one per judge, from left to right, above an arrow that runs from judging only answers that can be foreseen to judging any answer. A reference takes the answer and one written in advance, counts shared words and returns a number from 0 to 1; on the four answers, B 0.81, D 0.52, A 0.36, C 0.30: the false one comes first. A program takes the answer, extracts the yes or no and the date and compares them, and returns pass or fail; it passes answers A, C and D and fails B: right about what it checks, and only that. A person takes two answers, or one and a scale, reads and picks, and returns a preference; they are right if they know the Team plan, and if not, B sounds as sure as A. Another model takes the question, the answer and instructions, reads, reasons and scores, and returns a verdict and its reason; it is right if given the plan's terms, and tends to prefer D, the longest.">
<style>
  text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #bbcabf; }
  .bx { fill: none; stroke: #3b3b3e; stroke-width: 1; }
  .bx.m { stroke: #4edea3; fill: rgba(78,222,163,0.08); }
  .bx.w { stroke: #e8a24c; fill: rgba(232,162,76,0.08); }
  .bx.x { stroke: #ffb4ab; fill: rgba(255,180,171,0.08); }
  .lb { font-size: 12px; font-weight: 600; }
  .tx { font-size: 11px; }
  .tx.d { fill: #86948a; }
  .tk { font-size: 10.5px; fill: #86948a; }
  .hd { font-size: 10px; fill: #86948a; letter-spacing: 0.1em; }
  .big { font-size: 13px; font-weight: 600; }
  .m { fill: #4edea3; }
  .w { fill: #e8a24c; }
  .x { fill: #ffb4ab; }
  .gr { stroke: #2a2a2c; stroke-width: 1; }
  .ax { stroke: #86948a; stroke-width: 1; }
  .ar { fill: none; stroke: #86948a; stroke-width: 1.2; marker-end: url(#a); }
  .cv { fill: none; stroke-width: 2; stroke-linejoin: round; }
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#86948a"/></marker></defs>
