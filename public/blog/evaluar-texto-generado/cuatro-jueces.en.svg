<text class="tk" x="732.0" y="26.0" style="text-anchor:end">any answer</text>
<text class="lb" x="88.0" y="48.0" style="text-anchor:middle">A reference</text>
<rect class="bx " x="0.0" y="60.0" width="176.0" height="50.0" rx="6"/>
<text class="hd" x="10.0" y="75.0">TAKES</text>
<text class="tx" x="10.0" y="90.0">the answer and one written</text>
<text class="tx" x="10.0" y="104.0">in advance</text>
<path class="ar" d="M88.0,111.0 L88.0,123.0"/>
<rect class="bx " x="0.0" y="124.0" width="176.0" height="36.0" rx="6"/>
<text class="hd" x="10.0" y="139.0">DOES</text>
