<text class="hd" x="10.0" y="239.0">ON A, B, C AND D</text>
<text class="tx" x="10.0" y="254.0" style="fill:#ffb4ab">B 0.81  D 0.52  A 0.36  C 0.30</text>
<text class="tx" x="10.0" y="270.0" style="fill:#ffb4ab">the false one comes first</text>
<text class="lb" x="276.0" y="48.0" style="text-anchor:middle">A program</text>
