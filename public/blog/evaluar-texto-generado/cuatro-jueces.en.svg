<rect class="bx " x="376.0" y="124.0" width="176.0" height="36.0" rx="6"/>
<text class="hd" x="386.0" y="139.0">DOES</text>
<text class="tx" x="386.0" y="154.0">reads and picks</text>
<path class="ar" d="M464.0,161.0 L464.0,173.0"/>
<rect class="bx " x="376.0" y="174.0" width="176.0" height="36.0" rx="6"/>
