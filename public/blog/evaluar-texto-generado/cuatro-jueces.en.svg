<text class="hd" x="386.0" y="239.0">ON A, B, C AND D</text>
<text class="tx" x="386.0" y="254.0" style="fill:#e8a24c">right if they know the Team</text>
<text class="tx" x="386.0" y="268.0" style="fill:#e8a24c">plan; if not, B sounds as</text>
<text class="tx" x="386.0" y="282.0" style="fill:#e8a24c">sure as A</text>
<text class="lb" x="652.0" y="48.0" style="text-anchor:middle">Another model</text>
<rect class="bx " x="564.0" y="60.0" width="176.0" height="50.0" rx="6"/>
<text class="hd" x="574.0" y="75.0">TAKES</text>
