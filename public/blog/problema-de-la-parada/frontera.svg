<text class="sb x" x="610.0" y="164.0">ZFC no puede</text>
<text class="sb x" x="610.0" y="178.0">demostrar si se para</text>
<text class="hd" x="390.0" y="212.0" style="text-anchor:middle">NÚMERO DE ESTADOS (NO A ESCALA)</text>
</svg>
