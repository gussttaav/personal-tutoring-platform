<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" role="img"
 aria-label="Un eje horizontal, no a escala, con el número de estados de una máquina de Turing. De 1 a 5 estados, en verde, los valores del castor atareado que se conocen: 1, 6, 21, 107 y 47 176 870, este último demostrado en Coq en 2024. En 6 estados, en naranja, empieza lo desconocido: Antihydra, un problema del tipo de Collatz. Más a la derecha, máquinas que se paran si y sólo si es falsa una conjetura: la de Erdős con 15 estados, la de Goldbach con 27 y la hipótesis de Riemann con 744. En 643 estados, en rojo, una máquina de la que la teoría de conjuntos habitual, ZFC, no puede demostrar si se para.">
<style>
  text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #bbcabf; }
  .bx { fill: none; stroke: #86948a; stroke-width: 1; }
