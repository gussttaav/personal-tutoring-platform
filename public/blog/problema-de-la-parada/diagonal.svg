<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 268" width="760" height="268" role="img"
 aria-label="Una tabla con cinco programas en las filas y los mismos cinco programas como entradas en las columnas. Cada casilla dice si el programa de la fila termina con esa entrada o se queda ejecutándose para siempre. Las casillas de la diagonal, en las que cada programa recibe su propio código, están destacadas. Debajo, una fila más, la de paradoja, que en cada columna hace lo contrario de lo que dice la diagonal: donde la diagonal termina, paradoja no termina, y al revés. Por eso paradoja se distingue de cada fila de la tabla en al menos una casilla y no puede ser ninguna de ellas.">
