<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" role="img"
 aria-label="A horizontal axis, not to scale, with the number of states of a Turing machine. From 1 to 5 states, in green, the busy beaver values that are known: 1, 6, 21, 107 and 47,176,870, the last one proved in Coq in 2024. At 6 states, in orange, the unknown begins: Antihydra, a Collatz-like problem. Further right, machines that halt if and only if a conjecture is false: Erdős's with 15 states, Goldbach's with 27 and the Riemann hypothesis with 744. At 643 states, in red, a machine for which the usual set theory, ZFC, cannot prove whether it halts.">
<style>
  text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #bbcabf; }
  .bx { fill: none; stroke: #86948a; stroke-width: 1; }
  .bx.m { stroke: #4edea3; fill: rgba(78,222,163,0.08); }
  .bx.w { stroke: #e8a24c; fill: rgba(232,162,76,0.10); }
  .bx.x { stroke: #ffb4ab; fill: rgba(255,180,171,0.10); }
  .bx.g { stroke: #3b3b3e; }
  .bx.d { stroke: #86948a; stroke-dasharray: 3 3; }
  .bx.o { fill: #131315; }
  .lb { font-size: 12px; font-weight: 600; text-anchor: middle; }
  .sb { font-size: 10.5px; fill: #86948a; text-anchor: middle; }
  .tx { font-size: 11px; }
  .hd { font-size: 10px; fill: #86948a; letter-spacing: 0.1em; }
  .m { fill: #4edea3; }
  .w { fill: #e8a24c; }
  .x { fill: #ffb4ab; }
  .ln { fill: none; stroke: #86948a; stroke-width: 1.2; }
  .ln.m { stroke: #4edea3; }
  .ln.w { stroke: #e8a24c; }
  .ln.x { stroke: #ffb4ab; }
  .ar { fill: none; stroke: #86948a; stroke-width: 1.2; marker-end: url(#a); }
  .ar.m { stroke: #4edea3; marker-end: url(#am); }
  .ar.w { stroke: #e8a24c; marker-end: url(#aw); }
  .ar.x { stroke: #ffb4ab; marker-end: url(#ax); }
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#86948a"/></marker><marker id="am" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#4edea3"/></marker><marker id="aw" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#e8a24c"/></marker><marker id="ax" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#ffb4ab"/></marker></defs>
<path class="ln m" d="M40.0,120.0 L300.0,120.0"/>
<path class="ln w" d="M300.0,120.0 L575.0,120.0"/>
<path class="ln x" d="M575.0,120.0 L735.0,120.0"/>
<text class="hd m" x="150.0" y="30.0" style="text-anchor:middle">BB(n) IS KNOWN</text>
<text class="hd w" x="440.0" y="30.0" style="text-anchor:middle">OPEN</text>
<text class="hd x" x="660.0" y="30.0" style="text-anchor:middle">BEYOND ZFC</text>
<circle cx="40.0" cy="120.0" r="4" class="m"/>
<text class="lb m" x="40.0" y="142.0">1</text>
<circle cx="85.0" cy="120.0" r="4" class="m"/>
<text class="lb m" x="85.0" y="142.0">2</text>
<circle cx="130.0" cy="120.0" r="4" class="m"/>
<text class="lb m" x="130.0" y="142.0">3</text>
<circle cx="175.0" cy="120.0" r="4" class="m"/>
<text class="lb m" x="175.0" y="142.0">4</text>
<circle cx="240.0" cy="120.0" r="4" class="m"/>
<text class="lb m" x="240.0" y="142.0">5</text>
<circle cx="330.0" cy="120.0" r="4" class="w"/>
<text class="lb w" x="330.0" y="142.0">6</text>
<circle cx="420.0" cy="120.0" r="4" class="w"/>
<text class="lb w" x="420.0" y="142.0">15</text>
<circle cx="500.0" cy="120.0" r="4" class="w"/>
<text class="lb w" x="500.0" y="142.0">27</text>
<circle cx="610.0" cy="120.0" r="4" class="x"/>
<text class="lb x" x="610.0" y="142.0">643</text>
<circle cx="700.0" cy="120.0" r="4" class="x"/>
<text class="lb x" x="700.0" y="142.0">744</text>
<text class="tx" x="40.0" y="106.0" style="text-anchor:middle">1</text>
<text class="tx" x="85.0" y="106.0" style="text-anchor:middle">6</text>
<text class="tx" x="130.0" y="106.0" style="text-anchor:middle">21</text>
<text class="tx" x="175.0" y="106.0" style="text-anchor:middle">107</text>
<text class="lb m" x="240.0" y="92.0">47,176,870</text>
<text class="sb" x="240.0" y="106.0">Coq, 2024</text>
<text class="lb w" x="330.0" y="92.0">Antihydra</text>
<text class="sb" x="330.0" y="106.0">Collatz-like</text>
<text class="tx" x="420.0" y="106.0" style="text-anchor:middle">Erdős</text>
<text class="tx" x="500.0" y="106.0" style="text-anchor:middle">Goldbach</text>
<text class="tx" x="700.0" y="106.0" style="text-anchor:middle">Riemann</text>
<text class="sb x" x="610.0" y="164.0">ZFC cannot prove</text>
<text class="sb x" x="610.0" y="178.0">whether it halts</text>
<text class="hd" x="390.0" y="212.0" style="text-anchor:middle">NUMBER OF STATES (NOT TO SCALE)</text>
</svg>
