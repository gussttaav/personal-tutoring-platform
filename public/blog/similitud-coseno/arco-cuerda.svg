<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 726 280" width="726" height="280" role="img"
 aria-label="Dos paneles. A la izquierda, dos vectores de longitud uno, dibujados como flechas, A en horizontal y B a sesenta grados, sobre un arco de circunferencia. Se marcan tres formas de medir lo lejos que están: el arco entre sus puntas, que mide el ángulo theta; la cuerda, el segmento recto entre las dos puntas; y, sobre el vector A, el trozo que va desde la sombra de B hasta la punta de A, que mide uno menos el coseno. A la derecha, las tres medidas en función del ángulo, de 0 a 180 grados. Las tres crecen siempre, así que ordenan los pares igual. El ángulo y la cuerda arrancan en línea recta y casi juntos; uno menos el coseno arranca plano, vale 0,29 a 45 grados y 1,00 a 90: doblar el ángulo lo multiplica por más de tres.">
