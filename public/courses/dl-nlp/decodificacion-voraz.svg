<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 122" width="540" height="183" role="img" aria-label="Cinco columnas, una por paso del decoder; en cada una gana un token, y en la quinta gana el simbolo de fin.">
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    .paso { font-size: 10px; fill: #86948a; }
    .tok  { font-size: 10.5px; fill: #bbcabf; }
    .pr   { font-size: 10px; fill: #86948a; text-anchor: end; }
    .gana { fill: #4edea3; }
    .barra    { fill: rgba(134,148,138,0.45); }
    .barragana{ fill: #4edea3; }
    .prod { font-size: 10px; fill: #86948a; text-anchor: middle; }
    .regla { stroke: rgba(134,148,138,0.28); stroke-width: 1; }
  </style>

  <!-- Paso 1 — «i», el pronombre que el espanol no escribe. -->
  <text class="paso" x="8" y="12">paso 1</text>
  <text class="tok gana" x="8" y="32">i</text><text class="pr" x="64" y="32">0.94</text>
  <rect class="barragana" x="8" y="35" width="52.6" height="6" rx="1" />
  <text class="tok" x="8" y="56">read</text><text class="pr" x="64" y="56">0.04</text>
  <rect class="barra" x="8" y="59" width="2.2" height="6" rx="1" />
  <text class="tok" x="8" y="80">sell</text><text class="pr" x="64" y="80">0.02</text>
  <rect class="barra" x="8" y="83" width="2" height="6" rx="1" />

  <!-- Paso 2 — el verbo. -->
  <text class="paso" x="78" y="12">paso 2</text>
  <text class="tok gana" x="78" y="32">sell</text><text class="pr" x="134" y="32">0.88</text>
  <rect class="barragana" x="78" y="35" width="49.3" height="6" rx="1" />
  <text class="tok" x="78" y="56">read</text><text class="pr" x="134" y="56">0.09</text>
  <rect class="barra" x="78" y="59" width="5" height="6" rx="1" />
  <text class="tok" x="78" y="80">new</text><text class="pr" x="134" y="80">0.03</text>
  <rect class="barra" x="78" y="83" width="2" height="6" rx="1" />

  <!-- Paso 3 — el adjetivo se adelanta al sustantivo: aqui la columna esta menos decidida. -->
  <text class="paso" x="148" y="12">paso 3</text>
  <text class="tok gana" x="148" y="32">new</text><text class="pr" x="204" y="32">0.71</text>
  <rect class="barragana" x="148" y="35" width="39.8" height="6" rx="1" />
  <text class="tok" x="148" y="56">cars</text><text class="pr" x="204" y="56">0.21</text>
  <rect class="barra" x="148" y="59" width="11.8" height="6" rx="1" />
  <text class="tok" x="148" y="80">red</text><text class="pr" x="204" y="80">0.08</text>
  <rect class="barra" x="148" y="83" width="4.5" height="6" rx="1" />

  <!-- Paso 4 — el sustantivo, que llevaba tres pasos esperando. -->
  <text class="paso" x="218" y="12">paso 4</text>
  <text class="tok gana" x="218" y="32">cars</text><text class="pr" x="274" y="32">0.85</text>
  <rect class="barragana" x="218" y="35" width="47.6" height="6" rx="1" />
  <text class="tok" x="218" y="56">books</text><text class="pr" x="274" y="56">0.12</text>
  <rect class="barra" x="218" y="59" width="6.7" height="6" rx="1" />
  <text class="tok" x="218" y="80">new</text><text class="pr" x="274" y="80">0.03</text>
  <rect class="barra" x="218" y="83" width="2" height="6" rx="1" />

  <!-- Paso 5 — el token que detiene el bucle. -->
  <text class="paso" x="288" y="12">paso 5</text>
  <text class="tok gana" x="288" y="32">&lt;EOS&gt;</text><text class="pr" x="344" y="32">0.96</text>
  <rect class="barragana" x="288" y="35" width="53.8" height="6" rx="1" />
  <text class="tok" x="288" y="56">cars</text><text class="pr" x="344" y="56">0.03</text>
  <rect class="barra" x="288" y="59" width="2" height="6" rx="1" />
  <text class="tok" x="288" y="80">red</text><text class="pr" x="344" y="80">0.01</text>
  <rect class="barra" x="288" y="83" width="2" height="6" rx="1" />

  <line class="regla" x1="8" y1="97" x2="352" y2="97" />
  <text class="prod" x="180" y="113">0.94 · 0.88 · 0.71 · 0.85 · 0.96 = 0.48</text>
</svg>
