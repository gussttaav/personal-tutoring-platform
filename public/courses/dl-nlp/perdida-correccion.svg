<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300" role="img" aria-label="Una gráfica con la preactivación z de menos 6 a 6 en el eje horizontal y la corrección, de 0 a 1, en el vertical, para un ejemplo cuya etiqueta vale 1. La curva de la entropía cruzada, en verde, entra por la esquina superior izquierda pegada al 1, baja atravesando el centro por 0,5 y termina pegada al 0 en la derecha: decrece sin parar. La curva del MSE, en gris, entra por la esquina inferior izquierda pegada al 0, sube hasta un máximo de 0,30 poco antes del centro y vuelve a caer hasta el 0 por la derecha: es una joroba con las dos colas en el suelo. En el extremo izquierdo, donde la red se equivoca con más seguridad, la curva verde vale casi 1 y la gris casi 0.">
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    .caja { stroke: rgba(134,148,138,0.30); stroke-width: 1; fill: none; }
    .eje { stroke: #86948a; stroke-width: 1.2; fill: none; }
    .tick { stroke: #86948a; stroke-width: 1.2; }
    .gr { stroke: #3a3a3d; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
    .num { font-size: 12.5px; fill: #86948a; }
    .var { font-size: 12.5px; fill: #86948a; }
    /* La que sobrevive va en verde, como en el resto del curso; la que se descarta,
       en gris. Dos tonos y ninguno nuevo: el tema del sitio no tiene más. */
    .ec { stroke: #4edea3; stroke-width: 2.2; fill: none; stroke-linejoin: round; }
    .mse { stroke: #bbcabf; stroke-width: 1.8; fill: none; stroke-linejoin: round; }
    .guia { stroke: #86948a; stroke-width: 1; fill: none; }
    .rot-ec { font-size: 12.5px; fill: #4edea3; }
    .rot-mse { font-size: 12.5px; fill: #bbcabf; text-anchor: end; }
    .cap { font-size: 13px; fill: #86948a; text-anchor: middle; }
  </style>

  <!-- Caja de 46,34 a 334,238: z de -6 a 6 (24 px por unidad), corrección de 0 a 1. -->

  <line class="gr" x1="46" y1="136" x2="334" y2="136" />
  <line class="gr" x1="190" y1="34" x2="190" y2="238" />
  <rect class="caja" x="46" y="34" width="288" height="204" />

  <line class="eje" x1="46" y1="238" x2="334" y2="238" />
  <line class="eje" x1="46" y1="34" x2="46" y2="238" />

  <line class="tick" x1="118" y1="238" x2="118" y2="243" />
  <line class="tick" x1="190" y1="238" x2="190" y2="243" />
  <line class="tick" x1="262" y1="238" x2="262" y2="243" />
  <text class="num" x="46" y="256" text-anchor="middle">−6</text>
  <text class="num" x="118" y="256" text-anchor="middle">−3</text>
  <text class="num" x="190" y="256" text-anchor="middle">0</text>
  <text class="num" x="262" y="256" text-anchor="middle">3</text>
  <text class="num" x="334" y="256" text-anchor="middle">6</text>
  <text class="var" x="342" y="243">z</text>

  <line class="tick" x1="41" y1="34" x2="46" y2="34" />
  <line class="tick" x1="41" y1="136" x2="46" y2="136" />
  <text class="num" x="37" y="38" text-anchor="end">1</text>
  <text class="num" x="37" y="140" text-anchor="end">0,5</text>
  <text class="num" x="37" y="242" text-anchor="end">0</text>
  <text class="var" x="18" y="136" text-anchor="middle" transform="rotate(-90 18 136)">corrección</text>

  <polyline class="mse" points="46.0,237.0 52.0,236.7 58.0,236.4 64.0,235.9 70.0,235.3 76.0,234.6 82.0,233.6 88.0,232.4 94.0,230.9 100.0,229.1 106.0,226.7 112.0,223.9 118.0,220.4 124.0,216.3 130.0,211.6 136.0,206.2 142.0,200.3 148.0,194.2 154.0,188.2 160.0,183.1 166.0,179.4 172.0,177.6 178.0,178.3 184.0,181.5 190.0,187.0 196.0,194.0 202.0,201.8 208.0,209.5 214.0,216.4 220.0,222.3 226.0,226.9 232.0,230.4 238.0,232.9 244.0,234.6 250.0,235.8 256.0,236.6 262.0,237.1 268.0,237.5 274.0,237.7 280.0,237.8 286.0,237.9 292.0,237.9 298.0,238.0 304.0,238.0 310.0,238.0 316.0,238.0 322.0,238.0 328.0,238.0 334.0,238.0" />

  <polyline class="ec" points="46.0,34.5 52.0,34.6 58.0,34.8 64.0,35.1 70.0,35.4 76.0,35.7 82.0,36.2 88.0,36.9 94.0,37.7 100.0,38.7 106.0,40.0 112.0,41.6 118.0,43.7 124.0,46.3 130.0,49.5 136.0,53.5 142.0,58.3 148.0,64.2 154.0,71.2 160.0,79.4 166.0,88.9 172.0,99.4 178.0,111.0 184.0,123.3 190.0,136.0 196.0,148.7 202.0,161.0 208.0,172.6 214.0,183.1 220.0,192.6 226.0,200.8 232.0,207.8 238.0,213.7 244.0,218.5 250.0,222.5 256.0,225.7 262.0,228.3 268.0,230.4 274.0,232.0 280.0,233.3 286.0,234.3 292.0,235.1 298.0,235.8 304.0,236.3 310.0,236.6 316.0,236.9 322.0,237.2 328.0,237.4 334.0,237.5" />

  <text class="rot-ec" x="52" y="26">entropía cruzada</text>

  <line class="guia" x1="128" y1="192" x2="158" y2="183" />
  <text class="rot-mse" x="124" y="196">MSE</text>

  <text class="cap" x="180" y="288">a la izquierda la red falla, y falla con seguridad</text>
</svg>
