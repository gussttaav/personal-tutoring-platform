<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 266" width="540" height="399" role="img"
     aria-label="Three columns, one per width: d_k equal to 4, 16 and 64. At the top, the same row of six undivided scores in each column, with bars that grow with the width. Below, three rows of softmax share-outs, each with six bars, by the divisor applied first. Undivided, the largest weight rises from 0.68 to 0.92 and to 0.99 until it fills the whole bar. Dividing by the root of d_k, the highlighted row, the share-out is the same in all three columns, with the largest weight at 0.43. Dividing by d_k, the largest weight falls from 0.29 to 0.23 and to 0.20, and the six bars even out.">
