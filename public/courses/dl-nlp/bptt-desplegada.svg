<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 118" width="540" height="177" role="img" aria-label="Una fila de cuatro cajas iguales etiquetadas h uno a h cuatro. A la derecha del todo está la pérdida, ele minúscula; de ella sale una flecha verde hacia la izquierda, rotulada W hache y griega traspuesta, que entra en la cuarta caja. Entre cada caja y la de su izquierda hay otra flecha verde apuntando a la izquierda, y las tres llevan el mismo rótulo, W hache hache traspuesta. De la parte de abajo de cada una de las cuatro cajas baja una flecha gris a una misma barra horizontal. Dentro de la barra está escrito el gradiente de W hache hache respecto de la pérdida. Las cuatro flechas entran en la misma barra.">
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    .caja { stroke: rgba(134,148,138,0.55); stroke-width: 1.2; fill: none; }
    .nombre { font-size: 13px; fill: #bbcabf; text-anchor: middle; }
    /* El rótulo de la matriz recurrente se repite idéntico en los tres saltos y en la
       flecha de la pérdida: ésa es la carga del dibujo, la misma W_hh en todos. */
    .peso { font-size: 11px; fill: #86948a; text-anchor: middle; }
    /* Verde para el error que vuelve por la fila; gris para las aportaciones que caen
       al mismo sitio, como todo lo compartido en el dibujo de la lección anterior. */
    .flujo { stroke: #4edea3; stroke-width: 1.3; fill: none; }
    .baja { stroke: rgba(134,148,138,0.55); stroke-width: 1.2; fill: none; }
    .perdida { font-size: 14px; fill: #bbcabf; text-anchor: middle; }
    .grad { font-size: 12px; fill: #bbcabf; text-anchor: middle; }
  </style>

  <defs>
    <marker id="gv" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#4edea3" />
    </marker>
    <marker id="gd" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="rgba(134,148,138,0.75)" />
    </marker>
  </defs>

  <!-- La pérdida, colgada del último estado. -->
  <text class="perdida" x="320" y="43">&#8467;</text>
  <line class="flujo" x1="308" y1="38" x2="281" y2="38" marker-end="url(#gv)" />
  <text class="peso" x="294" y="18">W<tspan font-size="9" dy="3">hy</tspan><tspan font-size="9" dy="-7">&#8868;</tspan></text>

  <!-- Los tres saltos hacia atrás, con el mismo rótulo los tres. -->
  <text class="peso" x="222" y="18">W<tspan font-size="9" dy="3">hh</tspan><tspan font-size="9" dy="-7">&#8868;</tspan></text>
  <text class="peso" x="154" y="18">W<tspan font-size="9" dy="3">hh</tspan><tspan font-size="9" dy="-7">&#8868;</tspan></text>
  <text class="peso" x="86" y="18">W<tspan font-size="9" dy="3">hh</tspan><tspan font-size="9" dy="-7">&#8868;</tspan></text>
  <line class="flujo" x1="232" y1="38" x2="213" y2="38" marker-end="url(#gv)" />
  <line class="flujo" x1="164" y1="38" x2="145" y2="38" marker-end="url(#gv)" />
  <line class="flujo" x1="96" y1="38" x2="77" y2="38" marker-end="url(#gv)" />

  <!-- Las cuatro posiciones. Cajas idénticas. -->
  <rect class="caja" x="30" y="26" width="44" height="24" />
  <rect class="caja" x="98" y="26" width="44" height="24" />
  <rect class="caja" x="166" y="26" width="44" height="24" />
  <rect class="caja" x="234" y="26" width="44" height="24" />
  <text class="nombre" x="52" y="43">h<tspan font-size="10" dy="3">1</tspan></text>
  <text class="nombre" x="120" y="43">h<tspan font-size="10" dy="3">2</tspan></text>
  <text class="nombre" x="188" y="43">h<tspan font-size="10" dy="3">3</tspan></text>
  <text class="nombre" x="256" y="43">h<tspan font-size="10" dy="3">4</tspan></text>

  <!-- Cada posición deja su aportación en la misma barra. -->
  <line class="baja" x1="52" y1="50" x2="52" y2="65" marker-end="url(#gd)" />
  <line class="baja" x1="120" y1="50" x2="120" y2="65" marker-end="url(#gd)" />
  <line class="baja" x1="188" y1="50" x2="188" y2="65" marker-end="url(#gd)" />
  <line class="baja" x1="256" y1="50" x2="256" y2="65" marker-end="url(#gd)" />

  <rect class="caja" x="26" y="68" width="258" height="22" rx="5" />
  <text class="grad" x="155" y="83">&#8711;W<tspan font-size="9" dy="3">hh</tspan><tspan font-size="9" dy="-3"> &#8467;</tspan></text>
</svg>
