<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 203.4" width="360" height="203.4" role="img" aria-label="Un mapa de curvas de nivel de una pérdida, alargado en horizontal. Por el centro, de lado a lado, pasa una recta horizontal rotulada las cuatro filas iguales; sobre ella, siete puntos que vienen de la derecha y se van juntando hasta pararse en el centro, marcado con un círculo y rotulado punto de silla. Justo encima y justo debajo de ese centro hay dos manchas verdes alargadas, cada una con un punto verde en medio rotulado mínimo, y dos flechas cortas salen del centro hacia arriba y hacia abajo, perpendiculares a la recta, una hacia cada mancha. Ninguna de las dos flechas apunta a lo largo de la recta. El borde izquierdo lleva escrito, en vertical, las filas se separan.">
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    .valle { fill: rgba(78,222,163,0.10); stroke: none; }
    .nivel { fill: none; stroke: #86948a; stroke-width: 1; opacity: 0.30; }
    .separatriz { fill: none; stroke: #86948a; stroke-width: 1; opacity: 0.55; }
    .recta { stroke: #4edea3; stroke-width: 2; fill: none; }
    .paso { fill: #4edea3; }
    .salida { stroke: #4edea3; stroke-width: 1.8; fill: none; }
    .minimo { fill: #4edea3; stroke: #e5e1e4; stroke-width: 1.4; }
    .silla { fill: #353437; stroke: #4edea3; stroke-width: 2; }
    .rot { font-size: 12.5px; fill: #86948a; }
    .guia { stroke: #86948a; stroke-width: 1; opacity: 0.75; fill: none; }
  </style>

