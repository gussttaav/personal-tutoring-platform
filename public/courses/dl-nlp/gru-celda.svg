<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 204" width="540" height="306" role="img" aria-label="Un paso de una GRU, dibujado como una caja. Por arriba la cruza de lado a lado una línea verde: entra etiquetada h sub t menos uno y sale etiquetada h sub t, y por el camino sólo se encuentra dos círculos, uno con un punto dentro y otro con un signo más. Debajo hay tres cajitas en fila, etiquetadas z, r y h con tilde. De la z sube una flecha de puntos, marcada uno menos, al círculo del punto de la línea verde; a media altura se le separa una rama que va hacia la derecha, por encima de las otras dos cajitas, hasta otro círculo con un punto, al que también sube la cajita h con tilde, y de ese círculo sube una sola flecha al círculo del más. Antes del primer círculo baja de la línea verde una línea de puntos que corre por debajo de las cajitas y alimenta a la z y a la r, junto con x sub t, que entra por la izquierda más abajo. La r no alimenta directamente a la h con tilde: su flecha llega a un tercer círculo con un punto, al que sube desde abajo esa misma línea del estado anterior, y sólo lo que sale de él entra en la h con tilde, que por abajo recibe x sub t. A la derecha no hay nada más: ni compuerta de salida ni tangente hiperbólica, y la línea verde que sale es la única salida.">
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    .caja { stroke: rgba(134,148,138,0.55); stroke-width: 1.2; fill: none; }
    .celda { stroke: rgba(134,148,138,0.28); stroke-width: 1.2; fill: none; }
    /* La vía aditiva va en verde, como en lstm-celda.svg: es la única línea del
       dibujo que atraviesa el paso entero sin cruzar una matriz. Aquí además es el
       estado oculto mismo, así que no hay una segunda línea que colgar de ella. */
    .via { stroke: #4edea3; stroke-width: 1.6; fill: none; }
    .hilo { stroke: rgba(134,148,138,0.7); stroke-width: 1.2; stroke-dasharray: 2 3; fill: none; }
    .nodo { stroke: rgba(134,148,138,0.7); stroke-width: 1.2; fill: none; }
    .nombre { font-size: 13px; fill: #bbcabf; text-anchor: middle; }
    .izq { text-anchor: start; }
    .verde { font-size: 13px; fill: #4edea3; }
    .op { font-size: 13px; fill: #bbcabf; text-anchor: middle; }
    .nota { font-size: 11px; fill: #86948a; }
    .sub { font-size: 9.5px; }
  </style>

  <defs>
    <marker id="pv" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#4edea3" />
    </marker>
    <marker id="pg" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="rgba(134,148,138,0.7)" />
    </marker>
  </defs>

  <!-- El paso: todo lo que ocurre entre una posición y la siguiente. -->
  <rect class="celda" x="56" y="22" width="272" height="164" rx="6" />

  <!-- La vía aditiva, de lado a lado: entra h_{t-1} y sale h_t, sin segundo estado. -->
  <text class="verde" x="8" y="44">h<tspan class="sub" dy="3">t-1</tspan></text>
  <text class="verde" x="352" y="44" text-anchor="end">h<tspan class="sub" dy="3">t</tspan></text>
  <line class="via" x1="8" y1="52" x2="352" y2="52" marker-end="url(#pv)" />
  <circle class="via" cx="128" cy="52" r="9" />
  <circle cx="128" cy="52" r="2.4" fill="#4edea3" />
  <circle class="via" cx="276" cy="52" r="9" />
  <text class="op" x="276" y="57" fill="#4edea3">+</text>

  <!-- Las tres piezas que se calculan en el paso. -->
  <rect class="caja" x="112" y="110" width="32" height="22" rx="3" />
  <text class="nombre" x="128" y="125">z</text>
  <rect class="caja" x="172" y="110" width="32" height="22" rx="3" />
  <text class="nombre" x="188" y="125">r</text>
  <rect class="caja" x="260" y="110" width="32" height="22" rx="3" />
  <text class="nombre" x="276" y="119">~</text>
  <text class="nombre" x="276" y="130">h</text>

  <!-- Lo que z hace sobre la vía: un mismo mando que se reparte. Hacia arriba,
       pasando por 1 −, escala lo que se conserva; por la rama, dosifica cuánto
       candidato se suma. El círculo de la rama va en gris, como el i·c~ de la
       LSTM: todavía no es la vía, sólo lo que se le escribe. -->
  <line class="hilo" x1="128" y1="110" x2="128" y2="64" marker-end="url(#pg)" />
  <text class="nota" x="122" y="80" text-anchor="end">1 −</text>
  <circle cx="128" cy="88" r="1.8" fill="rgba(134,148,138,0.9)" />
  <line class="hilo" x1="128" y1="88" x2="264" y2="88" marker-end="url(#pg)" />
  <line class="hilo" x1="276" y1="110" x2="276" y2="100" marker-end="url(#pg)" />
  <circle class="nodo" cx="276" cy="88" r="9" />
  <circle cx="276" cy="88" r="2.4" fill="#bbcabf" />
  <line class="hilo" x1="276" y1="79" x2="276" y2="64" marker-end="url(#pg)" />

  <!-- Lo que hace r: no toca la vía. Filtra el estado anterior antes de que el
       candidato lo lea, y el candidato no tiene otro acceso a él. -->
  <line class="hilo" x1="204" y1="121" x2="218" y2="121" marker-end="url(#pg)" />
  <circle class="nodo" cx="230" cy="121" r="9" />
  <circle cx="230" cy="121" r="2.4" fill="#bbcabf" />
  <line class="hilo" x1="239" y1="121" x2="258" y2="121" marker-end="url(#pg)" />

  <!-- El estado anterior, leído: baja de la vía antes de que nada lo escale, corre
       por debajo de las compuertas y acaba en el filtro de r. -->
  <polyline class="hilo" points="80,52 80,154 230,154 230,133" marker-end="url(#pg)" />

  <!-- El token: lo leen las tres piezas, y es lo único que el candidato lee sin filtro. -->
  <text class="nombre izq" x="8" y="170">x<tspan class="sub" dy="3">t</tspan></text>
  <line class="caja" x1="8" y1="176" x2="44" y2="176" />
  <polyline class="hilo" points="44,176 276,176 276,134" marker-end="url(#pg)" />

  <!-- Las dos compuertas leen las dos cosas: el punto marca dónde se juntan. -->
  <line class="hilo" x1="128" y1="176" x2="128" y2="134" marker-end="url(#pg)" />
  <circle cx="128" cy="154" r="1.8" fill="rgba(134,148,138,0.9)" />
  <line class="hilo" x1="188" y1="176" x2="188" y2="134" marker-end="url(#pg)" />
  <circle cx="188" cy="154" r="1.8" fill="rgba(134,148,138,0.9)" />
</svg>
