<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 186" width="540" height="279" role="img"
     aria-label="Arriba, seis puntuaciones con signo alrededor de un eje. Abajo, los cuatro repartos que el softmax hace de ellas: el de la izquierda tras dividir entre la raíz de d_k, y los otros tres sin dividir con d_k igual a 4, 16 y 64. El reparto se concentra en una sola barra a medida que crece d_k.">
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    .barra { fill: #4edea3; }
    .carril { fill: rgba(134,148,138,0.13); }
    .eje { stroke: rgba(134,148,138,0.55); stroke-width: 1; }
    .llave { stroke: rgba(134,148,138,0.5); stroke-width: 1; fill: none; }
    .flecha { stroke: rgba(134,148,138,0.7); stroke-width: 1.3; fill: none; }
    .est { font-size: 10.5px; fill: #bbcabf; text-anchor: middle; }
    .nota { font-size: 10.5px; fill: #86948a; text-anchor: middle; }
    .sub { font-size: 8px; }
  </style>
  <defs>
    <marker id="pf" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="rgba(134,148,138,0.7)" />
    </marker>
  </defs>

  <!-- Las seis puntuaciones de partida: el mismo patrón alimenta los cuatro repartos. -->
  <text class="est" x="180" y="16">las mismas seis puntuaciones en los cuatro casos</text>
  <rect class="barra" x="144.5" y="37.0" width="9.0" height="11.0" rx="1.5" />
  <rect class="barra" x="156.9" y="48.0" width="9.0" height="4.9" rx="1.5" />
  <rect class="barra" x="169.3" y="29.6" width="9.0" height="18.4" rx="1.5" />
  <rect class="barra" x="181.7" y="45.5" width="9.0" height="2.5" rx="1.5" />
  <rect class="barra" x="194.1" y="48.0" width="9.0" height="13.5" rx="1.5" />
  <rect class="barra" x="206.5" y="40.6" width="9.0" height="7.4" rx="1.5" />
  <line class="eje" x1="138.5" y1="48.0" x2="221.5" y2="48.0" />

  <!-- De las puntuaciones a los pesos: una sola operación, el softmax por filas. -->
  <path class="flecha" d="M180 70 L180 90" marker-end="url(#pf)" />
  <text class="nota" x="219.5" y="102">sin dividir</text>
  <path class="llave" d="M97.0 112 L97.0 108 L342.0 108 L342.0 112" />

  <!-- Un grupo por caso. El carril de fondo marca las seis posiciones aunque el peso sea cero. -->
  <rect class="carril" x="16.0" y="116.0" width="9.0" height="44.0" rx="1.5" />
  <rect class="barra" x="16.0" y="150.1" width="9.0" height="9.9" rx="1.5" />
  <rect class="carril" x="28.4" y="116.0" width="9.0" height="44.0" rx="1.5" />
  <rect class="barra" x="28.4" y="157.7" width="9.0" height="2.3" rx="1.5" />
  <rect class="carril" x="40.8" y="116.0" width="9.0" height="44.0" rx="1.5" />
  <rect class="barra" x="40.8" y="140.8" width="9.0" height="19.2" rx="1.5" />
  <rect class="carril" x="53.2" y="116.0" width="9.0" height="44.0" rx="1.5" />
  <rect class="barra" x="53.2" y="155.5" width="9.0" height="4.5" rx="1.5" />
  <rect class="carril" x="65.6" y="116.0" width="9.0" height="44.0" rx="1.5" />
  <rect class="barra" x="65.6" y="158.9" width="9.0" height="1.1" rx="1.5" />
  <rect class="carril" x="78.0" y="116.0" width="9.0" height="44.0" rx="1.5" />
  <rect class="barra" x="78.0" y="153.0" width="9.0" height="7.0" rx="1.5" />
  <line class="eje" x1="13.0" y1="160.0" x2="90.0" y2="160.0" />
  <text class="est" x="51.5" y="176">tras dividir</text>
  <rect class="carril" x="100.0" y="116.0" width="9.0" height="44.0" rx="1.5" />
  <rect class="barra" x="100.0" y="152.1" width="9.0" height="7.9" rx="1.5" />
  <rect class="carril" x="112.4" y="116.0" width="9.0" height="44.0" rx="1.5" />
  <rect class="barra" x="112.4" y="159.6" width="9.0" height="0.4" rx="1.5" />
  <rect class="carril" x="124.8" y="116.0" width="9.0" height="44.0" rx="1.5" />
  <rect class="barra" x="124.8" y="130.1" width="9.0" height="29.9" rx="1.5" />
  <rect class="carril" x="137.2" y="116.0" width="9.0" height="44.0" rx="1.5" />
  <rect class="barra" x="137.2" y="158.3" width="9.0" height="1.7" rx="1.5" />
  <rect class="carril" x="149.6" y="116.0" width="9.0" height="44.0" rx="1.5" />
  <rect class="carril" x="162.0" y="116.0" width="9.0" height="44.0" rx="1.5" />
  <rect class="barra" x="162.0" y="156.0" width="9.0" height="4.0" rx="1.5" />
  <line class="eje" x1="97.0" y1="160.0" x2="174.0" y2="160.0" />
  <text class="est" x="135.5" y="176">d<tspan class="sub" dy="2">k</tspan><tspan dy="-2"> = 4</tspan></text>
  <rect class="carril" x="184.0" y="116.0" width="9.0" height="44.0" rx="1.5" />
  <rect class="barra" x="184.0" y="157.2" width="9.0" height="2.8" rx="1.5" />
  <rect class="carril" x="196.4" y="116.0" width="9.0" height="44.0" rx="1.5" />
  <rect class="carril" x="208.8" y="116.0" width="9.0" height="44.0" rx="1.5" />
  <rect class="barra" x="208.8" y="119.7" width="9.0" height="40.3" rx="1.5" />
  <rect class="carril" x="221.2" y="116.0" width="9.0" height="44.0" rx="1.5" />
  <rect class="carril" x="233.6" y="116.0" width="9.0" height="44.0" rx="1.5" />
  <rect class="carril" x="246.0" y="116.0" width="9.0" height="44.0" rx="1.5" />
  <rect class="barra" x="246.0" y="159.3" width="9.0" height="0.7" rx="1.5" />
  <line class="eje" x1="181.0" y1="160.0" x2="258.0" y2="160.0" />
  <text class="est" x="219.5" y="176">d<tspan class="sub" dy="2">k</tspan><tspan dy="-2"> = 16</tspan></text>
  <rect class="carril" x="268.0" y="116.0" width="9.0" height="44.0" rx="1.5" />
  <rect class="barra" x="268.0" y="159.8" width="9.0" height="0.2" rx="1.5" />
  <rect class="carril" x="280.4" y="116.0" width="9.0" height="44.0" rx="1.5" />
  <rect class="carril" x="292.8" y="116.0" width="9.0" height="44.0" rx="1.5" />
  <rect class="barra" x="292.8" y="116.2" width="9.0" height="43.8" rx="1.5" />
  <rect class="carril" x="305.2" y="116.0" width="9.0" height="44.0" rx="1.5" />
  <rect class="carril" x="317.6" y="116.0" width="9.0" height="44.0" rx="1.5" />
  <rect class="carril" x="330.0" y="116.0" width="9.0" height="44.0" rx="1.5" />
  <line class="eje" x1="265.0" y1="160.0" x2="342.0" y2="160.0" />
  <text class="est" x="303.5" y="176">d<tspan class="sub" dy="2">k</tspan><tspan dy="-2"> = 64</tspan></text>
</svg>
