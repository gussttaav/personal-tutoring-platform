<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 158" width="540" height="237" role="img" aria-label="Arriba, una barra horizontal etiquetada x a su izquierda y dividida en seis segmentos iguales numerados del uno al seis, uno por posición de la secuencia. El tercer segmento y el quinto están sombreados en verde y llevan encima la etiqueta «no». Debajo, un rectángulo ancho etiquetado W uno, de la misma anchura que la barra y dividido en seis bloques de columnas alineados con los segmentos de arriba y numerados igual, del uno al seis; de esos bloques sólo están sombreados el tercero y el quinto. Dos líneas de puntos verdes bajan del tercer segmento al tercer bloque y del quinto al quinto. Bajo el rectángulo, su forma: d uno por T max por d model.">
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    .caja { stroke: rgba(134,148,138,0.55); stroke-width: 1.2; fill: none; }
    .div { stroke: rgba(134,148,138,0.22); stroke-width: 1; }
    /* Las dos posiciones que llevan la misma entrada, y los dos bloques que la
       multiplican, se sombrean igual: el dibujo dice justo eso, que es la misma
       entrada y no son los mismos pesos. */
    .franja { fill: rgba(78,222,163,0.16); }
    .nombre { font-size: 13px; fill: #bbcabf; text-anchor: middle; }
    /* Los dos rótulos del margen izquierdo terminan donde empieza la caja. */
    .izq { text-anchor: end; }
    .forma { font-size: 12.5px; fill: #86948a; text-anchor: middle; }
    .num { font-size: 12.5px; fill: #86948a; text-anchor: middle; }
    .mencion { font-size: 12.5px; fill: #4edea3; text-anchor: middle; }
    .hilo { stroke: #4edea3; stroke-width: 1.2; stroke-dasharray: 2 3; opacity: 0.75; }
  </style>

  <!-- «no», encima de las dos posiciones que lo llevan. -->
  <text class="mencion" x="159" y="18">«no»</text>
  <text class="mencion" x="259" y="18">«no»</text>

  <!-- x — la concatenación: seis segmentos, uno por posición. -->
  <text class="nombre izq" x="28" y="42">x</text>
  <rect class="franja" x="134" y="26" width="50" height="22" />
  <rect class="franja" x="234" y="26" width="50" height="22" />
  <line class="div" x1="84" y1="26" x2="84" y2="48" />
  <line class="div" x1="134" y1="26" x2="134" y2="48" />
  <line class="div" x1="184" y1="26" x2="184" y2="48" />
  <line class="div" x1="234" y1="26" x2="234" y2="48" />
  <line class="div" x1="284" y1="26" x2="284" y2="48" />
  <rect class="caja" x="34" y="26" width="300" height="22" />
  <text class="num" x="59" y="42">1</text>
  <text class="num" x="109" y="42">2</text>
  <text class="num" x="159" y="42">3</text>
  <text class="num" x="209" y="42">4</text>
  <text class="num" x="259" y="42">5</text>
  <text class="num" x="309" y="42">6</text>

  <!-- Cada posición cae en su bloque, y sólo en el suyo. -->
  <line class="hilo" x1="159" y1="50" x2="159" y2="70" />
  <line class="hilo" x1="259" y1="50" x2="259" y2="70" />

  <!-- W(1) — la misma anchura, partida por los mismos sitios. -->
  <text class="nombre izq" x="28" y="105">W<tspan font-size="10" dy="-4">(1)</tspan></text>
  <rect class="franja" x="134" y="72" width="50" height="56" />
  <rect class="franja" x="234" y="72" width="50" height="56" />
  <line class="div" x1="84" y1="72" x2="84" y2="128" />
  <line class="div" x1="134" y1="72" x2="134" y2="128" />
  <line class="div" x1="184" y1="72" x2="184" y2="128" />
  <line class="div" x1="234" y1="72" x2="234" y2="128" />
  <line class="div" x1="284" y1="72" x2="284" y2="128" />
  <rect class="caja" x="34" y="72" width="300" height="56" />
  <text class="num" x="59" y="105">1</text>
  <text class="num" x="109" y="105">2</text>
  <text class="num" x="159" y="105">3</text>
  <text class="num" x="209" y="105">4</text>
  <text class="num" x="259" y="105">5</text>
  <text class="num" x="309" y="105">6</text>

  <text class="forma" x="184" y="147">d<tspan font-size="10" dy="3">1</tspan><tspan dy="-3"> × T</tspan><tspan font-size="10" dy="3">max</tspan><tspan dy="-3"> · d</tspan><tspan font-size="10" dy="3">model</tspan></text>
</svg>
