<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 332" width="360" height="332" role="img" aria-label="El plano de las dos coordenadas, con los ejes x1 y x2 marcados en menos 1 y 1. Dos rectas paralelas de pendiente negativa, x1 + x2 = 1 y x1 + x2 = menos 1, dejan entre ellas una franja sombreada en verde que cruza el dibujo de la esquina superior izquierda a la inferior derecha. Los dos puntos verdes, en menos 1 coma 1 y en 1 coma menos 1, caen dentro de la franja; los dos puntos huecos, en menos 1 coma menos 1 y en 1 coma 1, caen fuera, uno en cada lado. Cada una de las tres regiones lleva escrito el vector que la capa oculta le asigna: 1 coma 0 en la franja, 0 coma 0 en la región de abajo a la izquierda y 1 coma 1 en la de arriba a la derecha.">
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
    .caja { stroke: rgba(134,148,138,0.30); stroke-width: 1; fill: none; }
    .franja { fill: rgba(78,222,163,0.10); }
    .recta { stroke: #4edea3; stroke-width: 2; fill: none; }
    .eje { stroke: #86948a; stroke-width: 1.2; fill: none; }
    .tick { stroke: #86948a; stroke-width: 1.2; }
    .num { font-size: 12.5px; fill: #86948a; }
    .var { font-size: 12.5px; fill: #86948a; }
    .ecu { font-size: 12.5px; fill: #4edea3; text-anchor: middle; }
    .reg { font-size: 13px; fill: #bbcabf; text-anchor: middle; }
    .cap { font-size: 13px; fill: #86948a; text-anchor: middle; }
    /* Mismo código de color que el explorable de arriba: la clase positiva va
       rellena de verde y la otra hueca, para que el lector no tenga que
       traducir entre el widget y la figura. */
    .pos { fill: #4edea3; stroke: #e5e1e4; stroke-width: 1.4; }
    .neg { fill: #353437; stroke: #e5e1e4; stroke-width: 1.4; }
  </style>

  <!-- Centro (180,160), 54 px por unidad, ventana de -2,2 a 2,2 en los dos ejes. -->

  <polygon class="franja" points="115.2,41.2 298.8,224.8 298.8,278.8 244.8,278.8 61.2,95.2 61.2,41.2" />
  <rect class="caja" x="61.2" y="41.2" width="237.6" height="237.6" />

  <line class="eje" x1="61.2" y1="160" x2="298.8" y2="160" />
  <line class="eje" x1="180" y1="41.2" x2="180" y2="278.8" />

  <line class="tick" x1="126" y1="156" x2="126" y2="164" />
  <line class="tick" x1="234" y1="156" x2="234" y2="164" />
  <line class="tick" x1="176" y1="106" x2="184" y2="106" />
  <line class="tick" x1="176" y1="214" x2="184" y2="214" />
  <text class="num" x="126" y="180" text-anchor="middle">−1</text>
  <text class="num" x="234" y="180" text-anchor="middle">1</text>
  <text class="num" x="168" y="111" text-anchor="end">1</text>
  <text class="num" x="168" y="219" text-anchor="end">−1</text>
  <text class="var" x="305" y="164">x<tspan font-size="10" dy="4">1</tspan></text>
  <text class="var" x="186" y="36">x<tspan font-size="10" dy="4">2</tspan></text>

  <line class="recta" x1="115.2" y1="41.2" x2="298.8" y2="224.8" />
  <line class="recta" x1="61.2" y1="95.2" x2="244.8" y2="278.8" />
  <text class="ecu" x="115" y="30">x<tspan font-size="10" dy="4">1</tspan><tspan dy="-4"> + x</tspan><tspan font-size="10" dy="4">2</tspan><tspan dy="-4"> = 1</tspan></text>
  <text class="ecu" x="245" y="296">x<tspan font-size="10" dy="4">1</tspan><tspan dy="-4"> + x</tspan><tspan font-size="10" dy="4">2</tspan><tspan dy="-4"> = −1</tspan></text>

  <text class="reg" x="104" y="76">(1, 0)</text>
  <text class="reg" x="258" y="76">(1, 1)</text>
  <text class="reg" x="102" y="244">(0, 0)</text>

  <circle class="pos" cx="126" cy="106" r="8" />
  <circle class="pos" cx="234" cy="214" r="8" />
  <circle class="neg" cx="126" cy="214" r="8" />
  <circle class="neg" cx="234" cy="106" r="8" />

  <text class="cap" x="180" y="320">la franja entre las dos rectas es la clase positiva</text>
</svg>
